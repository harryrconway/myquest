<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Your Password | MyQuest</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260611b">
  <link rel="stylesheet" href="login.css">
</head>
<body class="login-page">

  <main id="sp-main" class="login-main">
    <div class="login-card">

      <!-- Loading -->
      <div class="login-state" id="state-loading">
        <div class="login-logo-wrap">
          <svg width="140" height="36" viewBox="0 0 140 36" fill="none" aria-hidden="true">
            <path d="M4 18 C4 8 12 2 20 2 C20 2 20 14 12 20 C8 23 4 22 4 18 Z" fill="#2d6a4f"/>
            <path d="M20 2 C20 2 22 16 14 22" stroke="#2d6a4f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <text x="28" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="18" fill="#1a1a1a">MyQuest</text>
          </svg>
        </div>
        <p class="login-sub" style="margin-top:1.5rem;">Verifying your invitation…</p>
      </div>

      <!-- Set Password Form -->
      <div class="login-state" id="state-form" hidden>
        <div class="login-logo-wrap">
          <svg width="140" height="36" viewBox="0 0 140 36" fill="none" aria-hidden="true">
            <path d="M4 18 C4 8 12 2 20 2 C20 2 20 14 12 20 C8 23 4 22 4 18 Z" fill="#2d6a4f"/>
            <path d="M20 2 C20 2 22 16 14 22" stroke="#2d6a4f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <text x="28" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="18" fill="#1a1a1a">MyQuest</text>
          </svg>
        </div>
        <h1 class="login-heading">Create your password</h1>
        <p class="login-sub">Choose a strong password to secure your account.</p>

        <div class="login-error-block" id="sp-error" hidden></div>

        <form id="sp-form" class="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="sp-password">New Password</label>
            <div class="pw-input-wrap">
              <input class="form-input" type="password" id="sp-password" name="password"
                autocomplete="new-password" placeholder="Min. 8 characters" required>
              <button type="button" class="pw-toggle" id="pw-toggle-sp" aria-label="Show password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="sp-confirm">Confirm Password</label>
            <div class="pw-input-wrap">
              <input class="form-input" type="password" id="sp-confirm" name="confirm"
                autocomplete="new-password" placeholder="Repeat your password" required>
              <button type="button" class="pw-toggle" id="pw-toggle-confirm" aria-label="Show confirm password">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-primary login-submit" id="sp-submit">Set Password</button>
        </form>
      </div>

      <!-- Success -->
      <div class="login-state" id="state-done" hidden>
        <div class="login-check" aria-hidden="true">
          <svg class="check-icon" viewBox="0 0 72 72" fill="none">
            <circle class="check-circle" cx="36" cy="36" r="32" stroke="#2d6a4f" stroke-width="3"/>
            <path class="check-mark" d="M20 36L30 46L52 24" stroke="#2d6a4f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="login-heading">Password set!</h2>
        <p class="login-sub">Taking you to the dashboard…</p>
      </div>

      <!-- Invalid / Expired Link -->
      <div class="login-state" id="state-invalid" hidden>
        <div class="login-logo-wrap">
          <svg width="140" height="36" viewBox="0 0 140 36" fill="none" aria-hidden="true">
            <path d="M4 18 C4 8 12 2 20 2 C20 2 20 14 12 20 C8 23 4 22 4 18 Z" fill="#2d6a4f"/>
            <path d="M20 2 C20 2 22 16 14 22" stroke="#2d6a4f" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <text x="28" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="18" fill="#1a1a1a">MyQuest</text>
          </svg>
        </div>
        <h2 class="login-heading" style="color:#dc2626;">Link expired</h2>
        <p class="login-sub">This invitation link has expired or is invalid. Ask your manager to send a new invitation.</p>
        <a href="login.html" class="btn-primary login-submit" style="display:block;text-align:center;margin-top:1.5rem;text-decoration:none;">Back to Login</a>
      </div>

    </div>
  </main>

  <script src="dashboard/js/supabase.js"></script>
  <script src="dashboard/js/supabase-client.js"></script>
  <script src="set-password.js?v=20260611a"></script>

</body>
</html>
