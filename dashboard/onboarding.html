<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Welcome to MyQuest</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="js/supabase.js?v=20260621"></script>
  <script src="js/supabase-client.js?v=20260622"></script>
  <script src="js/store.js?v=20260621"></script>
  <script src="js/auth.js?v=20260613"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: linear-gradient(135deg, #f0fdf4 0%, #eff6ff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 48px;
    }
    .ob-logo {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 28px; margin-top: 8px;
    }
    .ob-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
      width: 100%; max-width: 560px;
      overflow: hidden;
    }
    .ob-progress-bar {
      height: 4px; background: #e2e8f0;
    }
    .ob-progress-fill {
      height: 100%; background: linear-gradient(90deg, #22c55e, #16a34a);
      transition: width 0.4s ease;
    }
    .ob-header {
      padding: 28px 32px 0;
    }
    .ob-step-label {
      font-size: 12px; font-weight: 600; color: #94a3b8;
      text-transform: uppercase; letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .ob-title {
      font-size: 22px; font-weight: 800; color: #0f172a;
      margin-bottom: 6px;
    }
    .ob-subtitle {
      font-size: 14px; color: #64748b; line-height: 1.5;
    }
    .ob-body { padding: 24px 32px; }
    .ob-footer {
      padding: 16px 32px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      border-top: 1px solid #f1f5f9;
    }
    .ob-field { margin-bottom: 18px; }
    .ob-label {
      display: block; font-size: 13px; font-weight: 600; color: #374151;
      margin-bottom: 6px;
    }
    .ob-label span { font-weight: 400; color: #94a3b8; margin-left: 4px; }
    .ob-input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #e2e8f0; border-radius: 10px;
      font-family: inherit; font-size: 14px; color: #0f172a;
      background: #fff; outline: none; transition: border-color 0.15s;
    }
    .ob-input:focus { border-color: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.12); }
    .ob-input::placeholder { color: #94a3b8; }
    .ob-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .ob-upload-area {
      border: 2px dashed #e2e8f0; border-radius: 12px;
      padding: 20px 16px; text-align: center; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      position: relative;
    }
    .ob-upload-area:hover { border-color: #22c55e; background: #f0fdf4; }
    .ob-upload-area.has-file { border-color: #22c55e; background: #f0fdf4; }
    .ob-upload-area input[type="file"] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    .ob-upload-icon { margin-bottom: 8px; color: #94a3b8; }
    .ob-upload-text { font-size: 13px; color: #64748b; }
    .ob-upload-filename { font-size: 13px; font-weight: 600; color: #16a34a; margin-top: 4px; }
    .ob-photo-wrap {
      display: flex; align-items: center; gap: 20px; margin-bottom: 4px;
    }
    .ob-photo-preview {
      width: 72px; height: 72px; border-radius: 18px;
      background: #334155; display: flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 800; color: #fff; flex-shrink: 0;
      overflow: hidden; position: relative;
    }
    .ob-photo-preview img { width: 100%; height: 100%; object-fit: cover; }
    .ob-check-group { display: flex; flex-direction: column; gap: 10px; }
    .ob-check-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
      cursor: pointer; transition: border-color 0.15s, background 0.15s;
      user-select: none;
    }
    .ob-check-item:hover { border-color: #22c55e; background: #f0fdf4; }
    .ob-check-item.selected { border-color: #22c55e; background: #f0fdf4; }
    .ob-check-item input[type="checkbox"] { accent-color: #16a34a; width: 16px; height: 16px; flex-shrink: 0; }
    .ob-check-item label { font-size: 14px; font-weight: 500; color: #0f172a; cursor: pointer; flex: 1; }
    .ob-time-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .ob-pill {
      padding: 8px 16px; border: 1.5px solid #e2e8f0; border-radius: 99px;
      font-size: 13px; font-weight: 500; color: #64748b; cursor: pointer;
      transition: all 0.15s; user-select: none;
    }
    .ob-pill:hover { border-color: #22c55e; color: #16a34a; }
    .ob-pill.selected { border-color: #22c55e; background: #f0fdf4; color: #16a34a; font-weight: 600; }
    .ob-agreement-box {
      border: 1.5px solid #e2e8f0; border-radius: 12px;
      padding: 16px; max-height: 160px; overflow-y: auto;
      font-size: 13px; color: #475569; line-height: 1.7;
      background: #fafafa; margin-bottom: 12px;
    }
    .ob-agreement-box h4 { font-size: 13px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    .ob-agreement-box p { margin-bottom: 8px; }
    .ob-agreement-box p:last-child { margin-bottom: 0; }
    .ob-agree-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px;
      margin-bottom: 10px; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .ob-agree-row.checked { border-color: #22c55e; background: #f0fdf4; }
    .ob-agree-row input[type="checkbox"] { accent-color: #16a34a; width: 16px; height: 16px; flex-shrink: 0; margin-top: 2px; }
    .ob-agree-row label { font-size: 13.5px; color: #374151; cursor: pointer; line-height: 1.5; }
    .ob-agree-row a { color: #16a34a; text-decoration: underline; }
    .btn-primary {
      padding: 11px 24px; background: #16a34a; color: #fff;
      border: none; border-radius: 10px; font-family: inherit;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s; min-width: 100px;
    }
    .btn-primary:hover { background: #15803d; }
    .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-outline {
      padding: 11px 20px; background: transparent; color: #475569;
      border: 1.5px solid #e2e8f0; border-radius: 10px; font-family: inherit;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-outline:hover { border-color: #94a3b8; color: #0f172a; }
    .btn-skip {
      background: none; border: none; font-family: inherit;
      font-size: 13px; color: #94a3b8; cursor: pointer;
      padding: 8px 4px; text-decoration: underline;
    }
    .btn-skip:hover { color: #64748b; }
    .ob-error {
      font-size: 13px; color: #dc2626; margin-top: 8px;
      padding: 8px 12px; background: #fef2f2; border-radius: 8px;
      display: none;
    }
    .ob-success {
      padding: 48px 32px; text-align: center;
    }
    .ob-success__icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 6px 28px rgba(34,197,94,0.3);
      animation: ob-pop 0.45s cubic-bezier(0.22,1.25,0.36,1) both;
    }
    @keyframes ob-pop {
      0% { transform: scale(0) rotate(-30deg); opacity: 0; }
      75% { transform: scale(1.1) rotate(4deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    @keyframes ob-spin { to { transform: rotate(360deg); } }
    .ob-day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .ob-day-btn {
      aspect-ratio: 1; border: 1.5px solid #e2e8f0; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: #64748b;
      cursor: pointer; transition: all 0.15s; user-select: none;
      background: #fff;
    }
    .ob-day-btn:hover { border-color: #22c55e; color: #16a34a; }
    .ob-day-btn.selected { border-color: #22c55e; background: #f0fdf4; color: #16a34a; }
    .ob-divider {
      border: none; border-top: 1px solid #f1f5f9; margin: 20px 0;
    }
    @media (max-width: 600px) {
      .ob-card { border-radius: 16px; }
      .ob-header { padding: 20px 20px 0; }
      .ob-body { padding: 20px 20px; }
      .ob-footer { padding: 14px 20px 24px; }
      .ob-title { font-size: 19px; }
      .ob-row-2 { grid-template-columns: 1fr; }
      .ob-day-grid { gap: 6px; }
    }
  </style>
</head>
<body>

  <div class="ob-logo">
    <svg width="120" height="30" viewBox="0 0 140 36" fill="none" aria-hidden="true">
      <path d="M4 18 C4 8 12 2 20 2 C20 2 20 14 12 20 C8 23 4 22 4 18 Z" fill="#16a34a"/>
      <path d="M20 2 C20 2 22 16 14 22" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <text x="28" y="25" font-family="'Plus Jakarta Sans',system-ui,sans-serif" font-weight="700" font-size="18" fill="#0f172a">MyQuest</text>
    </svg>
  </div>

  <div class="ob-card">
    <div class="ob-progress-bar"><div class="ob-progress-fill" id="ob-progress" style="width:0%"></div></div>

    <div id="ob-step-wrap">
      <!-- Steps rendered by JS -->
    </div>

    <div id="ob-success" class="ob-success" hidden>
      <div class="ob-success__icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2 style="font-size:22px;font-weight:800;color:#0f172a;margin-bottom:8px;">You're all set!</h2>
      <p style="font-size:14.5px;color:#64748b;line-height:1.6;max-width:320px;margin:0 auto 4px;">Your profile is complete. Taking you to the dashboard…</p>
    </div>
  </div>

  <script src="js/ui.js?v=20260616" defer></script>
  <script src="js/onboarding.js?v=20260613" defer></script>
</body>
</html>
