  <style>
    .staff-row {
      display: flex; align-items: center; gap: 14px;
      padding: 13px 14px; border-radius: 10px; cursor: pointer;
      transition: background .12s; border: 1.5px solid transparent;
    }
    .staff-row:hover    { background: #f8fafc; }
    .staff-row.is-selected { background: #f0f9ff; border-color: #bae6fd; }

    .staff-row__photo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg,#334155,#1e293b);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; font-weight: 800; color: #fff;
      flex-shrink: 0; overflow: hidden;
    }
    .staff-row__photo img { width: 100%; height: 100%; object-fit: cover; }
    .staff-row__info { flex: 1; min-width: 0; }
    .staff-row__name { font-size: 14px; font-weight: 700; color: #0f172a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .staff-row__role { font-size: 11.5px; color: #64748b; margin-top: 2px; text-transform: capitalize; }
    .staff-row__badges { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .staff-tick { width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .staff-tick--ok { background: #dcfce7; color: #16a34a; }
    .staff-tick--no { background: #f1f5f9; color: #cbd5e1; }

    .staff-badge { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; text-transform: uppercase; letter-spacing: .03em; }
    .staff-badge--suspended { background: #fee2e2; color: #dc2626; }
    .staff-badge--invited   { background: #fef9c3; color: #92400e; }

    /* Detail panel tabs */
    .staff-panel-tabs { display: flex; gap: 0; border-bottom: 1px solid #f1f5f9; padding: 0 20px; overflow-x: auto; }
    .staff-panel-tab {
      padding: 10px 10px; font-size: 12px; font-weight: 600; color: #94a3b8;
      background: none; border: none; cursor: pointer;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      font-family: inherit; transition: color .12s, border-color .12s; white-space: nowrap;
    }
    .staff-panel-tab:hover     { color: #475569; }
    .staff-panel-tab.is-active { color: #0f172a; border-bottom-color: #000; }

    .staff-panel-body { padding: 16px 20px; max-height: calc(100vh - 260px); overflow-y: auto; }

    .sp-field { margin-bottom: 12px; }
    .sp-label { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; display: block; }
    .sp-input {
      width: 100%; padding: 8px 11px;
      border: 1.5px solid #e2e8f0; border-radius: 8px;
      font-family: inherit; font-size: 13px; color: #0f172a;
      background: #fff; outline: none; transition: border-color .12s;
    }
    .sp-input:focus { border-color: #000; }
    .sp-input[readonly] { background: #f8fafc; color: #64748b; cursor: default; }
    .sp-input[readonly]:focus { border-color: #e2e8f0; }
    .sp-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sp-save-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .sp-msg-ok  { font-size: 12px; font-weight: 600; color: #059669; }
    .sp-msg-err { font-size: 12px; font-weight: 600; color: #dc2626; }

    .doc-slot { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 1.5px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; }
    .doc-slot__info { flex: 1; min-width: 0; }
    .doc-slot__name   { font-size: 13px; font-weight: 600; color: #0f172a; }
    .doc-slot__status { font-size: 11.5px; color: #94a3b8; margin-top: 2px; }
    .doc-slot__actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

    .btn-micro {
      font-size: 11.5px; font-weight: 600; padding: 5px 10px;
      border-radius: 7px; border: 1.5px solid #e2e8f0; background: #fff;
      color: #374151; cursor: pointer; font-family: inherit; transition: all .12s; white-space: nowrap;
    }
    .btn-micro:hover { border-color: #94a3b8; background: #f8fafc; }
    .btn-micro--primary { background: #000; color: #fff; border-color: #000; }
    .btn-micro--primary:hover { background: #333; }
    .btn-micro--danger { color: #dc2626; border-color: #fecaca; }
    .btn-micro--danger:hover { background: #fef2f2; }

    .staff-colour-swatches { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 6px; }
    .staff-swatch { width: 26px; height: 26px; border-radius: 7px; cursor: pointer; border: 2px solid transparent; transition: transform .12s, border-color .12s; }
    .staff-swatch:hover { transform: scale(1.15); }
    .staff-swatch.is-active { border-color: #000; }

    .staff-empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 48px 24px; text-align: center; }
    .staff-empty-state svg { margin-bottom: 12px; opacity: .25; }
    .staff-empty-state p { font-size: 13px; color: #94a3b8; line-height: 1.6; }
  </style>

  <!-- Modal: Add Staff Member -->
  <div class="modal-overlay" id="modal-add-staff" hidden>
    <div class="modal-card" style="max-width:460px;">
      <div class="modal-header">
        <div>
          <h2 class="modal-title">Add Staff Member</h2>
          <p style="font-size:13px;color:#94a3b8;font-weight:500;margin-top:3px;">Send an invite to join your team</p>
        </div>
        <button class="modal-close" id="modal-add-close" aria-label="Close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" style="padding:16px 20px 20px;">
        <div style="display:grid;gap:14px;">
          <div>
            <label class="form-label" for="add-name">Full name <span style="color:#dc2626">*</span></label>
            <input type="text" id="add-name" class="form-input" placeholder="Jane Smith" maxlength="100">
          </div>
          <div>
            <label class="form-label" for="add-email">Email address <span style="color:#dc2626">*</span></label>
            <input type="email" id="add-email" class="form-input" placeholder="jane@example.com" maxlength="200">
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
            <div>
              <label class="form-label" for="add-role">Role <span style="color:#dc2626">*</span></label>
              <select id="add-role" class="form-input">
                <option value="staff">Staff</option>
                <option value="junior-cleaner">Junior Cleaner</option>
                <option value="mid-cleaner">Mid Cleaner</option>
                <option value="senior-cleaner">Senior Cleaner</option>
                <option value="manager">Manager</option>
              </select>
            </div>
            <div>
              <label class="form-label" for="add-start">Start date</label>
              <input type="date" id="add-start" class="form-input">
            </div>
          </div>
          <p id="add-staff-error" style="font-size:13px;color:#dc2626;display:none;padding:10px 12px;background:#fef2f2;border-radius:8px;border:1px solid #fecaca;margin:0;"></p>
          <button id="add-staff-submit" class="btn-primary" style="width:100%;padding:12px;">Send Invitation</button>
        </div>
      </div>
