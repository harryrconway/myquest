    <svg width="100" height="26" viewBox="0 0 140 36" fill="none" aria-hidden="true"><path d="M4 18 C4 8 12 2 20 2 C20 2 20 14 12 20 C8 23 4 22 4 18 Z" fill="white"/><path d="M20 2 C20 2 22 16 14 22" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/><text x="28" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="18" fill="white">MyQuest</text></svg>
    <div style="width:22px"></div>

  <div class="dash-shell">
    <aside class="dash-sidebar" id="dash-sidebar">
      <div class="dash-sidebar__logo"><a href="index.html"><svg width="120" height="30" viewBox="0 0 140 36" fill="none" aria-hidden="true"><path d="M4 18 C4 8 12 2 20 2 C20 2 20 14 12 20 C8 23 4 22 4 18 Z" fill="white"/><path d="M20 2 C20 2 22 16 14 22" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none"/><text x="28" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="18" fill="white">MyQuest</text></svg></a></div>
      <nav class="dash-sidebar__nav">
        <a href="index.html" data-page="dashboard"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg> Dashboard</a>
        <a href="unscheduled-jobs.html" data-page="unscheduled-jobs" data-min-role="manager"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg> Unscheduled Jobs</a>
        <a href="scheduled-jobs.html" data-page="scheduled-jobs"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg> Scheduled Jobs</a>
        <a href="completed-jobs.html" data-page="completed-jobs"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg> Completed Jobs</a>
        <div class="dash-sidebar__section-label">Team</div>
        <a href="staff.html" data-page="staff" data-min-role="manager"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="23" y1="11" x2="17" y2="11"/><line x1="20" y1="8" x2="20" y2="14"/></svg> Staff</a>
        <a href="settings.html" data-page="settings" data-min-role="owner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Settings</a>

      <div class="dash-sidebar__footer">
        <div class="dash-sidebar__user">
          <div class="dash-sidebar__avatar js-user-avatar">H</div>
          <div class="dash-sidebar__user-info">
            <div class="dash-sidebar__user-name js-user-name">Loading…</div>
            <div class="dash-sidebar__user-role js-user-role">staff</div>
          </div>
        </div>
        <button class="dash-sidebar__logout js-logout">Sign Out</button>
      </div>
    </aside>

    <div class="dash-main"><div class="dash-content">

      <div class="jobs-hero jobs-hero--amber">
        <div class="jobs-hero__left">
          <div class="jobs-hero__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          </div>
          <div>
            <h1 class="jobs-hero__title">Unscheduled Jobs</h1>
            <p class="jobs-hero__sub">New quote requests awaiting scheduling</p>
          </div>
        </div>
        <div class="jobs-hero__right">
          <div class="jobs-hero__stat">
            <span class="jobs-hero__count" id="uj-count">—</span>
            <div class="jobs-hero__count-label">requests</div>
          </div>
          <button class="btn-outline" id="btn-refresh">Refresh</button>
        </div>
      </div>

      <div class="jobs-searchbar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="uj-search" class="jobs-search-input" placeholder="Search by name, suburb, service…">
      </div>

      <div id="uj-table-wrap"></div>

    </div></div>
  </div>

  <!-- Modal: View Details -->
  <div class="modal-overlay" id="modal-uj-view" hidden>
    <div class="modal-card modal-card--wide">
      <div class="modal-header">
        <h2 class="modal-title">Quote Request Details</h2>
        <button class="modal-close" data-modal-close="modal-uj-view" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="uj-view-body" style="max-height:70vh;overflow-y:auto;">
        <!-- populated by JS -->
      </div>
      <div class="modal-footer">
        <button class="btn-outline" data-modal-close="modal-uj-view">Close</button>
        <button class="btn-primary" id="uj-view-accept-btn">Accept & Schedule</button>
      </div>
    </div>
  </div>

  <!-- Modal: Accept (Schedule) -->
  <div class="modal-overlay" id="modal-uj-accept" hidden>
    <div class="modal-card modal-card--wide">
      <div class="modal-header">
        <h2 class="modal-title">Schedule Job</h2>
        <button class="modal-close" data-modal-close="modal-uj-accept" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="uj-accept-id">
        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label">Date <span style="color:var(--color-error)">*</span></label>
            <div class="custom-date-picker" id="uj-date-picker">
              <div class="cdp-display cdp-display--placeholder" id="uj-date-display" tabindex="0">Select a date</div>
              <input type="hidden" id="uj-date">
              <div class="cdp-dropdown" id="uj-date-dropdown" hidden>
                <div class="cdp-nav">
                  <button type="button" class="cdp-nav-btn" id="uj-date-prev">&#8249;</button>
                  <span class="cdp-nav-label" id="uj-date-month-label"></span>
                  <button type="button" class="cdp-nav-btn" id="uj-date-next">&#8250;</button>
                </div>
                <div class="cdp-grid" id="uj-date-grid"></div>
              </div>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Time <span style="color:var(--color-error)">*</span></label>
            <div class="custom-time-picker" id="uj-time-picker">
              <select class="ctp-select" id="uj-time-hour"></select>
              <span class="ctp-colon">:</span>
              <select class="ctp-select" id="uj-time-min">
                <option value="00">00</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="45">45</option>
              </select>
              <input type="hidden" id="uj-time">
            </div>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Assign Staff</label>
          <div id="uj-staff-checkboxes" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">
            <!-- populated by JS -->
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="uj-notes">Internal Notes</label>
          <textarea class="form-input" id="uj-notes" rows="3"></textarea>
        </div>
        <div id="uj-accept-error" style="display:none;color:var(--color-error);font-size:0.875rem;margin-top:8px;"></div>
      </div>
      <div class="modal-footer">
        <button class="btn-outline" data-modal-close="modal-uj-accept">Cancel</button>
        <button class="btn-primary" id="uj-accept-submit">Confirm Schedule</button>
      </div>
    </div>
  </div>

  <script src="js/ui.js?v=20260621" defer></script>
  <script src="js/unscheduled-jobs.js?v=20260621" defer></script>
</body>
</html>
