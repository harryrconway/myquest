<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href=/assets/favicon.svg type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>My Roster — MyQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261013b">
<style>
.rs-section-hd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);margin:28px 0 12px}
.rs-section-hd:first-child{margin-top:0}
.rs-list{display:flex;flex-direction:column;gap:8px}
.rs-card{display:grid;grid-template-columns:60px 1fr;background:#fff;border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.rs-date{background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 8px;flex-shrink:0}
.rs-date-day{font-size:22px;font-weight:700;line-height:1;letter-spacing:-.02em}
.rs-date-month{font-size:9.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.6;margin-top:2px}
.rs-date-dow{font-size:9px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;opacity:.45;margin-top:1px}
.rs-body{padding:14px 16px;display:flex;flex-direction:column;gap:3px;min-width:0}
.rs-client{font-size:14px;font-weight:600;color:var(--navy);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-row{display:flex;align-items:center;gap:6px;margin-top:3px;flex-wrap:wrap}
.rs-time{font-size:12.5px;color:var(--stone);display:flex;align-items:center;gap:4px;flex-shrink:0}
.rs-time svg{opacity:.6}
.rs-sep{font-size:12px;color:var(--hair-md);flex-shrink:0}
.rs-site{font-size:12.5px;color:var(--stone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;text-decoration:none}
.rs-site:hover{color:var(--navy);text-decoration:underline}
.rs-summary{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:13px 20px;margin-bottom:20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.rs-sum-item{font-size:13px;color:var(--stone)}
.rs-sum-item strong{color:var(--navy);font-weight:700}
.rs-tags{display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap}
.rs-type{font-size:11px;font-weight:600;background:rgba(0,0,0,.06);color:var(--stone);padding:3px 9px;border-radius:999px;letter-spacing:.01em;white-space:nowrap}
.rs-status{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.rs-status-scheduled{background:var(--amber-bg);color:var(--amber)}
.rs-status-complete{background:var(--green-bg);color:var(--green)}
.rs-status-cancelled{background:var(--red-bg);color:var(--red)}
.rs-status-in-progress{background:rgba(29,111,164,.1);color:#1d6fa4}
.rs-past .rs-date{background:var(--stone)}
.rs-past{opacity:.7}
.rs-empty{text-align:center;padding:64px 20px;color:var(--stone);font-size:14px;line-height:1.7}
.rs-empty strong{display:block;font-size:16px;font-weight:600;color:var(--navy);margin-bottom:6px}
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar staff-sidebar">
    <a class="sb-logo" href="https://myquest.au">
      <img src="/assets/myquest-logo.svg" alt="MyQuest" height="36" style="display:block">
    </a>
    <nav class="sb-nav">
      <a class="sb-item" href="profile.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20v-1a8 8 0 0116 0v1"/></svg>
        <span class="sb-label">My Profile</span>
      </a>
      <a class="sb-item on" href="roster.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        <span class="sb-label">My Roster</span>
      </a>
      <a class="sb-item" href="training.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15z"/></svg>
        <span class="sb-label">Training</span>
      </a>
    </nav>
    <div class="sb-bottom">
      <hr class="sb-div">
      <button class="sb-item" onclick="MQ&&MQ.signOut()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Sign out</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="ph pg-1">
      <a class="mob-logo" href="https://myquest.au"><img src="/assets/myquest-logo.svg" alt="MyQuest" height="36" style="display:block"></a>
      <h1 class="ph-title">My Roster</h1>
    </div>
    <div id="rs-content" class="pg-2">
      <div class="rs-empty"><strong>Loading…</strong></div>
    </div>
  </main>
</div>

<nav class="mob-bnav" id="staff-bnav" aria-label="Navigation">
  <a href="profile.html" class="bnav-tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20v-1a8 8 0 0116 0v1"/></svg>
    <span>Profile</span>
  </a>
  <a href="roster.html" class="bnav-tab bnav-on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
    <span>Roster</span>
  </a>
  <a href="training.html" class="bnav-tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15z"/></svg>
    <span>Training</span>
  </a>
</nav>

<script src="supabase.min.js?v=20260806"></script>
<script src="auth.js?v=20261012"></script>
<script>
(function(){
'use strict';

var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

window.MQ.requireAuth({allowStaff:true},function(session){
  if(MQ.isOwner(session)){location.href='/crm/overview.html';return;}

  fetch('/api/staff-roster',{
    headers:{'Authorization':'Bearer '+session.access_token}
  }).then(function(r){return r.json().then(function(data){return {ok:r.ok,status:r.status,data:data};});}).then(function(res){
    if(!res.ok||res.data.error){
      document.getElementById('rs-content').innerHTML='<div class="rs-empty"><strong>Could not load your roster</strong>Please try refreshing.</div>';
      return;
    }
    render(res.data.jobs||[]);
  }).catch(function(e){
    document.getElementById('rs-content').innerHTML='<div class="rs-empty"><strong>Could not load roster</strong>Please try refreshing.</div>';
  });
});

function render(jobs){
  var now=new Date();
  var today=now.toISOString().split('T')[0];
  var wd=now.getDay()||7;
  var monDate=new Date(now);monDate.setDate(now.getDate()-(wd-1));monDate.setHours(0,0,0,0);
  var sunDate=new Date(monDate);sunDate.setDate(monDate.getDate()+6);
  var monStr=monDate.toISOString().split('T')[0];
  var sunStr=sunDate.toISOString().split('T')[0];
  var thisWeek=jobs.filter(function(j){return j.date>=monStr&&j.date<=sunStr;});
  var weekHrs=thisWeek.reduce(function(a,j){return a+(parseFloat(j.quoted_hrs)||0);},0);

  var upcoming=jobs.filter(function(j){return j.date>=today;});
  var past=jobs.filter(function(j){return j.date<today;}).reverse();

  var html='';
  if(jobs.length){
    html+='<div class="rs-summary">'+
      '<span class="rs-sum-item"><strong>'+thisWeek.length+'</strong> job'+(thisWeek.length!==1?'s':'')+' this week</span>'+
      (weekHrs>0?'<span class="rs-sum-item">~<strong>'+parseFloat(weekHrs.toFixed(1))+'</strong> hrs est.</span>':'')+
    '</div>';
  }
  if(!upcoming.length&&!past.length){
    html+='<div class="rs-empty"><strong>No jobs yet</strong>You don\'t have any jobs scheduled.</div>';
  }else{
    if(upcoming.length){
      html+='<div class="rs-section-hd">Upcoming</div><div class="rs-list">';
      upcoming.forEach(function(j){html+=card(j,false);});
      html+='</div>';
    }
    if(past.length){
      html+='<div class="rs-section-hd">Recent</div><div class="rs-list">';
      past.forEach(function(j){html+=card(j,true);});
      html+='</div>';
    }
  }
  document.getElementById('rs-content').innerHTML=html;
}

function card(j,isPast){
  var d=new Date(j.date+'T12:00:00');
  var day=d.getDate();
  var month=MONTHS[d.getMonth()].toUpperCase();
  var dow=DAYS[d.getDay()];
  var statusKey=(j.status||'scheduled').toLowerCase().replace(/[\s-]+/g,'-');
  var statusLabel=j.status?j.status.charAt(0).toUpperCase()+j.status.slice(1):'Scheduled';
  var time=j.start_time?fmtTime(j.start_time):'';

  var siteHtml=j.site
    ?'<a class="rs-site" href="https://maps.google.com/?q='+encodeURIComponent(j.site)+'" target="_blank" rel="noopener noreferrer">'+esc(j.site)+'</a>'
    :'';
  var jobNum=j.job_number?'<span class="rs-type">#'+String(j.job_number).padStart(3,'0')+'</span>':'';
  return '<div class="rs-card'+(isPast?' rs-past':'')+'">'+
    '<div class="rs-date">'+
      '<span class="rs-date-day">'+day+'</span>'+
      '<span class="rs-date-month">'+month+'</span>'+
      '<span class="rs-date-dow">'+dow+'</span>'+
    '</div>'+
    '<div class="rs-body">'+
      '<div class="rs-client">'+esc(j.client_name||'Unnamed client')+'</div>'+
      '<div class="rs-row">'+
        (time?'<span class="rs-time"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'+esc(time)+'</span>':'')+
        (time&&j.site?'<span class="rs-sep">·</span>':'')+
        siteHtml+
      '</div>'+
      '<div class="rs-tags">'+
        jobNum+
        (j.type?'<span class="rs-type">'+esc(j.type)+'</span>':'')+
        '<span class="rs-status rs-status-'+statusKey+'">'+esc(statusLabel)+'</span>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function fmtTime(t){
  var parts=(t||'').split(':');
  var h=parseInt(parts[0],10);
  var m=parts[1]||'00';
  var ampm=h>=12?'PM':'AM';
  h=h%12||12;
  return h+':'+m+' '+ampm;
}

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

})();
</script>
</body>
</html>
