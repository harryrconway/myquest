<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Clients — MyQuest CRM</title>
<link rel="stylesheet" href="style.css?v=20260910">
<style>
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:180px;max-width:320px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--stone);pointer-events:none}
.search{width:100%;padding:9px 12px 9px 34px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-sm);font-family:var(--font);font-size:13px;color:var(--navy);outline:none;transition:border-color .12s}
.search::placeholder{color:var(--stone)}
.search:focus{border-color:var(--hair-md)}
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.f-pill{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;border:1.5px solid var(--hair-md);background:none;color:var(--stone);cursor:pointer;font-family:var(--font);transition:color .12s,background .12s,border-color .12s}
.f-pill:hover{color:var(--navy);border-color:rgba(35,44,84,.2)}
.f-pill.on{color:var(--navy);background:rgba(35,44,84,.07);border-color:rgba(35,44,84,.18)}

.client-list{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);overflow:hidden}
.cl-head{display:grid;grid-template-columns:2fr 100px 120px 120px 40px;gap:12px;padding:10px 20px;border-bottom:1px solid var(--hair)}
.cl-head span{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone)}
.cl-wrap{border-bottom:1px solid var(--hair)}
.cl-wrap:last-child{border-bottom:none}
.cl-row{display:grid;grid-template-columns:2fr 100px 120px 120px 40px;gap:12px;padding:14px 20px;align-items:center;color:inherit;transition:background .1s;cursor:pointer}
.cl-row:hover{background:rgba(35,44,84,.03)}
.cl-name{font-size:14.5px;font-weight:600;color:var(--navy);margin-bottom:3px;letter-spacing:-.01em}
.cl-sub{font-size:11.5px;color:var(--stone)}
.cl-industry{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--stone);background:rgba(35,44,84,.07);padding:2px 7px;border-radius:4px;margin-top:4px}
.cl-val{font-size:14px;font-variant-numeric:tabular-nums;color:var(--navy)}
.cl-val.warn{color:var(--amber);font-weight:600}
.cl-val.ok{color:var(--stone)}
.cl-next{font-size:13px;color:var(--navy);font-variant-numeric:tabular-nums}
.cl-next.blank{color:var(--stone)}
.cl-arr{color:var(--stone);display:flex;align-items:center;justify-content:flex-end;transition:color .12s,transform .22s}
.cl-row:hover .cl-arr{color:var(--navy)}
.cl-wrap.open .cl-arr{transform:rotate(90deg)}
.cl-body{max-height:0;overflow:hidden;transition:max-height .45s cubic-bezier(.4,0,.2,1)}
.cl-body.open{max-height:12000px}
.cl-inner{padding:22px 24px 26px;border-top:1px solid var(--hair);background:var(--bg)}
.cl-empty{padding:48px 20px;text-align:center;color:var(--stone);font-size:14px}

@media(max-width:760px){
  .tbl-scroll .client-list{min-width:0}
  .cl-head{grid-template-columns:1fr 90px 36px}
  .cl-row{grid-template-columns:1fr 90px 36px}
  .cl-head span:nth-child(3),.cl-head span:nth-child(4){display:none}
  .cl-row>div:nth-child(3),.cl-row>div:nth-child(4){display:none}
  .cl-row>div:first-child{min-width:0}
  .cl-name,.cl-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
}
@media(max-width:520px){
  .cl-head{display:none}
  .cl-row{grid-template-columns:1fr 36px;padding:12px 16px}
  .cl-row>div:nth-child(2),.cl-row>div:nth-child(3),.cl-row>div:nth-child(4){display:none}
  .ci-grid{grid-template-columns:1fr}
  .cl-inner{padding:16px}
}

/* Accordion inner layout */
.ci-hd{margin-bottom:20px}
.ci-badge-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.ci-name{font-size:16px;font-weight:700;letter-spacing:-.02em;color:var(--navy)}
.ci-industry{font-size:11.5px;color:var(--stone);margin-bottom:8px}
.ci-meta{display:flex;flex-direction:column;gap:5px}
.ci-meta-row{display:flex;align-items:center;gap:7px;font-size:13.5px;color:var(--stone)}
.ci-meta-row a{color:inherit;text-decoration:none}
.ci-meta-row a:hover{color:var(--navy)}
.ci-meta-row svg{flex-shrink:0;color:var(--stone)}
.ci-edit-btn{padding:5px 12px;border:1.5px solid var(--hair-md);border-radius:var(--r-sm);background:none;font-family:var(--font);font-size:11.5px;font-weight:600;color:var(--navy);cursor:pointer;transition:border-color .12s}
.ci-edit-btn:hover{border-color:rgba(35,44,84,.3)}
.ci-grid{display:grid;grid-template-columns:1fr 240px;gap:20px}
.ci-sh{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin:0 0 8px;display:flex;align-items:center;justify-content:space-between}
.ci-panel{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);overflow:hidden;margin-bottom:18px}

/* Jobs inside accordion */
.ci-job{display:grid;grid-template-columns:52px 1fr 28px;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--hair);border-left:3px solid transparent;transition:background .1s;cursor:pointer}
.ci-job:last-child{border-bottom:none}
.ci-job.done{border-left-color:var(--green)}
.ci-job.next{border-left-color:var(--navy)}
.ci-job:hover{background:rgba(35,44,84,.03)}
.ci-job-date{font-size:10.5px;color:var(--stone);white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.4}
.ci-job-type{font-size:8px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--stone);background:rgba(35,44,84,.07);padding:2px 5px;border-radius:3px;display:inline-block;margin-bottom:2px}
.ci-job-site{font-size:13px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-job-info{min-width:0;flex:1}
.ci-job-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.ci-job-link{font-size:11px;font-weight:600;color:var(--stone);background:none;border:1px solid var(--hair-md);border-radius:5px;padding:3px 8px;cursor:pointer;font-family:var(--font);white-space:nowrap;transition:color .12s}
.ci-job-link:hover{color:var(--navy)}
.ci-job-del{background:none;border:none;cursor:pointer;padding:4px;color:var(--stone);opacity:.3;line-height:0;transition:opacity .12s,color .12s;flex-shrink:0}
.ci-job-del:hover{opacity:1;color:var(--red)}
.ci-empty{padding:14px 16px;font-size:13.5px;color:var(--stone);font-style:italic}

/* Contracts inside accordion */
.cd-row{display:grid;grid-template-columns:80px 1fr auto;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--hair)}
.cd-row:last-child{border-bottom:none}
.cd-row.ct-clickable{cursor:pointer}
.cd-row.ct-clickable:hover{background:rgba(35,44,84,.03)}
.cd-num{font-size:11.5px;font-weight:600;color:var(--navy)}
.cd-desc{font-size:11.5px;color:var(--stone);min-width:0}
.cd-amt{font-size:12.5px;font-weight:600;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
.ct-empty{padding:14px 16px;font-size:13.5px;color:var(--stone);font-style:italic}
.ct-has-pdf{font-size:8.5px;font-weight:700;letter-spacing:.05em;color:var(--stone);background:rgba(155,150,138,.12);border:1px solid var(--hair);border-radius:3px;padding:1px 5px;margin-left:6px}
.badge.expiring{color:var(--amber);background:var(--amber-bg);border:1px solid rgba(176,125,42,.2)}
.badge.expired{color:var(--stone);background:rgba(155,150,138,.1);border:1px solid rgba(155,150,138,.2)}

/* Notes inside accordion */
.ci-notes-txt{font-size:13.5px;line-height:1.8;color:var(--stone);padding:12px 14px}
.ci-notes-empty{font-size:13.5px;color:var(--stone);opacity:.5;font-style:italic;padding:12px 14px}
.ci-notes-ta{width:100%;padding:10px 12px;background:var(--field);border:none;border-top:1px solid var(--hair);font-family:var(--font);font-size:13.5px;color:var(--navy);line-height:1.8;outline:none;resize:vertical;min-height:80px;box-sizing:border-box;display:block}
.ci-notes-save{padding:8px 12px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--hair)}

/* Action buttons inside accordion */
.ci-act-btn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 14px;border:none;border-bottom:1px solid var(--hair);background:none;font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--navy);cursor:pointer;transition:background .1s;text-align:left}
.ci-act-btn:last-child{border-bottom:none}
.ci-act-btn:hover{background:rgba(35,44,84,.04)}
.ci-act-btn svg{color:var(--stone);flex-shrink:0}
.ci-add-btn{font-size:11.5px;font-weight:600;color:var(--stone);background:none;border:none;cursor:pointer;font-family:var(--font);padding:0;line-height:1}
.ci-add-btn:hover{color:var(--navy)}
.ci-quotes-panel{padding:2px 0}
.ci-quote-card{padding:14px 16px;border-bottom:1px solid var(--hair)}
.ci-quote-card:last-child{border-bottom:none}
.ci-qc-main{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ci-qc-left{flex:1;min-width:0}
.ci-qc-label{font-size:13px;font-weight:700;color:var(--navy);letter-spacing:-.01em;line-height:1.2;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci-qc-label.unnamed{color:var(--stone);font-weight:500;font-style:italic}
.ci-qc-meta{font-size:12px;color:var(--stone);margin-bottom:8px;line-height:1.4}
.ci-qc-pills{display:flex;flex-wrap:wrap;gap:4px}
.ci-qc-pill{font-size:10.5px;font-weight:500;color:var(--stone);background:rgba(35,44,84,.06);border-radius:4px;padding:2px 7px;white-space:nowrap;line-height:1.6}
.ci-qc-right{text-align:right;flex-shrink:0}
.ci-qc-price{font-size:19px;font-weight:700;color:var(--navy);letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.ci-qc-monthly{font-size:11px;color:var(--stone);margin-top:3px;font-variant-numeric:tabular-nums}
.ci-qc-footer{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:9px;border-top:1px solid var(--hair)}
.ci-qc-latest{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:rgba(58,107,78,.1);border-radius:4px;padding:2px 6px;flex-shrink:0}
.ci-qc-date{font-size:11px;color:var(--stone);opacity:.5;flex:1}
.ci-qc-view{background:none;border:1px solid var(--hair-md);border-radius:6px;font-family:var(--font);font-size:11px;font-weight:600;color:var(--stone);cursor:pointer;padding:4px 10px;transition:border-color .12s,color .12s;white-space:nowrap;flex-shrink:0}
.ci-qc-view:hover{border-color:rgba(35,44,84,.3);color:var(--navy)}
.ci-qc-del{background:none;border:none;cursor:pointer;padding:4px;color:var(--stone);opacity:.3;line-height:0;transition:opacity .12s,color .12s;flex-shrink:0}
.ci-qc-del:hover{opacity:1;color:#c0392b}
/* Quote detail modal body */
.qd-band{background:var(--navy);padding:20px 26px 18px}
.qd-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.qd-tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:rgba(243,239,228,.55);background:rgba(243,239,228,.1);border-radius:5px;padding:3px 8px}
.qd-price-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(243,239,228,.5);margin-bottom:5px}
.qd-price{font-size:38px;font-weight:700;color:var(--on);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.qd-sub{font-size:12px;color:rgba(243,239,228,.55);margin-top:6px}
.qd-body{padding:20px 26px 24px}
.qd-sec{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin:18px 0 10px}
.qd-sec:first-child{margin-top:0}
.qd-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair);color:var(--stone);font-size:13px;font-variant-numeric:tabular-nums}
.qd-row:last-child{border-bottom:none}
.qd-row.total{color:var(--navy);font-weight:700;font-size:14px;border-top:1px solid var(--hair-md);border-bottom:none;padding-top:10px;margin-top:4px}
.qd-int{background:var(--field);border-radius:10px;padding:14px 16px;margin-top:16px}
.qd-int-hd{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);opacity:.6;margin-bottom:10px}
.qd-int-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;font-variant-numeric:tabular-nums}
.qd-int-row+.qd-int-row{border-top:1px solid var(--hair);margin-top:4px;padding-top:8px}
.qd-int-lbl{color:var(--stone)}
.qd-int-val{font-weight:600;color:var(--navy)}
.qd-int-val.green{color:var(--green)}
.ci-qhist{margin:4px 8px 8px}
.ci-qhist-sum{font-size:11.5px;font-weight:600;color:var(--stone);cursor:pointer;list-style:none;padding:8px 6px;border-radius:7px;transition:background .12s;display:flex;align-items:center;gap:6px}
.ci-qhist-sum::-webkit-details-marker{display:none}
.ci-qhist-sum::before{content:'▸';font-size:9px;color:var(--stone);opacity:.5;transition:transform .15s;display:inline-block}
details[open] .ci-qhist-sum::before{transform:rotate(90deg)}
.ci-qhist-sum:hover{background:var(--hair);color:var(--navy)}
.ci-qhist-body{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.ci-qhist-body .ci-quote-card{margin:0;opacity:.75}
.ci-qhist-body .ci-quote-card:hover{opacity:1}

.ct-upload-btn,.ct-pdf-view,.ct-pdf-replace{padding:6px 12px;border:1.5px solid var(--hair-md);border-radius:var(--r-sm);background:none;font-family:var(--font);font-size:12px;font-weight:600;color:var(--stone);cursor:pointer;transition:color .12s}
.ct-upload-btn:hover,.ct-pdf-view:hover,.ct-pdf-replace:hover{color:var(--navy)}
.ct-pdf-name{font-size:12.5px;color:var(--navy);font-weight:500;margin-right:8px}
.ct-pdf-clear{background:none;border:none;font-family:var(--font);font-size:12px;color:var(--stone);cursor:pointer}
.ct-pdf-clear:hover{color:var(--red)}
@media(max-width:820px){.ci-grid{grid-template-columns:1fr}.ci-grid>div:last-child{order:-1}}
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="sb-logo" href="https://myquest.au">
      <div class="sb-mark">MQ</div>
      <span class="sb-name">MyQuest</span>
    </a>
    <nav class="sb-nav">
      <a class="sb-item" href="overview.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Overview
      </a>
      <a class="sb-item on" href="index.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clients
      </a>
      <a class="sb-item" href="jobs.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Jobs
      </a>
      <a class="sb-item" href="inquiries.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
        Inquiries
        <span class="sb-notif" id="inq-notif"></span>
      </a>
      <a class="sb-item" href="scope.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
        Scope
      </a>
      <hr class="sb-div">
      <a class="sb-item" href="calculator.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 7h8"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01"/></svg>
        Calculator
      </a>
      <a class="sb-item" href="reports.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        Reports
      </a>
      <a class="sb-item" href="staff.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
        Staff
      </a>
    </nav>
    <div class="sb-bottom">
      <button class="sb-item" onclick="MQ&&MQ.signOut()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <main class="main">

    <div class="ph pg-1">
      <button class="mob-menu-btn" id="mob-menu" aria-label="Open menu"><span class="mob-bar"></span><span class="mob-bar"></span><span class="mob-bar"></span></button>
      <h1 class="ph-title">Clients</h1>
      <button class="ph-btn" id="new-client-btn">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New client
      </button>
    </div>

    <div class="stats pg-2" id="stats-strip"></div>

    <div class="toolbar pg-3">
      <div class="search-wrap">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search" type="text" placeholder="Search clients…">
      </div>
      <div class="filters">
        <button class="f-pill on" data-filter="all">All</button>
        <button class="f-pill" data-filter="active">Active</button>
        <button class="f-pill" data-filter="onboarding">Onboarding</button>
        <button class="f-pill" data-filter="exited">Exited</button>
      </div>
    </div>

    <div class="pg-4">
      <div class="tbl-scroll">
        <div class="client-list">
          <div class="cl-head">
            <span>Client</span><span>Status</span><span>Next clean</span>
            <span>Contract</span><span></span>
          </div>
          <div id="cl-body"></div>
        </div>
      </div>
    </div>

<script>
(function(){
'use strict';
window.MQ.requireAuth(function(){
var sb=MQ.sb;
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var TL2={maintenance:'Maintenance',deep:'Deep clean',window:'Window clean',builders:'Builders clean'};

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDateShort(iso){if(!iso)return'—';var d=new Date(iso+'T00:00:00');return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();}
function fmtNextClean(iso){if(!iso)return null;var d=new Date(iso+'T00:00:00');return d.getDate()+' '+MONTHS[d.getMonth()]+' · '+DAYS[d.getDay()];}
function contractStatus(ct){
  if(!ct.end_date)return{cls:'active',lbl:'Ongoing'};
  var today=new Date();today.setHours(0,0,0,0);
  var end=new Date(ct.end_date+'T00:00:00');
  var soon=new Date();soon.setDate(soon.getDate()+60);
  if(end<today)return{cls:'expired',lbl:'Expired'};
  if(end<=soon)return{cls:'expiring',lbl:'Expiring soon'};
  return{cls:'active',lbl:'Active'};
}
var CT_TYPE_LABELS={'12-month':'12-month','6-month':'6-month','ongoing':'Ongoing','trial':'Trial','ad-hoc':'Ad hoc'};
function renderContractRow(ct){
  var typeLbl=CT_TYPE_LABELS[ct.type]||ct.type||'Contract';
  var dates='';
  if(ct.start_date||ct.end_date)dates=(ct.start_date?fmtDateShort(ct.start_date):'—')+' → '+(ct.end_date?fmtDateShort(ct.end_date):'ongoing');
  var st=contractStatus(ct);
  return '<div class="cd-row ct-clickable" data-ct-id="'+esc(ct.id)+'">'+
    '<div class="cd-num">'+esc(typeLbl)+'</div>'+
    '<div class="cd-desc">'+esc(dates)+(ct.pdf_path?'<span class="ct-has-pdf">PDF</span>':'')+(ct.notes?'<div style="font-size:10.5px;color:var(--stone);margin-top:2px">'+esc(ct.notes)+'</div>':'')+'</div>'+
    '<span class="badge '+st.cls+'" style="font-size:8.5px;white-space:nowrap">'+st.lbl+'</span>'+
  '</div>';
}

var allClients=[],allJobs=[],allContracts=[];
var activeFilter='all',searchTerm='';
function getParam(name){var m=(window.location.search||'').match(new RegExp('[?&]'+name+'=([^&]*)'));return m?decodeURIComponent(m[1]):null;}

function loadAll(cb){
  sb.from('clients').select('id,name,status,contact,contact_title,email,industry,phone,notes,site_address,created_at').order('name').then(function(r1){
    allClients=r1.data||[];

      allJobs=r2.data||[];

        allContracts=r3.data||[];
        if(cb)cb();
      });
    });
  });
}

var _quoteStore={};

function openQuoteDetail(q){
  var RATE=70,SUP=20,BUF_PCT=0.15,STAFF_PCT=0.35;
  var SPACE_MAP={office:'Office',retail:'Retail',medical:'Medical',industrial:'Industrial'};
  var FREQ_MAP={once:'One-off',weekly:'Weekly',fortnightly:'Fortnightly',monthly:'Monthly'};
  var MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var ANN_MULT={monthly:12,fortnightly:26,weekly:52};
  var d=new Date(q.created_at);
  var dStr=d.getDate()+' '+MO[d.getMonth()]+' '+d.getFullYear();
  var spaceLbl=q.space?(SPACE_MAP[q.space]||q.space):null;
  var freqLbl=q.freq?(FREQ_MAP[q.freq]||q.freq):null;
  var typeStr=q.type==='deep'?'Deep clean':'Maintenance';
  var hrs=parseFloat(q.hrs)||0;
  var baseLabour=hrs*RATE;
  var ahAmt=q.after_hours_pct>0?baseLabour*(q.after_hours_pct/100):0;
  var labour=baseLabour+ahAmt;
  var preBuf=labour+SUP;
  var bufAmt=q.buffer?preBuf*BUF_PCT:0;
  var per=preBuf+bufAmt;
  var staffCost=Math.round(per*STAFF_PCT);
  var margin=Math.round(per*(1-STAFF_PCT));
  var annVal=ANN_MULT[q.freq]?Math.round(per*ANN_MULT[q.freq]):null;
  function au(n){return'$'+Math.round(n).toLocaleString('en-AU');}
  function qrow(l,v,cls){return'<div class="qd-row'+(cls?' '+cls:'')+'"><span>'+l+'</span><span>'+v+'</span></div>';}
  var tags='';
  if(spaceLbl)tags+='<span class="qd-tag">'+esc(spaceLbl)+'</span>';
  tags+='<span class="qd-tag">'+hrs+' hrs</span>';
  if(freqLbl)tags+='<span class="qd-tag">'+esc(freqLbl)+'</span>';
  tags+='<span class="qd-tag">'+typeStr+'</span>';
  var subParts=[];
  if(q.monthly)subParts.push('~'+au(q.monthly)+' / mo');
  if(annVal)subParts.push('~'+au(annVal)+' / yr');
  var h='<div class="qd-band">'+
    '<div class="qd-tags">'+tags+'</div>'+
    '<div class="qd-price-lbl">Per clean</div>'+
    '<div class="qd-price">'+au(per)+'</div>'+
    (subParts.length?'<div class="qd-sub">'+subParts.join(' &middot; ')+'</div>':'')+
  '</div>'+
  '<div class="qd-body">'+
    '<div class="qd-sec">Cost breakdown</div>'+
    qrow(hrs+' hrs &times; $'+RATE+'/hr',au(baseLabour))+
    (ahAmt>0?qrow('After-hours loading (+'+q.after_hours_pct+'%)','+'+au(ahAmt)):'')+
    qrow('Cleaning supplies &amp; equipment',au(SUP))+
    (bufAmt>0?qrow('Site allowance (+'+Math.round(BUF_PCT*100)+'%)','+'+au(bufAmt)):'')+
    qrow('Total per clean',au(per),'total')+
    '<div class="qd-sec">Internal — not on client quote</div>'+
    '<div class="qd-int">'+
      '<div class="qd-int-hd">Margin split</div>'+
      '<div class="qd-int-row"><span class="qd-int-lbl">Staff cost ('+Math.round(STAFF_PCT*100)+'%)</span><span class="qd-int-val">~'+au(staffCost)+'</span></div>'+
      '<div class="qd-int-row"><span class="qd-int-lbl">Your margin ('+(100-Math.round(STAFF_PCT*100))+'%)</span><span class="qd-int-val green">~'+au(margin)+'</span></div>'+
    '</div>'+
    '<div class="qd-sec" style="margin-top:18px">Details</div>'+
    qrow('Saved',dStr)+
    (q.label?qrow('Label',esc(q.label)):'')+
    qrow('Clean type',typeStr)+
    (freqLbl?qrow('Frequency',freqLbl):'')+
    (q.after_hours_pct>0?qrow('After-hours loading',q.after_hours_pct+'%'):'')+
    qrow('Site allowance',q.buffer?'Included':'Not included')+
  '</div>';
  var title=q.label||((spaceLbl?spaceLbl+' — ':'')+typeStr);
  document.getElementById('qd-title').textContent=title;
  document.getElementById('qd-body').innerHTML=h;
  document.getElementById('qd-modal').hidden=false;
  document.body.style.overflow='hidden';
}

function closeQuoteDetail(){
  document.getElementById('qd-modal').hidden=true;
  document.body.style.overflow='';
}

document.getElementById('qd-close').addEventListener('click',closeQuoteDetail);

function buildClientDetail(c,jobs,contracts,quotes){
  var bc=c.status==='active'?'active':c.status==='onboarding'?'onboarding':'exited';
  var bl=(c.status||'active');bl=bl.charAt(0).toUpperCase()+bl.slice(1);
  var hdr='<div class="ci-hd">'+
    '<div class="ci-badge-row"><span class="ci-name">'+esc(c.name)+'</span><span class="badge '+bc+'">'+bl+'</span>'+
    '<button class="ci-edit-btn" data-edit-id="'+esc(c.id)+'">Edit client</button></div>'+
    (c.industry?'<div class="ci-industry">'+esc(c.industry)+'</div>':'')+

    (function(){if(!c.created_at)return'';var since=new Date(c.created_at);var mths=Math.floor((new Date()-since)/(1000*60*60*24*30.44));var sinceStr=MONTHS[since.getMonth()]+' '+since.getFullYear()+(mths>0?' · '+mths+(mths===1?' month':' months'):'');return'<div class="ci-meta-row"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Client since '+sinceStr+'</div>';})()+
    '</div></div>';
  jobs.sort(function(a,b){return a.date>b.date?-1:1;});

  var ctHtml=contracts.length?contracts.map(renderContractRow).join(''):'<div class="ct-empty">No contracts on file.</div>';
  var notesHtml=c.notes?'<div class="ci-notes-txt">'+esc(c.notes)+'</div>':'<div class="ci-notes-empty">No notes yet.</div>';

    var typeStr=q.type==='deep'?'Deep clean':'Maintenance';

          '<div class="ci-qc-price">'+priceLbl+'</div>'+
          (monthlyLbl?'<div class="ci-qc-monthly">'+monthlyLbl+'</div>':'')+

        '<span class="ci-qc-date">'+dStr+'</span>'+
        '<button class="ci-qc-view" data-action="view-quote" data-qid="'+esc(q.id)+'" data-qcid="'+esc(cid)+'">View</button>'+
        '<button class="ci-qc-del" data-action="del-quote" data-qid="'+esc(q.id)+'" data-qcid="'+esc(cid)+'" title="Remove">'+
          '<svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>'+
        '</button>'+
      '</div>'+
    '</div>';
  }
  quotesArr.forEach(function(q){_quoteStore[q.id]=q;});
  var quotesHtml;
  if(!quotesArr.length){
    quotesHtml='<div class="ci-notes-empty">No quotes saved yet.</div>';
  } else {
    var latest=quotesArr[0];
    var older=quotesArr.slice(1);
    quotesHtml=renderQuoteCard(latest,true,c.id);
    if(older.length){
      quotesHtml+='<details class="ci-qhist">'+
        '<summary class="ci-qhist-sum">Quote history ('+older.length+')</summary>'+
        '<div class="ci-qhist-body">'+older.map(function(q){return renderQuoteCard(q,false,c.id);}).join('')+'</div>'+
      '</details>';
    }
  }
  var left='<div class="ci-sh">Jobs</div><div class="ci-panel">'+jobsHtml+'</div>';
  var right='<div class="ci-sh"><span>Notes</span><button class="ci-add-btn" data-notes-edit="'+esc(c.id)+'">Edit</button></div>'+
    '<div class="ci-panel ci-notes-panel">'+notesHtml+'</div>'+
    '<div class="ci-sh" style="margin-top:18px"><span>Contracts</span><button class="ci-add-btn" data-add-contract="'+esc(c.id)+'">+ Add</button></div>'+
    '<div class="ci-panel ci-contracts">'+ctHtml+'</div>'+
    '<div class="ci-sh" style="margin-top:18px">Quotes</div>'+
    '<div class="ci-panel ci-quotes-panel">'+quotesHtml+'</div>'+
    '<div class="ci-sh" style="margin-top:18px">Actions</div>'+
    '<div class="ci-panel">'+
      '<button class="ci-act-btn" data-action="job" data-cid="'+esc(c.id)+'" data-cname="'+esc(c.name)+'">'+
        '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>'+
        'Schedule a clean</button>'+
    '</div>';
  return hdr+'<div class="ci-grid"><div>'+left+'</div><div>'+right+'</div></div>';
}

function expandWrap(wrap){

    sb.from('contracts').select('id,client_id,type,value,start_date,end_date,renewal_date,signed_date,notes,pdf_path').eq('client_id',cid).order('created_at',{ascending:false}).then(function(cr){

function reExpandClient(cid){

function renderStats(){
  var active=allClients.filter(function(c){return c.status==='active';}).length;
  var onb=allClients.filter(function(c){return c.status==='onboarding';}).length;
  var activeContracts=0,expiring=0;
  allContracts.forEach(function(ct){var st=contractStatus(ct);if(st.cls==='active')activeContracts++;if(st.cls==='expiring')expiring++;});
  var dow=new Date().getDay()||7;
  var mon=new Date();mon.setDate(mon.getDate()-(dow-1));
  var sun=new Date(mon);sun.setDate(mon.getDate()+6);
  var cleansThisWeek=allJobs.filter(function(j){return j.date>=mon.toISOString().slice(0,10)&&j.date<=sun.toISOString().slice(0,10);}).length;
  var el=document.getElementById('stats-strip');if(!el)return;
  el.innerHTML='<div class="stat"><div class="stat-lbl">Total clients</div><div class="stat-val">'+allClients.length+'</div><div class="stat-hint">'+(active?' '+active+' active':'—')+(onb?' · '+onb+' onboarding':'')+'</div></div>'+
    '<div class="stat"><div class="stat-lbl">Cleans this week</div><div class="stat-val">'+cleansThisWeek+'</div><div class="stat-hint">Mon – Sun</div></div>'+
    '<div class="stat"><div class="stat-lbl">Active contracts</div><div class="stat-val">'+activeContracts+'</div><div class="stat-hint">Across all clients</div></div>'+
    '<div class="stat"><div class="stat-lbl">Expiring soon</div><div class="stat-val">'+expiring+'</div><div class="stat-hint">Within 60 days</div></div>';
}
function renderRow(c,nc,ctSt){
  var bc=c.status==='active'?'active':c.status==='onboarding'?'onboarding':'exited';
  var bl=(c.status||'active');bl=bl.charAt(0).toUpperCase()+bl.slice(1);
  var ncStr=fmtNextClean(nc);
  var ctCol=ctSt?'<span class="badge '+ctSt.cls+'" style="font-size:8.5px">'+ctSt.lbl+'</span>':'<span style="color:var(--stone);font-size:12px">—</span>';
  var sub=c.contact?(esc(c.contact)+(c.email?' <span style="opacity:.4">·</span> <span style="color:var(--stone)">'+esc(c.email)+'</span>':'')):'';
  return '<div class="cl-wrap" data-id="'+esc(c.id)+'">'+
    '<div class="cl-row"><div><div class="cl-name">'+esc(c.name)+'</div>'+(sub?'<div class="cl-sub">'+sub+'</div>':'')+
    '<span class="cl-industry">'+esc(c.industry||'Other')+'</span></div>'+
    '<div><span class="badge '+bc+'">'+bl+'</span></div>'+
    '<div class="'+(ncStr?'cl-next':'cl-next blank')+'">'+(ncStr||'—')+'</div>'+
    '<div>'+ctCol+'</div>'+
    '<div class="cl-arr"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div></div>'+
    '<div class="cl-body"></div></div>';
}
function renderAll(){
  renderStats();
  var today=new Date().toISOString().slice(0,10);
  var nextMap={};
  allJobs.filter(function(j){return j.status==='upcoming'&&j.date>=today;})
    .sort(function(a,b){return a.date<b.date?-1:1;})
    .forEach(function(j){if(!nextMap[j.client_id])nextMap[j.client_id]=j.date;});
  var ctStatusMap={};
  allContracts.forEach(function(ct){
    var st=contractStatus(ct);
    var prev=ctStatusMap[ct.client_id];
    if(!prev||st.cls==='expiring'||(st.cls==='active'&&prev.cls!=='expiring'))ctStatusMap[ct.client_id]=st;
  });
  var body=document.getElementById('cl-body');
  if(!allClients.length){body.innerHTML='<div class="cl-empty">No clients yet — add your first one above.</div>';return;}
  var html='';
  allClients.forEach(function(c){
    var mf=activeFilter==='all'||activeFilter===c.status;
    var ms=!searchTerm||(c.name+' '+(c.contact||'')+' '+(c.email||'')).toLowerCase().indexOf(searchTerm)!==-1;
    if(mf&&ms)html+=renderRow(c,nextMap[c.id]||null,ctStatusMap[c.id]||null);
  });
  body.innerHTML=html||'<div class="cl-empty">No clients match your filter.</div>';
}
function reload(cb){loadAll(function(){renderAll();if(cb)cb();});}

// Event delegation
document.getElementById('cl-body').addEventListener('click',function(e){
  var editBtn=e.target.closest('[data-edit-id]');
  if(editBtn){openEditModal(editBtn.dataset.editId);return;}
  var notesEditBtn=e.target.closest('[data-notes-edit]');
  if(notesEditBtn){
    var cid=notesEditBtn.dataset.notesEdit;
    var panel=notesEditBtn.closest('.cl-body').querySelector('.ci-notes-panel');
    var c=null;allClients.forEach(function(x){if(x.id===cid)c=x;});
    if(panel&&c){
      panel.innerHTML='<textarea class="ci-notes-ta">'+esc(c.notes||'')+'</textarea>'+
        '<div class="ci-notes-save"><button class="cancel-btn" style="font-size:12px;padding:6px 12px" data-notes-cancel>Cancel</button>'+
        '<button class="ph-btn" style="font-size:12px;padding:6px 14px" data-notes-save="'+esc(cid)+'">Save</button></div>';
      panel.querySelector('.ci-notes-ta').focus();
    }return;
  }
  if(e.target.closest('[data-notes-cancel]')){
    var wrap0=e.target.closest('.cl-wrap');
    var c0=null;allClients.forEach(function(x){if(x.id===(wrap0?wrap0.dataset.id:''))c0=x;});
    var panel0=e.target.closest('.ci-notes-panel');
    if(panel0&&c0)panel0.innerHTML=c0.notes?'<div class="ci-notes-txt">'+esc(c0.notes)+'</div>':'<div class="ci-notes-empty">No notes yet.</div>';
    return;
  }
  var notesSaveBtn=e.target.closest('[data-notes-save]');
  if(notesSaveBtn){
    var cidN=notesSaveBtn.dataset.notesSave;
    var ta=notesSaveBtn.closest('.ci-notes-panel').querySelector('.ci-notes-ta');
    var val=ta?ta.value.trim():'';
    var panel1=notesSaveBtn.closest('.ci-notes-panel');
    sb.from('clients').update({notes:val}).eq('id',cidN).then(function(){
      allClients.forEach(function(x){if(x.id===cidN)x.notes=val;});
      if(panel1)panel1.innerHTML=val?'<div class="ci-notes-txt">'+esc(val)+'</div>':'<div class="ci-notes-empty">No notes yet.</div>';
    });return;
  }
  var addCtBtn=e.target.closest('[data-add-contract]');
  if(addCtBtn){openCtModal(null,addCtBtn.dataset.addContract);return;}
  var ctRow=e.target.closest('.ct-clickable[data-ct-id]');
  if(ctRow){
    var wrapCt=ctRow.closest('.cl-wrap');
    sb.from('contracts').select('id,client_id,type,value,start_date,end_date,renewal_date,signed_date,notes,pdf_path').eq('id',ctRow.dataset.ctId).single().then(function(r){
      if(r.data)openCtModal(r.data,wrapCt?wrapCt.dataset.id:'');
    });return;
  }
  var actBtn=e.target.closest('[data-action]');
  if(actBtn){
    var act=actBtn.dataset.action;
    if(act==='job')window.location.href='jobs.html?newjob=1&cid='+encodeURIComponent(actBtn.dataset.cid)+'&cname='+encodeURIComponent(actBtn.dataset.cname);
    else if(act==='view-quote'){
      var qid=actBtn.dataset.qid;
      var qobj=_quoteStore[qid];
      if(qobj)openQuoteDetail(qobj);
      return;
    }
    else if(act==='del-quote'){
      if(!confirm('Remove this quote?'))return;
      sb.from('quotes').delete().eq('id',actBtn.dataset.qid).then(function(r){if(!r.error)reExpandClient(actBtn.dataset.qcid);});
    }
    else if(act==='view-job'){window.location.href='jobs.html?job='+encodeURIComponent(actBtn.dataset.jid);return;}
    else if(act==='edit-job'){
      openJobEditModal(actBtn.dataset.jid,actBtn.dataset.jtype,actBtn.dataset.jfreq,actBtn.dataset.jcid);
      return;
    }
    else if(act==='del-job'){
      if(!confirm('Delete this job and its scope?'))return;
      var jid=actBtn.dataset.jid;
      var cid=actBtn.dataset.jcid;
      sb.from('scopes').delete().eq('job_id',jid).then(function(){
        sb.from('jobs').delete().eq('id',jid).then(function(r){
          if(r&&r.error){alert('Could not delete job: '+r.error.message);return;}
          allJobs=allJobs.filter(function(j){return j.id!==jid;});
          reExpandClient(cid);
        });
      });
      return;
    }
    return;
  }
  var row=e.target.closest('.cl-row');
  if(row){
    var wrap=row.closest('.cl-wrap');
    var isOpen=wrap.classList.contains('open');
    document.querySelectorAll('#cl-body .cl-wrap.open').forEach(function(w){w.classList.remove('open');w.querySelector('.cl-body').classList.remove('open');});
    if(!isOpen)expandWrap(wrap);
  }
});

  if(!name){document.getElementById('ef-name').focus();return;}
  var savedId=editingClientId;
  sb.from('clients').update({name:name,industry:document.getElementById('ef-industry').value,
    status:document.getElementById('ef-status').value,contact:document.getElementById('ef-contact').value.trim(),
    contact_title:document.getElementById('ef-ctitle').value.trim(),phone:document.getElementById('ef-phone').value.trim(),
    email:document.getElementById('ef-email').value.trim(),site_address:document.getElementById('ef-site-address').value.trim()
  }).eq('id',savedId).then(function(){
    closeEditModal();reload(function(){setTimeout(function(){var w=document.querySelector('.cl-wrap[data-id="'+savedId+'"]');if(w)expandWrap(w);},50);});
  });
});
document.getElementById('edit-modal-delete').addEventListener('click',function(){
  if(!editingClientId)return;
  var name='';allClients.forEach(function(c){if(c.id===editingClientId)name=c.name;});
  if(!confirm('Delete '+name+' and all their jobs, contracts and quotes? This cannot be undone.'))return;
  var cid=editingClientId;
  var jobIds=allJobs.filter(function(j){return j.client_id===cid;}).map(function(j){return j.id;});
  function doDeleteClient(){
    sb.from('contracts').delete().eq('client_id',cid).then(function(r1){
      if(r1&&r1.error){alert('Could not delete contracts: '+r1.error.message);return;}
      sb.from('clients').delete().eq('id',cid).then(function(r2){
        if(r2&&r2.error){alert('Could not delete client: '+r2.error.message);return;}
        closeEditModal();reload();
      });
    });
  }
  sb.from('inquiries').delete().eq('client_id',cid).then(function(){
    if(!jobIds.length){doDeleteClient();return;}
    sb.from('scopes').delete().in('job_id',jobIds).then(function(){
      sb.from('jobs').delete().eq('client_id',cid).then(function(r){
        if(r&&r.error){alert('Could not delete jobs: '+r.error.message);return;}
        doDeleteClient();
      });
    });
  });
});
document.getElementById('edit-modal-del-jobs').addEventListener('click',function(){
  if(!editingClientId)return;
  var name='';allClients.forEach(function(c){if(c.id===editingClientId)name=c.name;});
  if(!confirm('Delete all jobs for '+name+'? This cannot be undone.'))return;
  var cid=editingClientId;
  var jobIds=allJobs.filter(function(j){return j.client_id===cid;}).map(function(j){return j.id;});
  if(!jobIds.length){alert('No jobs to delete.');return;}
  sb.from('inquiries').update({job_id:null}).in('job_id',jobIds).then(function(){
    sb.from('scopes').delete().in('job_id',jobIds).then(function(){
      sb.from('jobs').delete().eq('client_id',cid).then(function(r){
        if(r&&r.error){alert('Could not delete jobs: '+r.error.message);return;}
        reload(function(){reExpandClient(cid);});
      });
    });
  });
});

// Contract modal
var ctModal=document.getElementById('contract-modal');
var ctClientId=null,editingCtId=null,pendingPdfFile=null,existingPdfPath=null;
function viewPdf(path){
  sb.storage.from('contract-pdfs').createSignedUrl(path,3600).then(function(r){
    if(r.data&&r.data.signedUrl)window.open(r.data.signedUrl,'_blank');
  });
}
function renderPdfUi(){
  var ui=document.getElementById('ct-pdf-ui');if(!ui)return;
  if(pendingPdfFile){
    ui.innerHTML='<span class="ct-pdf-name">'+esc(pendingPdfFile.name)+'</span><button type="button" class="ct-pdf-clear" id="ct-pdf-clear-btn">Remove</button>';
    document.getElementById('ct-pdf-clear-btn').addEventListener('click',function(){pendingPdfFile=null;renderPdfUi();});
  } else if(existingPdfPath){
    ui.innerHTML='<button type="button" class="ct-pdf-view" id="ct-pdf-view-btn">View PDF</button> <button type="button" class="ct-pdf-replace" id="ct-pdf-replace-btn">Replace…</button>';
    document.getElementById('ct-pdf-view-btn').addEventListener('click',function(){viewPdf(existingPdfPath);});
    document.getElementById('ct-pdf-replace-btn').addEventListener('click',function(){document.getElementById('ct-pdf-file').click();});
  } else {
    ui.innerHTML='<button type="button" class="ct-upload-btn" id="ct-pdf-attach-btn">Attach PDF…</button>';
    document.getElementById('ct-pdf-attach-btn').addEventListener('click',function(){document.getElementById('ct-pdf-file').click();});
  }
}
document.getElementById('ct-pdf-file').addEventListener('change',function(){
  var file=this.files[0];if(!file)return;
  pendingPdfFile=file;existingPdfPath=null;renderPdfUi();this.value='';
});
function openCtModal(ct,cid){
  ctClientId=cid||ctClientId;editingCtId=ct?ct.id:null;
  pendingPdfFile=null;existingPdfPath=ct&&ct.pdf_path?ct.pdf_path:null;
  document.getElementById('ct-modal-title').textContent=ct?'Edit contract':'Add contract';
  document.getElementById('ct-modal-delete').hidden=!ct;
  document.getElementById('ct-type').value=ct&&ct.type?ct.type:'12-month';
  document.getElementById('ct-value').value=ct&&ct.value?ct.value:'';
  document.getElementById('ct-start').value=ct&&ct.start_date?ct.start_date:'';
  document.getElementById('ct-end').value=ct&&ct.end_date?ct.end_date:'';
  document.getElementById('ct-renewal').value=ct&&ct.renewal_date?ct.renewal_date:'';
  document.getElementById('ct-signed').value=ct&&ct.signed_date?ct.signed_date:'';
  document.getElementById('ct-notes').value=ct&&ct.notes?ct.notes:'';
  renderPdfUi();ctModal.hidden=false;
  setTimeout(function(){document.getElementById('ct-type').focus();},40);
}
function closeCtModal(){ctModal.hidden=true;editingCtId=null;pendingPdfFile=null;existingPdfPath=null;}
document.getElementById('ct-modal-close').addEventListener('click',closeCtModal);
document.getElementById('ct-modal-cancel').addEventListener('click',closeCtModal);
ctModal.addEventListener('click',function(e){if(e.target===ctModal)closeCtModal();});
document.getElementById('ct-modal-save').addEventListener('click',function(){
  var ctData={client_id:ctClientId,type:document.getElementById('ct-type').value,
    value:parseInt(document.getElementById('ct-value').value)||0,
    start_date:document.getElementById('ct-start').value||null,
    end_date:document.getElementById('ct-end').value||null,
    renewal_date:document.getElementById('ct-renewal').value||null,
    signed_date:document.getElementById('ct-signed').value||null,
    notes:document.getElementById('ct-notes').value.trim(),
    pdf_path:existingPdfPath};
  var cid=ctClientId;
  var btn=document.getElementById('ct-modal-save');btn.disabled=true;btn.textContent='Saving…';
  function afterSave(ctId){
    if(pendingPdfFile){
      var path=ctId+'.pdf';
      sb.storage.from('contract-pdfs').upload(path,pendingPdfFile,{upsert:true}).then(function(sr){
        sb.from('contracts').update({pdf_path:sr.error?null:path}).eq('id',ctId).then(function(){
          btn.disabled=false;btn.textContent='Save contract';closeCtModal();reload(function(){reExpandClient(cid);});
        });
      });
    } else {btn.disabled=false;btn.textContent='Save contract';closeCtModal();reload(function(){reExpandClient(cid);});}
  }
  if(editingCtId){
    sb.from('contracts').update(ctData).eq('id',editingCtId).then(function(r){
      if(r.error){btn.disabled=false;btn.textContent='Save contract';alert(r.error.message);return;}
      afterSave(editingCtId);
    });
  } else {
    sb.from('contracts').insert(ctData).select('id').then(function(r){
      if(r.error){btn.disabled=false;btn.textContent='Save contract';alert(r.error.message);return;}
      afterSave(r.data[0].id);
    });
  }
});
document.getElementById('ct-modal-delete').addEventListener('click',function(){
  if(!editingCtId)return;
  if(!confirm('Delete this contract?'))return;
  var cid=ctClientId;
  function doDelete(){sb.from('contracts').delete().eq('id',editingCtId).then(function(){closeCtModal();reload(function(){reExpandClient(cid);});});}
  if(existingPdfPath){sb.storage.from('contract-pdfs').remove([existingPdfPath]).then(doDelete);}else{doDelete();}
});

// Job quick-edit modal (freq/type from client detail)
var jobEditModal=document.getElementById('job-edit-modal');
var editingJobQId=null,editingJobQCid=null;
function openJobEditModal(jid,jtype,jfreq,jcid){
  editingJobQId=jid;editingJobQCid=jcid;
  document.getElementById('jej-type').value=jtype||'maintenance';
  document.getElementById('jej-freq').value=jfreq||'none';
  jobEditModal.hidden=false;document.body.style.overflow='hidden';
}
function closeJobEditModal(){jobEditModal.hidden=true;editingJobQId=null;editingJobQCid=null;document.body.style.overflow='';}
document.getElementById('job-edit-modal-close').addEventListener('click',closeJobEditModal);
document.getElementById('job-edit-modal-cancel').addEventListener('click',closeJobEditModal);
jobEditModal.addEventListener('click',function(e){if(e.target===jobEditModal)closeJobEditModal();});
document.getElementById('job-edit-modal-save').addEventListener('click',function(){
  if(!editingJobQId)return;
  var freq=document.getElementById('jej-freq').value;
  var type=document.getElementById('jej-type').value;
  var cid=editingJobQCid;
  sb.from('jobs').update({type:type,repeat:freq!=='none'?freq:null}).eq('id',editingJobQId).then(function(r){
    if(r&&r.error){alert('Save failed: '+r.error.message);return;}
    allJobs.forEach(function(j){if(j.id===editingJobQId){j.type=type;j.repeat=freq!=='none'?freq:null;}});
    closeJobEditModal();reExpandClient(cid);
  });
});

document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(!jobEditModal.hidden){closeJobEditModal();return;}
  if(!ctModal.hidden){closeCtModal();return;}
  if(!editModal.hidden){closeEditModal();return;}
  if(!overlay.hidden)closeModal();
});

loadAll(function(){renderAll();
MQ.sb.from('inquiries').select('id',{count:'exact',head:true}).eq('status','new').then(function(r){

if(clientParam){setTimeout(function(){var w=document.querySelector('.cl-wrap[data-id="'+clientParam+'"]');if(w){w.scrollIntoView({behavior:'smooth',block:'center'});expandWrap(w);}},80);}
});

}); // end requireAuth
})();
