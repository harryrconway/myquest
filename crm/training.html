<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href=/assets/favicon.svg type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Training — MyQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=20261011">
<style>
/* ── Training page ───────────────────────────────────── */

/* Category pill filter */
.cat-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.cat-pill{padding:6px 14px;border-radius:999px;font-size:12.5px;font-weight:600;border:1.5px solid var(--hair-md);background:none;color:var(--stone);cursor:pointer;font-family:var(--font);transition:all .12s;letter-spacing:.01em}
.cat-pill:hover{color:var(--navy);border-color:rgba(0,0,0,.2)}
.cat-pill.on{color:var(--navy);background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.15)}

/* Module card list */
.tr-list{display:flex;flex-direction:column;gap:10px}
.tr-card{background:#fff;border:1px solid var(--hair);border-radius:14px;padding:20px 22px;cursor:pointer;transition:box-shadow .15s,border-color .15s;display:flex;align-items:center;gap:16px;text-align:left}
.tr-card:hover{box-shadow:0 0 0 2px rgba(0,0,0,.09);border-color:rgba(0,0,0,.15)}
.tr-card.done{opacity:.65}
.tr-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--hair-md);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;background:#fff}
.tr-check.done{background:var(--green);border-color:var(--green)}
.tr-check svg{opacity:0;transition:opacity .2s}
.tr-check.done svg{opacity:1}
.tr-card-body{flex:1;min-width:0}
.tr-card-cat{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--stone);margin-bottom:4px}
.tr-card-title{font-size:15px;font-weight:600;color:var(--navy);line-height:1.3;margin-bottom:4px}
.tr-card-preview{font-size:13px;color:var(--stone);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tr-card-arrow{color:var(--stone);flex-shrink:0;transition:transform .15s}
.tr-card:hover .tr-card-arrow{transform:translateX(3px)}
.tr-empty{text-align:center;padding:48px 20px;color:var(--stone);font-size:14px;line-height:1.7}
.tr-empty strong{display:block;font-size:16px;font-weight:600;color:var(--navy);margin-bottom:6px}

/* Module reader overlay */
.tr-reader{position:fixed;inset:0;background:#fff;z-index:600;display:flex;flex-direction:column;overflow:hidden}
.tr-reader[hidden]{display:none}
.tr-reader-hd{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:#fff;z-index:1;flex-shrink:0}
.tr-reader-back{width:34px;height:34px;border-radius:10px;border:1.5px solid var(--hair-md);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--navy);transition:background .12s;flex-shrink:0}
.tr-reader-back:hover{background:rgba(0,0,0,.06)}
.tr-reader-meta{flex:1;min-width:0}
.tr-reader-cat{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--stone)}
.tr-reader-title{font-size:17px;font-weight:700;color:var(--navy);letter-spacing:-.02em;line-height:1.2}
.tr-reader-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:32px 40px;max-width:720px;margin:0 auto;width:100%}
.tr-reader-body h2{font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin:28px 0 10px}
.tr-reader-body h2:first-child{margin-top:0}
.tr-reader-body h3{font-size:15px;font-weight:700;color:var(--navy);margin:20px 0 8px}
.tr-reader-body p{font-size:15px;line-height:1.75;color:var(--navy);margin-bottom:12px}
.tr-reader-body ul,.tr-reader-body ol{padding-left:22px;margin-bottom:14px}
.tr-reader-body li{font-size:15px;line-height:1.75;color:var(--navy);margin-bottom:5px}
.tr-reader-body strong{font-weight:700;color:var(--navy)}
.tr-reader-body blockquote{margin:16px 0;padding:14px 18px;background:rgba(0,0,0,.04);border-left:3px solid var(--navy);border-radius:0 8px 8px 0}
.tr-reader-body blockquote p{margin:0;font-style:italic}
.tr-reader-body hr{border:none;border-top:1px solid var(--hair);margin:24px 0}
.tr-reader-foot{padding:20px 40px;border-top:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:#fff}
.tr-complete-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 22px;background:var(--navy);color:#fff;border:none;border-radius:var(--r-sm);font-family:var(--font);font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.01em;transition:opacity .12s}
.tr-complete-btn:hover{opacity:.8}
.tr-complete-btn.done{background:var(--green)}
.tr-complete-btn:disabled{opacity:.5;cursor:default}
.tr-reader-prog{font-size:13px;color:var(--stone)}

/* Owner management bar */
.tr-owner-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding:14px 18px;background:rgba(0,0,0,.03);border-radius:12px;border:1px solid var(--hair)}
.tr-owner-hint{font-size:13px;color:var(--stone)}
.tr-add-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;background:var(--navy);color:#fff;border:none;border-radius:var(--r-sm);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.01em;transition:opacity .12s}
.tr-add-btn:hover{opacity:.8}
.tr-card-actions{display:flex;gap:6px;flex-shrink:0}
.tr-edit-btn,.tr-pub-btn{font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;border:1.5px solid var(--hair-md);background:none;cursor:pointer;font-family:var(--font);transition:all .12s;white-space:nowrap}
.tr-edit-btn{color:var(--stone)}
.tr-pub-btn{color:var(--green)}
.tr-edit-btn:hover{border-color:rgba(0,0,0,.25);color:var(--navy)}
.tr-pub-btn.published{color:var(--stone)}

/* Module editor modal */
.tr-editor{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:700;display:flex;align-items:center;justify-content:center;padding:20px}
.tr-editor[hidden]{display:none}
.tr-editor-card{background:#fff;border-radius:var(--r);width:100%;max-width:600px;max-height:calc(100vh - 40px);overflow-y:auto;display:flex;flex-direction:column}
.tr-editor-hd{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:#fff;z-index:1}
.tr-editor-title{font-size:16px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.tr-editor-close{width:28px;height:28px;border-radius:7px;border:none;background:none;color:var(--stone);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s}
.tr-editor-close:hover{background:rgba(0,0,0,.07)}
.tr-editor-body{padding:20px 24px 24px;flex:1}
.tr-editor-hint{font-size:12px;color:var(--stone);margin-top:6px;line-height:1.5}
textarea.form-input{resize:vertical;min-height:200px;font-family:monospace;font-size:13px;line-height:1.6}
.tr-editor-actions{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--hair);background:#fff;position:sticky;bottom:0;flex-wrap:wrap}

@media(max-width:600px){
  .tr-reader-body,.tr-reader-foot{padding-left:20px;padding-right:20px}
  .tr-reader-hd{padding:12px 16px}
}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar staff-sidebar">
    <a class="sb-logo" href="https://myquest.au">
      <img src="/assets/myquest-logo.svg" alt="MyQuest" height="36" style="display:block">
    </a>
    <nav class="sb-nav">
      <a class="sb-item" href="profile.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20v-1a8 8 0 0116 0v1"/></svg>
        <span class="sb-label" id="sb-profile-label">My Profile</span>
      </a>
      <a class="sb-item on" href="training.html">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15z"/></svg>
        <span class="sb-label">Training</span>
      </a>
      <!-- Owner also gets their full nav link -->
      <a class="sb-item" href="overview.html" id="sb-overview-link" hidden>
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
        <span class="sb-label">Back to CRM</span>
      </a>
    </nav>
    <div class="sb-bottom">
      <hr class="sb-div">
      <button class="sb-item" onclick="MQ&&MQ.signOut()">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span>Sign out</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <div class="ph pg-1">
      <a class="mob-logo" href="https://myquest.au"><img src="/assets/myquest-logo.svg" alt="MyQuest" height="36" style="display:block"></a>
      <h1 class="ph-title">Training</h1>
    </div>

    <!-- Category filter bar -->
    <div class="cat-bar pg-2" id="cat-bar">
      <button class="cat-pill on" data-cat="all">All</button>
    </div>

    <!-- Owner management bar (hidden for staff) -->
    <div class="tr-owner-bar pg-2" id="owner-bar" hidden>
      <span class="tr-owner-hint">Manage training modules — staff see published modules only</span>
      <button class="tr-add-btn" id="add-module-btn">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add module
      </button>
    </div>

    <!-- Module list -->
    <div class="tr-list pg-3" id="tr-list">
      <div class="tr-empty"><strong>Loading training…</strong></div>
    </div>
  </main>
</div>

<!-- Module reader (full-screen) -->
<div class="tr-reader" id="tr-reader" hidden>
  <div class="tr-reader-hd">
    <button class="tr-reader-back" id="reader-back" aria-label="Back">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="tr-reader-meta">
      <div class="tr-reader-cat" id="reader-cat"></div>
      <div class="tr-reader-title" id="reader-title"></div>
    </div>
  </div>
  <div class="tr-reader-body" id="reader-body"></div>
  <div class="tr-reader-foot">
    <span class="tr-reader-prog" id="reader-prog"></span>
    <button class="tr-complete-btn" id="reader-complete-btn">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      Mark complete
    </button>
  </div>
</div>

<!-- Module editor modal (owner only) -->
<div class="tr-editor" id="tr-editor" hidden>
  <div class="tr-editor-card">
    <div class="tr-editor-hd">
      <span class="tr-editor-title" id="editor-title">Add training module</span>
      <button class="tr-editor-close" id="editor-close">&times;</button>
    </div>
    <div class="tr-editor-body">
      <div class="form-row">
        <label class="form-lbl" for="ed-title">Title</label>
        <input class="form-input" type="text" id="ed-title" placeholder="e.g. How to clean a bathroom correctly">
      </div>
      <div class="form-row-2">
        <div>
          <label class="form-lbl" for="ed-cat">Category</label>
          <select class="form-input" id="ed-cat">
            <option value="Onboarding">Onboarding</option>
            <option value="Safety">Safety</option>
            <option value="Process">Process</option>
            <option value="Equipment">Equipment</option>
            <option value="Standards">Standards</option>
            <option value="General">General</option>
          </select>
        </div>
        <div>
          <label class="form-lbl" for="ed-order">Order</label>
          <input class="form-input" type="number" id="ed-order" value="0" min="0">
        </div>
      </div>
      <div class="form-row">
        <label class="form-lbl" for="ed-body">Content</label>
        <textarea class="form-input" id="ed-body" placeholder="Write the training content here. Use ## for headings, **text** for bold, - for lists."></textarea>
        <p class="tr-editor-hint">Supports basic Markdown: ## Heading, **bold**, - bullet list, > quote block</p>
      </div>
    </div>
    <div class="tr-editor-actions">
      <button class="ph-btn" id="ed-save-btn">Save draft</button>
      <button class="ph-btn" id="ed-publish-btn" style="background:var(--green)">Save &amp; publish</button>
      <button class="cancel-btn" id="ed-cancel-btn">Cancel</button>
      <button class="delete-btn" id="ed-delete-btn" hidden style="margin-left:auto">Delete</button>
    </div>
  </div>
</div>

<!-- Staff mobile nav -->
<nav class="mob-bnav" aria-label="Navigation">
  <a href="profile.html" class="bnav-tab" id="bnav-profile">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20v-1a8 8 0 0116 0v1"/></svg>
    <span id="bnav-profile-label">Profile</span>
  </a>
  <a href="training.html" class="bnav-tab bnav-on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M4 4.5A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15z"/></svg>
    <span>Training</span>
  </a>
</nav>

<script src="supabase.min.js?v=20260806"></script>
<script src="auth.js?v=20261011"></script>
<script>
(function(){
'use strict';

var allModules=[],completedIds=new Set(),activeFilter='all',isOwnerViewer=false,currentStaffId=null,editingId=null;

window.MQ.requireAuth({allowStaff:true},function(session,staffRow){
  var sb=MQ.sb;
  isOwnerViewer=MQ.isOwner(session);

  if(isOwnerViewer){
    document.getElementById('owner-bar').removeAttribute('hidden');
    document.getElementById('sb-profile-label').textContent='Overview';
    document.getElementById('sb-overview-link').removeAttribute('hidden');
    document.querySelector('#sb-overview-link').previousElementSibling.setAttribute('href','overview.html');
    document.getElementById('bnav-profile-label').textContent='CRM';
    document.getElementById('bnav-profile').setAttribute('href','overview.html');
    setupEditorHandlers();
  }else{
    currentStaffId=staffRow.id;
    // Load completions
    sb.from('training_progress').select('item_id').eq('user_id',currentStaffId).then(function(r){
      (r.data||[]).forEach(function(row){completedIds.add(row.item_id);});
      loadModules();
    }).catch(function(){loadModules();});
    return;
  }
  loadModules();

  function loadModules(){
    var q=sb.from('training_items').select('id,title,body,category,published,sort_order').order('sort_order').order('created_at');
    if(!isOwnerViewer)q=q.eq('published',true);
    q.then(function(r){
      if(r.error){
        document.getElementById('tr-list').innerHTML=
          '<div class="tr-empty"><strong>Training not set up yet</strong>'+
          (isOwnerViewer?'<br>Click "Add module" above to create your first training module.':
          '<br>Your manager will add training modules here soon.')+
          '</div>';
        return;
      }
      allModules=r.data||[];
      buildCategoryBar();
      renderList();
    });
  }

  function buildCategoryBar(){
    var cats=['all'];
    allModules.forEach(function(m){
      if(m.category&&cats.indexOf(m.category)===-1)cats.push(m.category);
    });
    var bar=document.getElementById('cat-bar');
    bar.innerHTML='';
    cats.forEach(function(c){
      var btn=document.createElement('button');
      btn.className='cat-pill'+(c===activeFilter?' on':'');
      btn.dataset.cat=c;
      btn.textContent=c==='all'?'All':c;
      btn.addEventListener('click',function(){
        activeFilter=c;
        bar.querySelectorAll('.cat-pill').forEach(function(b){b.classList.toggle('on',b.dataset.cat===c);});
        renderList();
      });
      bar.appendChild(btn);
    });
  }

  function renderList(){
    var filtered=activeFilter==='all'?allModules:allModules.filter(function(m){return m.category===activeFilter;});
    var list=document.getElementById('tr-list');
    if(!filtered.length){
      list.innerHTML='<div class="tr-empty"><strong>No modules in this category yet.</strong></div>';
      return;
    }
    list.innerHTML='';
    filtered.forEach(function(m){
      var done=completedIds.has(m.id);
      var card=document.createElement('div');
      card.className='tr-card'+(done?' done':'');
      card.dataset.id=m.id;
      var preview=(m.body||'').replace(/#{1,3}\s/g,'').replace(/\*\*/g,'').replace(/>/g,'').split('\n').filter(Boolean)[0]||'';
      card.innerHTML=
        '<div class="tr-check'+(done?' done':'')+'">'+
        '<svg width="11" height="11" fill="none" stroke="#fff" stroke-width="3" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>'+
        '</div>'+
        '<div class="tr-card-body">'+
        '<div class="tr-card-cat">'+(m.category||'General')+'</div>'+
        '<div class="tr-card-title">'+esc(m.title)+'</div>'+
        (preview?'<div class="tr-card-preview">'+esc(preview)+'</div>':'')+
        '</div>'+
        (isOwnerViewer?
          '<div class="tr-card-actions">'+
          '<button class="tr-edit-btn" data-edit="'+m.id+'">Edit</button>'+
          '<button class="tr-pub-btn'+(m.published?' published':'')+'" data-pub="'+m.id+'">'+
          (m.published?'Published':'Publish')+'</button>'+
          '</div>':
          '<svg class="tr-card-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'
        );
      // Open reader on card click (not on action buttons)
      card.addEventListener('click',function(e){
        if(e.target.closest('.tr-card-actions'))return;
        openReader(m);
      });
      if(isOwnerViewer){
        card.querySelector('.tr-edit-btn').addEventListener('click',function(e){e.stopPropagation();openEditor(m);});
        card.querySelector('.tr-pub-btn').addEventListener('click',function(e){e.stopPropagation();togglePublish(m,card);});
      }
      list.appendChild(card);
    });
  }

  function togglePublish(m,card){
    var newVal=!m.published;
    sb.from('training_items').update({published:newVal}).eq('id',m.id).then(function(r){
      if(!r.error){
        m.published=newVal;
        var btn=card.querySelector('.tr-pub-btn');
        btn.textContent=newVal?'Published':'Publish';
        btn.classList.toggle('published',newVal);
        MQ.toast(newVal?'Module published':'Module unpublished');
      }
    });
  }

  // ── Module reader ─────────────────────────────────────
  function openReader(m){
    document.getElementById('reader-cat').textContent=m.category||'General';
    document.getElementById('reader-title').textContent=m.title;
    document.getElementById('reader-body').innerHTML=markdownToHtml(m.body||'');

    var done=completedIds.has(m.id);
    var btn=document.getElementById('reader-complete-btn');
    btn.className='tr-complete-btn'+(done?' done':'');
    btn.innerHTML=done?
      '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Completed':
      '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Mark complete';

    if(isOwnerViewer){btn.hidden=true;}
    else{
      btn.hidden=false;
      btn.disabled=done;
      btn.onclick=function(){markComplete(m.id,btn);};
    }

    var idx=allModules.indexOf(m)+1;
    document.getElementById('reader-prog').textContent=idx+' of '+allModules.length;

    document.getElementById('tr-reader').removeAttribute('hidden');
    document.getElementById('reader-body').scrollTop=0;
    document.body.style.overflow='hidden';
  }

  document.getElementById('reader-back').addEventListener('click',function(){
    document.getElementById('tr-reader').setAttribute('hidden','');
    document.body.style.overflow='';
  });

  function markComplete(itemId,btn){
    if(!currentStaffId)return;
    btn.disabled=true;btn.textContent='Saving…';
    sb.from('training_progress').upsert({user_id:currentStaffId,item_id:itemId}).then(function(r){
      if(!r.error){
        completedIds.add(itemId);
        btn.className='tr-complete-btn done';
        btn.innerHTML='<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Completed';
        // Update card in list
        var card=document.querySelector('[data-id="'+itemId+'"]');
        if(card){
          card.classList.add('done');
          var chk=card.querySelector('.tr-check');
          if(chk)chk.classList.add('done');
        }
        MQ.toast('Module completed!');
      }
    });
  }

  // ── Module editor (owner only) ────────────────────────
  function openEditor(m){
    editingId=m?m.id:null;
    document.getElementById('editor-title').textContent=m?'Edit module':'Add module';
    document.getElementById('ed-title').value=m?m.title:'';
    document.getElementById('ed-cat').value=m?m.category:'Onboarding';
    document.getElementById('ed-order').value=m?m.sort_order:allModules.length;
    document.getElementById('ed-body').value=m?m.body:'';
    document.getElementById('ed-delete-btn').hidden=!m;
    document.getElementById('tr-editor').removeAttribute('hidden');
    document.getElementById('ed-title').focus();
  }

  function closeEditor(){document.getElementById('tr-editor').setAttribute('hidden','');}

  function setupEditorHandlers(){
    document.getElementById('add-module-btn').addEventListener('click',function(){openEditor(null);});
    document.getElementById('editor-close').addEventListener('click',closeEditor);
    document.getElementById('ed-cancel-btn').addEventListener('click',closeEditor);

    function saveModule(publish){
      var title=document.getElementById('ed-title').value.trim();
      if(!title){MQ.toast('Add a title first',true);return;}
      var row={
        title:title,
        body:document.getElementById('ed-body').value,
        category:document.getElementById('ed-cat').value,
        sort_order:parseInt(document.getElementById('ed-order').value)||0,
        published:publish
      };
      var btn=document.getElementById(publish?'ed-publish-btn':'ed-save-btn');
      btn.disabled=true;btn.textContent='Saving…';
      var p=editingId?
        sb.from('training_items').update(row).eq('id',editingId):
        sb.from('training_items').insert(row);
      p.then(function(r){
        btn.disabled=false;btn.textContent=publish?'Save & publish':'Save draft';
        if(r.error){MQ.toast('Could not save',true);return;}
        MQ.toast(publish?'Module published':'Draft saved');
        closeEditor();
        loadModules();
      });
    }

    document.getElementById('ed-save-btn').addEventListener('click',function(){saveModule(false);});
    document.getElementById('ed-publish-btn').addEventListener('click',function(){saveModule(true);});
    document.getElementById('ed-delete-btn').addEventListener('click',function(){
      if(!editingId||!confirm('Delete this module?'))return;
      sb.from('training_items').delete().eq('id',editingId).then(function(){
        closeEditor();loadModules();MQ.toast('Module deleted');
      });
    });
  }

  // ── Markdown renderer (lightweight) ──────────────────
  function markdownToHtml(md){
    var html=md
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/^### (.+)$/gm,'<h3>$1</h3>')
      .replace(/^## (.+)$/gm,'<h2>$1</h2>')
      .replace(/^> (.+)$/gm,'<blockquote><p>$1</p></blockquote>')
      .replace(/^---$/gm,'<hr>')
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    // Convert bullet lists
    html=html.replace(/((?:^- .+\n?)+)/gm,function(block){
      var items=block.trim().split('\n').map(function(l){return '<li>'+l.replace(/^- /,'')+'</li>';}).join('');
      return '<ul>'+items+'</ul>';
    });
    // Convert numbered lists
    html=html.replace(/((?:^\d+\. .+\n?)+)/gm,function(block){
      var items=block.trim().split('\n').map(function(l){return '<li>'+l.replace(/^\d+\. /,'')+'</li>';}).join('');
      return '<ol>'+items+'</ol>';
    });
    // Paragraphs
    html=html.replace(/\n\n+/g,'\n').split('\n').map(function(line){
      if(!line.trim())return '';
      if(/^<(h[23]|ul|ol|hr|blockquote)/.test(line))return line;
      return '<p>'+line+'</p>';
    }).join('\n');
    return html;
  }

  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
});
})();
</script>
