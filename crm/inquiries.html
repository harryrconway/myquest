<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Inquiries — MyQuest CRM</title>
<link rel="stylesheet" href="style.css?v=20260816">
<style>
.pg-head{margin-bottom:28px}
.ph-sub{font-size:13px;color:var(--stone);margin-top:5px}

.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.f-pill{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;border:1.5px solid var(--hair-md);background:none;color:var(--stone);cursor:pointer;font-family:var(--font);transition:color .12s,background .12s,border-color .12s}
.f-pill:hover{color:var(--navy);border-color:rgba(35,44,84,.2)}
.f-pill.on{color:var(--navy);background:rgba(35,44,84,.07);border-color:rgba(35,44,84,.18)}

.inq-list{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);overflow:hidden}
.inq-head{display:grid;grid-template-columns:1.4fr .8fr .7fr .7fr 90px auto 28px;gap:12px;padding:10px 20px;border-bottom:1px solid var(--hair)}
.inq-head span{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone)}
.inq-row{
  display:grid;grid-template-columns:1.4fr .8fr .7fr .7fr 90px auto 28px;
  gap:12px;padding:13px 20px;align-items:center;
  border-bottom:1px solid var(--hair);
  border-left:3px solid transparent;
  transition:background .1s;cursor:pointer;
}
.xp-wrap:last-child>.inq-row{border-bottom:none}
.inq-row:hover{background:rgba(35,44,84,.03)}
.inq-row.new-row{border-left-color:var(--amber)}
.inq-row.won-row{border-left-color:var(--green)}
.inq-row.lost-row{border-left-color:var(--stone);opacity:.6}
.inq-biz{font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inq-sub{font-size:11.5px;color:var(--stone);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inq-cell{font-size:12.5px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inq-date{font-size:12px;color:var(--stone);font-variant-numeric:tabular-nums}
.inq-arr{color:var(--stone);display:flex;align-items:center;justify-content:flex-end}
.inq-row:hover .inq-arr{color:var(--navy)}
.inq-arr svg{transition:transform .22s}
.xp-wrap.open .inq-arr svg{transform:rotate(90deg)}

.xp-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1);border-bottom:1px solid var(--hair)}
.xp-body.open{max-height:600px}
.xp-wrap:last-child .xp-body{border-bottom:none}
.xp-wrap:last-child .xp-body.open{border-top:1px solid var(--hair)}
.xp-inner{padding:20px 24px 22px;background:var(--field)}
.xp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-bottom:16px}
.xp-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin-bottom:3px}
.xp-val{font-size:13px;color:var(--navy)}
.xp-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn-cvt{padding:9px 18px;border-radius:var(--r-sm);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;background:var(--navy);color:#fff;border:none;transition:background .15s}
.btn-cvt:hover{background:var(--navy-deep,#1a2140)}
.btn-lost{padding:8px 16px;border-radius:var(--r-sm);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;border:1.5px solid var(--hair-md);background:none;color:var(--stone);transition:background .15s,border-color .15s}
.btn-lost:hover{background:rgba(35,44,84,.06);border-color:rgba(35,44,84,.2);color:var(--navy)}
.btn-reopen{padding:8px 16px;border-radius:var(--r-sm);font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;border:1.5px solid var(--hair-md);background:none;color:var(--stone);transition:background .15s}
.btn-reopen:hover{background:rgba(35,44,84,.06);color:var(--navy)}
.xp-won-note{font-size:12px;color:var(--stone);background:rgba(76,175,80,.08);border:1px solid rgba(76,175,80,.2);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:14px}
.xp-won-note a{color:var(--navy);font-weight:600;text-decoration:none}
.xp-won-note a:hover{text-decoration:underline}
.xp-lost-note{font-size:12px;color:var(--stone);background:rgba(155,150,138,.07);border:1px solid rgba(155,150,138,.18);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:14px}

/* Conversion modal */
.cv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:none;align-items:flex-start;justify-content:center;padding:40px 20px;overflow-y:auto}
.cv-overlay.open{display:flex}
.cv-card{background:var(--card);border-radius:var(--r);width:100%;max-width:560px;box-shadow:0 24px 64px rgba(0,0,0,.22);overflow:hidden;margin:auto}
.cv-hd{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--hair);position:sticky;top:0;background:var(--card);z-index:1}
.cv-title{font-size:15px;font-weight:700;color:var(--navy);letter-spacing:-.015em}
.cv-close{width:28px;height:28px;border-radius:7px;border:none;background:none;color:var(--stone);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s}
.cv-close:hover{background:rgba(35,44,84,.07);color:var(--navy)}
.cv-body{padding:20px 24px}
.cv-section-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin-bottom:12px;margin-top:20px}
.cv-section-lbl:first-child{margin-top:0}
.cv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.cv-field{margin-bottom:10px}
.cv-field.full{grid-column:1/-1}
.cv-field label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--stone);display:block;margin-bottom:5px}
.cv-field input,.cv-field select{width:100%;padding:9px 11px;border:1.5px solid var(--hair-md);border-radius:var(--r-sm);font-size:13px;font-family:var(--font);background:var(--field);color:var(--navy);-webkit-appearance:none}
.cv-field input:focus,.cv-field select:focus{outline:none;border-color:var(--navy)}
.cv-hint{font-size:12px;color:var(--stone);background:rgba(35,44,84,.05);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:16px;line-height:1.5}
.cv-hint strong{color:var(--navy);font-weight:600}
.cv-job-toggle{display:flex;align-items:center;gap:8px;margin:14px 0 12px;cursor:pointer;font-size:13px;color:var(--navy);font-weight:500;user-select:none}
.cv-job-toggle input[type=checkbox]{width:15px;height:15px;accent-color:var(--navy);cursor:pointer}
.cv-job-section{display:none}
.cv-job-section.open{display:block}
.cv-footer{display:flex;gap:10px;padding:14px 24px;border-top:1px solid var(--hair);background:var(--card)}
.cv-err{font-size:12px;color:#c0392b;margin-top:6px;display:none}
.cv-err.show{display:block}

/* Lost modal */
.lost-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
.lost-overlay.open{display:flex}
.lost-card{background:var(--card);border-radius:var(--r);width:100%;max-width:380px;box-shadow:0 24px 64px rgba(0,0,0,.22);padding:24px}
.lost-title{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:6px}
.lost-sub{font-size:13px;color:var(--stone);margin-bottom:18px}
.lost-select{width:100%;padding:9px 11px;border:1.5px solid var(--hair-md);border-radius:var(--r-sm);font-size:13px;font-family:var(--font);background:var(--field);color:var(--navy);-webkit-appearance:none;margin-bottom:18px}
.lost-select:focus{outline:none;border-color:var(--navy)}
.lost-actions{display:flex;gap:10px}

@media(max-width:860px){
  .inq-head{display:none}
  .inq-row{grid-template-columns:1fr auto 28px}
  .inq-row .inq-cell,.inq-row .inq-date{display:none}
  .cv-grid{grid-template-columns:1fr}
}
</style>
</head>

<script>
(function(){
'use strict';
window.MQ.requireAuth(function(){
var sb=MQ.sb;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

var SPACE_LABELS={office:'Office',retail:'Retail',medical:'Medical',industrial:'Industrial',other:'Other'};
var FREQ_LABELS={weekly:'Weekly',fortnightly:'Fortnightly',monthly:'Monthly','once-off':'Once-off'};
var INDUSTRY_MAP={office:'Commercial office',retail:'Retail',medical:'Medical',industrial:'Industrial',other:'Other'};
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function fmtDate(s){
  if(!s)return'—';
  var d=new Date(s);
  return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
}

var allInquiries=[];
var currentFilter='active';
var currentConvertId=null;
var currentLostId=null;

sb.from('inquiries').select('*').order('created_at',{ascending:false}).then(function(r){
  allInquiries=r.data||[];
  updateCount();
  renderList();
});

function updateCount(){
  var newCount=allInquiries.filter(function(i){return i.status==='new';}).length;
  var won=allInquiries.filter(function(i){return i.status==='won';}).length;
  var active=allInquiries.filter(function(i){return i.status==='new'||i.status==='viewed';}).length;
  var countEl=document.getElementById('inq-count');
  if(countEl)countEl.textContent=allInquiries.length+' total · '+won+' converted · '+active+' active';
  var notifEl=document.getElementById('inq-notif');
  if(notifEl&&newCount>0){notifEl.textContent=newCount>9?'9+':String(newCount);notifEl.classList.add('show');}
  else if(notifEl){notifEl.classList.remove('show');}
}

function filteredRows(){
  if(currentFilter==='active')return allInquiries.filter(function(i){return i.status==='new'||i.status==='viewed';});
  if(currentFilter==='all')return allInquiries;
  return allInquiries.filter(function(i){return i.status===currentFilter;});
}

function statusBadge(status){
  if(status==='new')return'<span class="badge onboarding">New</span>';
  if(status==='won')return'<span class="badge active">Won</span>';
  if(status==='lost')return'<span class="badge" style="color:var(--stone);background:rgba(155,150,138,.1);border:1px solid rgba(155,150,138,.2)">Lost</span>';
  return'<span class="badge" style="color:var(--stone);background:rgba(155,150,138,.1);border:1px solid rgba(155,150,138,.2)">Viewed</span>';
}

function rowClass(status){
  if(status==='new')return' new-row';
  if(status==='won')return' won-row';
  if(status==='lost')return' lost-row';
  return'';
}

function expandContent(inq){
  var isActive=inq.status==='new'||inq.status==='viewed';
  var isWon=inq.status==='won';
  var isLost=inq.status==='lost';

  var wonNote='';
  if(isWon){
    wonNote='<div class="xp-won-note">Converted '+fmtDate(inq.converted_at)+
      ' &nbsp;·&nbsp; <a href="index.html">View Clients →</a>'+
      (inq.job_id?' &nbsp;·&nbsp; <a href="jobs.html">View Jobs →</a>':'')+
      '</div>';
  }
  var lostNote='';
  if(isLost){
    lostNote='<div class="xp-lost-note">Lost'+(inq.lost_reason?' — '+esc(inq.lost_reason):'')+
      ' &nbsp;·&nbsp; <button class="btn-reopen" onclick="window._iqReopen(\''+esc(inq.id)+'\');event.stopPropagation()">Reopen</button>'+
      '</div>';
  }

  var sourceHtml=inq.source?'<div><div class="xp-lbl">Source</div><div class="xp-val">'+esc(inq.source)+'</div></div>':'';
  var notesHtml=inq.notes?'<div style="grid-column:1/-1"><div class="xp-lbl">Notes</div><div class="xp-val">'+esc(inq.notes)+'</div></div>':'';

  var actions='';
  if(isActive){
    actions='<button class="btn-cvt" onclick="window._iqConvert(\''+esc(inq.id)+'\');event.stopPropagation()">Convert to Client &amp; Job</button>'+
      '<button class="btn-lost" onclick="window._iqLost(\''+esc(inq.id)+'\');event.stopPropagation()">Mark as Lost</button>';
  }

  return '<div class="xp-inner">'+
    wonNote+lostNote+
    '<div class="xp-grid">'+
      '<div><div class="xp-lbl">Contact</div><div class="xp-val">'+esc(inq.contact_name||'—')+'</div></div>'+
      '<div><div class="xp-lbl">Email</div><div class="xp-val"><a href="mailto:'+esc(inq.email||'')+'" style="color:var(--navy)">'+esc(inq.email||'—')+'</a></div></div>'+
      '<div><div class="xp-lbl">Mobile</div><div class="xp-val"><a href="tel:'+esc(inq.mobile||'')+'" style="color:var(--navy)">'+esc(inq.mobile||'—')+'</a></div></div>'+
      '<div><div class="xp-lbl">Suburb</div><div class="xp-val">'+esc(inq.suburb||'—')+'</div></div>'+
      sourceHtml+
      notesHtml+
    '</div>'+
    (actions?'<div class="xp-actions">'+actions+'</div>':'')+
  '</div>';
}

function renderList(){
  var rows=filteredRows();
  var rowsEl=document.getElementById('inq-rows');
  if(!rowsEl)return;
  if(!rows.length){
    rowsEl.innerHTML='<div style="padding:28px 20px;color:var(--stone);font-size:13px">No inquiries'+(currentFilter!=='all'?' in this filter':'')+'.</div>';
    return;
  }
  rowsEl.innerHTML=rows.map(function(inq){
    return'<div class="xp-wrap" data-id="'+esc(inq.id)+'">'+
      '<div class="inq-row'+rowClass(inq.status)+'" onclick="window._iqToggle(\''+esc(inq.id)+'\')">'+
        '<div><div class="inq-biz">'+esc(inq.biz_name||'—')+'</div><div class="inq-sub">'+esc(inq.suburb||'—')+'</div></div>'+
        '<div class="inq-cell">'+(SPACE_LABELS[inq.space_type]||esc(inq.space_type||'—'))+'</div>'+
        '<div class="inq-cell">'+esc(inq.sqm_range||'—')+'</div>'+
        '<div class="inq-cell">'+(FREQ_LABELS[inq.frequency]||esc(inq.frequency||'—'))+'</div>'+
        '<div class="inq-date">'+fmtDate(inq.created_at)+'</div>'+
        statusBadge(inq.status)+
        '<div class="inq-arr"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>'+
      '</div>'+
      '<div class="xp-body">'+expandContent(inq)+'</div>'+
    '</div>';
  }).join('');
}

window._iqToggle=function(id){
  var wrap=document.querySelector('.xp-wrap[data-id="'+id+'"]');
  if(!wrap)return;
  var body=wrap.querySelector('.xp-body');
  var isOpen=wrap.classList.contains('open');
  document.querySelectorAll('.xp-wrap.open').forEach(function(w){
    if(w!==wrap){w.classList.remove('open');w.querySelector('.xp-body').classList.remove('open');}
  });
  var opening=!isOpen;
  wrap.classList.toggle('open',opening);
  body.classList.toggle('open',opening);

  if(opening){
    var inq=allInquiries.find(function(i){return i.id===id;});
    if(inq&&inq.status==='new'){
      sb.from('inquiries').update({status:'viewed'}).eq('id',id).then(function(r){
        if(!r.error){
          inq.status='viewed';
          updateCount();
          var row=wrap.querySelector('.inq-row');
          if(row)row.classList.remove('new-row');
        }
      });
    }
  }
};

// --- Convert flow ---
window._iqConvert=function(id){
  var inq=allInquiries.find(function(i){return i.id===id;});
  if(!inq)return;
  currentConvertId=id;

  document.getElementById('cv-biz').value=inq.biz_name||'';
  document.getElementById('cv-contact').value=inq.contact_name||'';
  document.getElementById('cv-phone').value=inq.mobile||'';
  document.getElementById('cv-email').value=inq.email||'';
  document.getElementById('cv-industry').value=INDUSTRY_MAP[inq.space_type]||'Commercial office';
  document.getElementById('cv-site').value=inq.suburb||'';
  document.getElementById('cv-job-date').value='';
  document.getElementById('cv-job-time').value='';
  document.getElementById('cv-job-type').value='maintenance';
  document.getElementById('cv-job-check').checked=true;
  document.getElementById('cv-job-section').classList.add('open');
  document.getElementById('cv-submit').textContent='Create Client & Job';
  document.getElementById('cv-submit').disabled=false;

  var hintParts=[];
  if(inq.frequency)hintParts.push('<strong>Frequency:</strong> '+(FREQ_LABELS[inq.frequency]||inq.frequency));
  if(inq.sqm_range)hintParts.push('<strong>Size:</strong> '+esc(inq.sqm_range));
  if(inq.notes)hintParts.push('<strong>Notes:</strong> '+esc(inq.notes));
  document.getElementById('cv-hint').innerHTML=hintParts.length?hintParts.join(' &nbsp;·&nbsp; '):'';
  document.getElementById('cv-hint').style.display=hintParts.length?'':'none';

  var errEl=document.getElementById('cv-err');
  errEl.textContent='';errEl.classList.remove('show');

  document.getElementById('cv-overlay').classList.add('open');
};

function closeCvModal(){
  document.getElementById('cv-overlay').classList.remove('open');
  currentConvertId=null;
}

document.getElementById('cv-close').addEventListener('click',closeCvModal);
document.getElementById('cv-cancel').addEventListener('click',closeCvModal);
document.getElementById('cv-overlay').addEventListener('click',function(e){
  if(e.target===this)closeCvModal();
});

document.getElementById('cv-job-check').addEventListener('change',function(){
  var sec=document.getElementById('cv-job-section');
  var btn=document.getElementById('cv-submit');
  if(this.checked){sec.classList.add('open');btn.textContent='Create Client & Job';}
  else{sec.classList.remove('open');btn.textContent='Create Client';}
});

document.getElementById('cv-submit').addEventListener('click',async function(){
  if(!currentConvertId)return;
  var btn=this;
  var errEl=document.getElementById('cv-err');
  errEl.classList.remove('show');

  var biz=document.getElementById('cv-biz').value.trim();
  var contact=document.getElementById('cv-contact').value.trim();
  var phone=document.getElementById('cv-phone').value.trim();
  var email=document.getElementById('cv-email').value.trim();
  var industry=document.getElementById('cv-industry').value;
  var site=document.getElementById('cv-site').value.trim();
  var createJob=document.getElementById('cv-job-check').checked;
  var jobDate=createJob?document.getElementById('cv-job-date').value:'';
  var jobType=createJob?document.getElementById('cv-job-type').value:'';

  if(!biz||!contact||!phone||!email||!site){
    errEl.textContent='Please fill in all required client fields.';
    errEl.classList.add('show');
    return;
  }
  if(createJob&&!jobDate){
    errEl.textContent='Please enter a date for the job, or uncheck "Create a job now".';
    errEl.classList.add('show');
    return;
  }

  btn.textContent='Creating…';btn.disabled=true;

  var clientRes=await sb.from('clients').insert({
    name:biz,contact:contact,email:email.toLowerCase(),phone:phone,
    industry:industry,site_address:site,status:'active',notes:''
  }).select('id').single();

  if(clientRes.error){
    errEl.textContent='Failed to create client. Please try again.';
    errEl.classList.add('show');
    btn.textContent=createJob?'Create Client & Job':'Create Client';
    btn.disabled=false;
    return;
  }

  var clientId=clientRes.data.id;
  var jobId=null;

  if(createJob&&jobDate&&jobType){
    var inq=allInquiries.find(function(i){return i.id===currentConvertId;});
    var jobRes=await sb.from('jobs').insert({
      client_id:clientId,client_name:biz,
      date:jobDate,
      start_time:document.getElementById('cv-job-time').value||null,
      type:jobType,site:site,status:'upcoming'
    }).select('id').single();
    if(!jobRes.error)jobId=jobRes.data.id;
  }

  var updateRes=await sb.from('inquiries').update({
    status:'won',client_id:clientId,job_id:jobId,
    converted_at:new Date().toISOString()
  }).eq('id',currentConvertId);

  if(updateRes.error){
    errEl.textContent='Client created but inquiry update failed. Refresh and check.';
    errEl.classList.add('show');
    btn.disabled=false;
    return;
  }

  var local=allInquiries.find(function(i){return i.id===currentConvertId;});
  if(local){local.status='won';local.client_id=clientId;local.job_id=jobId;local.converted_at=new Date().toISOString();}
  closeCvModal();
  updateCount();
  renderList();
});

// --- Lost flow ---
window._iqLost=function(id){
  currentLostId=id;
  document.getElementById('lost-reason').value='';
  document.getElementById('lost-overlay').classList.add('open');
};

function closeLostModal(){
  document.getElementById('lost-overlay').classList.remove('open');
  currentLostId=null;
}

document.getElementById('lost-cancel').addEventListener('click',closeLostModal);
document.getElementById('lost-overlay').addEventListener('click',function(e){
  if(e.target===this)closeLostModal();
});

document.getElementById('lost-confirm').addEventListener('click',function(){
  if(!currentLostId)return;
  var reason=document.getElementById('lost-reason').value||null;
  var btn=this;btn.textContent='Saving…';btn.disabled=true;
  sb.from('inquiries').update({status:'lost',lost_reason:reason}).eq('id',currentLostId).then(function(r){
    btn.textContent='Confirm';btn.disabled=false;
    if(r.error)return;
    var inq=allInquiries.find(function(i){return i.id===currentLostId;});
    if(inq){inq.status='lost';inq.lost_reason=reason;}
    closeLostModal();
    updateCount();
    renderList();
  });
});

// --- Reopen flow ---
window._iqReopen=function(id){
  sb.from('inquiries').update({status:'viewed',lost_reason:null}).eq('id',id).then(function(r){
    if(r.error)return;
    var inq=allInquiries.find(function(i){return i.id===id;});
    if(inq){inq.status='viewed';inq.lost_reason=null;}
    document.querySelectorAll('.xp-wrap.open').forEach(function(w){
      w.classList.remove('open');w.querySelector('.xp-body').classList.remove('open');
    });
    updateCount();
    renderList();
  });
};

// --- Filters ---
document.getElementById('inq-filters').addEventListener('click',function(e){
  var pill=e.target.closest('.f-pill');
  if(!pill)return;
  document.querySelectorAll('.f-pill').forEach(function(p){p.classList.remove('on');});
  pill.classList.add('on');
  currentFilter=pill.dataset.filter;
  renderList();
});

// --- Mobile menu ---
var mobBtn=document.getElementById('mob-menu');
var mobOverlay=document.getElementById('mob-overlay');
if(mobBtn)mobBtn.addEventListener('click',function(){document.body.classList.toggle('mob-open');});
if(mobOverlay)mobOverlay.addEventListener('click',function(e){if(!e.target.closest('.mob-nav-links')||e.target.tagName==='A')document.body.classList.remove('mob-open');});

});
})();
</script>
</body>
