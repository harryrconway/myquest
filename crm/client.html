<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Client — MyQuest CRM</title>
<link rel="stylesheet" href="style.css?v=20260729">
<style>
.client-hd{background:var(--navy);border-radius:var(--r);padding:30px 34px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:14px}
.ch-namerow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:9px}
.ch-name{font-size:clamp(21px,2.4vw,29px);font-weight:700;letter-spacing:-.03em;color:var(--on);line-height:1}
.ch-sub{font-size:12.5px;color:var(--on-sub);line-height:1.5}
.ch-right{text-align:right;flex-shrink:0}
.ch-cname{font-size:13.5px;font-weight:600;color:var(--on);margin-bottom:2px}
.ch-ctitle{font-size:11.5px;color:var(--on-sub);margin-bottom:12px}
.ch-links{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ch-link{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--on-sub);text-decoration:none;transition:color .12s}
.ch-link:hover{color:var(--on)}

.sites-row{margin-bottom:14px}
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone)}
.sec-btn{font-size:12px;color:var(--stone);background:none;border:none;font-family:var(--font);font-weight:600;cursor:pointer;padding:0;letter-spacing:.01em;transition:color .12s}
.sec-btn:hover{color:var(--navy)}
.site-card{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);padding:22px 28px;display:grid;grid-template-columns:1fr 1fr;gap:24px}
.site-name{font-size:14.5px;font-weight:600;color:var(--navy);margin-bottom:4px;letter-spacing:-.01em}
.site-detail{font-size:12.5px;color:var(--stone);line-height:1.7}
.site-tags{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.site-tag{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);background:rgba(35,44,84,.07);padding:3px 9px;border-radius:5px}
.site-tag.hi{color:var(--navy);background:rgba(35,44,84,.12)}
.access-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin-bottom:10px}
.access-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:8px}
.access-row:last-child{margin-bottom:0}
.access-ico{color:var(--stone);flex-shrink:0;margin-top:1px}
.access-txt{font-size:12px;color:var(--stone);line-height:1.55}
.access-txt strong{color:var(--navy);font-weight:600}

.grid{display:grid;grid-template-columns:1fr 274px;gap:20px;align-items:start}
.jobs{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);overflow:hidden}
.job{display:grid;grid-template-columns:62px 1fr auto auto;align-items:center;gap:14px;padding:12px 20px 12px 16px;border-bottom:1px solid var(--hair);border-left:3px solid transparent;transition:background .1s}
.job:last-child{border-bottom:none}
.job:hover{background:rgba(35,44,84,.03)}
.job.done{border-left-color:var(--green)}
.job.next{border-left-color:var(--navy)}
.j-date{font-size:11.5px;color:var(--stone);font-variant-numeric:tabular-nums;line-height:1.4;white-space:nowrap}
.j-info{min-width:0}
.j-tag{display:inline-block;font-size:8.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);background:rgba(35,44,84,.07);padding:2px 7px;border-radius:4px;margin-bottom:3px}
.j-tag.deep{color:var(--navy);background:rgba(35,44,84,.13)}
.j-desc{font-size:12.5px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.j-sqm{font-size:11.5px;color:var(--stone);white-space:nowrap}
.j-price{font-size:13px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;white-space:nowrap}

.empty-state{padding:32px 20px;text-align:center;color:var(--stone);font-size:13px;background:var(--card);border-radius:var(--r);border:1px solid var(--hair)}

.sched{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair)}
.sched:first-of-type{padding-top:0}
.sched:last-of-type{border-bottom:none;padding-bottom:0}
.sched-type{font-size:12.5px;font-weight:600;color:var(--navy)}
.sched-sub{font-size:11px;color:var(--stone);margin-top:2px}
.sched-freq{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--stone);background:rgba(35,44,84,.07);padding:3px 8px;border-radius:5px;white-space:nowrap;flex-shrink:0}

.team-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--hair)}
.team-row:first-of-type{padding-top:0}
.team-row:last-of-type{border-bottom:none;padding-bottom:0}
.team-av{width:28px;height:28px;border-radius:50%;background:rgba(35,44,84,.1);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--navy);flex-shrink:0;letter-spacing:.02em}
.team-name{font-size:12.5px;font-weight:600;color:var(--navy)}
.team-role{font-size:11px;color:var(--stone)}

.notes-txt{font-size:13px;line-height:1.8;color:var(--stone)}
.notes-empty{font-size:13px;color:var(--stone);opacity:.5;font-style:italic}
.notes-ta{width:100%;min-height:100px;padding:10px 12px;background:var(--field);border:1px solid var(--hair);border-radius:var(--r-sm);font-family:var(--font);font-size:13px;color:var(--navy);line-height:1.8;outline:none;resize:vertical;transition:border-color .12s}
.notes-ta:focus{border-color:rgba(35,44,84,.4)}
.notes-save{margin-top:10px;display:flex;gap:8px;justify-content:flex-end}
.notes-save-btn{padding:7px 14px;background:var(--navy);color:var(--on);border:none;border-radius:var(--r-sm);font-family:var(--font);font-size:12px;font-weight:600;cursor:pointer;transition:background .12s}
.notes-save-btn:hover{background:var(--navy-deep)}
.notes-cancel-btn{padding:7px 14px;background:none;border:1.5px solid var(--hair-md);border-radius:var(--r-sm);font-family:var(--font);font-size:12px;font-weight:600;color:var(--stone);cursor:pointer;transition:color .12s,border-color .12s}
.notes-cancel-btn:hover{color:var(--navy);border-color:rgba(35,44,84,.25)}

.act-btn{display:flex;align-items:center;gap:9px;width:100%;padding:10px 12px;border:1.5px solid var(--hair-md);border-radius:11px;background:none;font-family:var(--font);font-size:12.5px;font-weight:500;color:var(--navy);cursor:pointer;margin-bottom:8px;text-align:left;transition:background .12s,border-color .12s}
.act-btn:last-child{margin-bottom:0}
.act-btn:hover{background:rgba(35,44,84,.04);border-color:rgba(35,44,84,.2)}
.act-btn svg{color:var(--stone);flex-shrink:0}

.not-found{padding:80px 0;text-align:center}
.not-found p{font-size:14px;color:var(--stone);margin-bottom:20px}

@media(max-width:900px){
  .site-card{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr}
  .client-hd{flex-direction:column}
  .ch-right{text-align:left}
  .ch-links{align-items:flex-start}
  .job{grid-template-columns:56px 1fr auto}
  .j-sqm{display:none}
}
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="sb-logo" href="https://myquest.au">
      <div class="sb-mark">MQ</div>

    </a>

    <!-- populated by JS -->

<script>
(function(){
  'use strict';

  var KEY='mq_clients';

  function load(){ try{ var s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
  function save(d){ localStorage.setItem(KEY,JSON.stringify(d)); }

  function getParam(name){
    var m=(window.location.search||'').match(new RegExp('[?&]'+name+'=([^&]*)'));
    return m?decodeURIComponent(m[1]):null;
  }

  function escHtml(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  var id=getParam('id');
  var main=document.getElementById('main-content');

  function findClient(){
    var clients=load()||[];
    for(var i=0;i<clients.length;i++){ if(clients[i].id===id) return clients[i]; }
    return null;
  }

  function saveClientField(field,value){
    var clients=load()||[];
    for(var i=0;i<clients.length;i++){
      if(clients[i].id===id){ clients[i][field]=value; break; }
    }
    save(clients);
  }

  function renderHamburger(){
    return '<button class="mob-menu-btn" id="mob-menu" aria-label="Open menu" style="margin-bottom:12px"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>';
  }

  function renderNotFound(){
    document.title='Not found — MyQuest CRM';
    main.innerHTML=renderHamburger()+
      '<div class="bc pg-1"><a href="index.html">Clients</a><span class="bc-sep">›</span><span>Not found</span></div>'+
      '<div class="not-found pg-2"><p>This client could not be found.</p><a href="index.html" class="ph-btn" style="display:inline-flex">Back to clients</a></div>';
  }

  function renderClient(c){
    document.title=escHtml(c.name)+' — MyQuest CRM';
    var bc=c.status==='active'?'active':c.status==='onboarding'?'onboarding':'exited';
    var bl=c.status.charAt(0).toUpperCase()+c.status.slice(1);

    // Header
    var subParts=[];
    if(c.industry) subParts.push(c.industry);
    var hdRight='';
    if(c.contact||c.email||c.phone){
      hdRight='<div class="ch-right">'+
        (c.contact?'<div class="ch-cname">'+escHtml(c.contact)+'</div>':'')+
        (c.contactTitle?'<div class="ch-ctitle">'+escHtml(c.contactTitle)+'</div>':'<div style="margin-bottom:12px"></div>')+
        '<div class="ch-links">'+
        (c.email?'<a class="ch-link" href="mailto:'+escHtml(c.email)+'"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>'+escHtml(c.email)+'</a>':'')+
        (c.phone?'<a class="ch-link" href="tel:'+escHtml(c.phone.replace(/\s/g,''))+'"><svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.37 2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.86a16 16 0 0 0 6.09 6.09l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>'+escHtml(c.phone)+'</a>':'')+
        '</div></div>';
    }

    var hd='<div class="client-hd pg-2">'+
      '<div><div class="ch-namerow"><h1 class="ch-name">'+escHtml(c.name)+'</h1><span class="badge '+bc+'">'+bl+'</span></div>'+
      (subParts.length?'<p class="ch-sub">'+escHtml(subParts.join(' · '))+'</p>':'')+
      '</div>'+hdRight+
    '</div>';

    // Site card
    var siteHtml='';
    if(c.site){
      var s=c.site;
      var tags=(s.tags||[]).map(function(t){ return '<span class="site-tag hi">'+escHtml(t)+'</span>'; }).join('');
      siteHtml='<div class="sites-row pg-3">'+
        '<div class="sec-hd"><span class="sec-lbl">Properties</span></div>'+
        '<div class="site-card">'+
          '<div><div class="site-name">'+escHtml(s.name)+'</div>'+
          '<div class="site-detail">'+escHtml(s.address)+(s.detail?'<br>'+escHtml(s.detail):'')+'</div>'+
          (tags?'<div class="site-tags">'+tags+'</div>':'')+
          '</div>'+
          '<div><div class="access-lbl">Site access</div>'+
          (s.code?'<div class="access-row"><svg class="access-ico" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><div class="access-txt">Key safe · Code <strong>'+escHtml(s.code)+'</strong></div></div>':'')+
          (s.parking?'<div class="access-row"><svg class="access-ico" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v3h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg><div class="access-txt">'+escHtml(s.parking)+'</div></div>':'')+
          (s.security?'<div class="access-row"><svg class="access-ico" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.37 2 2 0 0 1 3.6 1.18h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.86a16 16 0 0 0 6.09 6.09l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg><div class="access-txt">Security: <strong>'+escHtml(s.security)+'</strong></div></div>':'')+
          '</div>'+
        '</div>'+
      '</div>';
    }

    // Stats
    var nc=c.nextClean||'—';
    var ncHint=c.nextClean?'Confirmed':'Not scheduled';
    var stats='<div class="stats pg-3">'+
      '<div class="stat"><div class="stat-lbl">Outstanding</div><div class="stat-val">$'+(c.outstanding||0).toLocaleString()+'</div><div class="stat-hint">'+(c.outstanding?'Unpaid invoices':'All invoices clear')+'</div></div>'+
      '<div class="stat"><div class="stat-lbl">Contract value</div><div class="stat-val">'+(c.contract?'$'+Number(c.contract).toLocaleString():'—')+'</div><div class="stat-hint">'+(c.contract?'Per year · '+bl.toLowerCase():'Not set')+'</div></div>'+
      '<div class="stat"><div class="stat-lbl">Next clean</div><div class="stat-val">'+(c.nextClean?c.nextClean.split('·')[0].trim():'—')+'</div><div class="stat-hint">'+ncHint+'</div></div>'+
      '<div class="stat"><div class="stat-lbl">Total cleans</div><div class="stat-val">'+(c.totalCleans||0)+'</div><div class="stat-hint">'+(c.totalCleans?'Since client start':'No cleans yet')+'</div></div>'+
    '</div>';

    // Jobs
    var jobsHtml;
    if(c.jobs&&c.jobs.length){
      var rows=c.jobs.map(function(j){
        var isDeep=j.type==='Deep clean';
        return '<div class="job '+j.status+'">'+
          '<div class="j-date">'+escHtml(j.date)+'<br>'+escHtml(j.day)+'</div>'+
          '<div class="j-info"><div class="j-tag'+(isDeep?' deep':'')+'">'+escHtml(j.type)+'</div><div class="j-desc">'+escHtml(j.desc)+'</div></div>'+
          '<div class="j-sqm">'+j.sqm+' sqm</div>'+
          '<div class="j-price">$'+j.price+'</div>'+
        '</div>';
      }).join('');
      jobsHtml='<div class="jobs">'+rows+'</div>';
    } else {
      jobsHtml='<div class="empty-state">No jobs scheduled yet.</div>';
    }

    // Schedule aside
    var schedHtml;
    if(c.schedule&&c.schedule.length){
      schedHtml=c.schedule.map(function(s){
        return '<div class="sched"><div><div class="sched-type">'+escHtml(s.type)+'</div><div class="sched-sub">'+escHtml(s.sub)+'</div></div><span class="sched-freq">'+escHtml(s.freq)+'</span></div>';
      }).join('');
    } else {
      schedHtml='<p class="notes-empty">No schedule set.</p>';
    }

    // Team aside
    var teamHtml;
    if(c.team&&c.team.length){
      teamHtml=c.team.map(function(t){
        return '<div class="team-row"><div class="team-av">'+escHtml(t.initials)+'</div><div><div class="team-name">'+escHtml(t.name)+'</div><div class="team-role">'+escHtml(t.role)+'</div></div></div>';
      }).join('');
    } else {
      teamHtml='<p class="notes-empty">No team assigned.</p>';
    }

    var notesContent=c.notes?'<p class="notes-txt">'+escHtml(c.notes)+'</p>':'<p class="notes-empty">No notes yet.</p>';

    var grid='<div class="grid pg-4">'+
      '<div>'+
        '<div class="sh"><span class="sh-lbl">Jobs</span></div>'+
        jobsHtml+
      '</div>'+
      '<div>'+
        '<div class="sh" style="margin-top:0"><span class="sh-lbl">Schedule</span></div>'+
        '<div class="ac">'+schedHtml+'</div>'+
        '<div class="sh"><span class="sh-lbl">Team</span></div>'+
        '<div class="ac">'+teamHtml+'</div>'+
        '<div class="sh"><span class="sh-lbl">Actions</span></div>'+
        '<div class="ac">'+
          '<button class="act-btn"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="12" y1="14" x2="12" y2="18"/><line x1="10" y1="16" x2="14" y2="16"/></svg>Schedule a clean</button>'+
          '<button class="act-btn"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>Send a quote</button>'+
          '<button class="act-btn"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg>Raise an invoice</button>'+
          '<button class="act-btn"><svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>Send email</button>'+
        '</div>'+
        '<div class="sh"><span class="sh-lbl">Notes</span><button class="sh-btn" id="notes-edit-btn">Edit</button></div>'+
        '<div class="ac"><div id="notes-display">'+notesContent+'</div></div>'+
      '</div>'+
    '</div>';

    main.innerHTML=
      renderHamburger()+
      '<div class="bc pg-1"><a href="index.html">Clients</a><span class="bc-sep">›</span><span>'+escHtml(c.name)+'</span></div>'+
      hd+siteHtml+stats+grid;

    // Notes editing
    document.getElementById('notes-edit-btn').addEventListener('click',function(){
      var display=document.getElementById('notes-display');
      var current=c.notes||'';
      display.innerHTML='<textarea class="notes-ta" id="notes-ta">'+escHtml(current)+'</textarea>'+
        '<div class="notes-save">'+
          '<button class="notes-cancel-btn" id="notes-cancel">Cancel</button>'+
          '<button class="notes-save-btn" id="notes-save">Save</button>'+
        '</div>';
      document.getElementById('notes-ta').focus();
      document.getElementById('notes-cancel').addEventListener('click',function(){
        display.innerHTML=c.notes?'<p class="notes-txt">'+escHtml(c.notes)+'</p>':'<p class="notes-empty">No notes yet.</p>';
      });
      document.getElementById('notes-save').addEventListener('click',function(){
        var val=document.getElementById('notes-ta').value.trim();
        c.notes=val;
        saveClientField('notes',val);
        display.innerHTML=val?'<p class="notes-txt">'+escHtml(val)+'</p>':'<p class="notes-empty">No notes yet.</p>';
      });
    });

    // Mobile nav (wired after render)
    var mob=document.getElementById('mob-menu');
    var sb=document.querySelector('.sidebar');
    var bd=document.getElementById('sb-backdrop');
    function navClose(){ sb.classList.remove('open'); bd.classList.remove('open'); }
    if(mob) mob.addEventListener('click',function(){ sb.classList.add('open'); bd.classList.add('open'); });
    if(bd) bd.addEventListener('click',navClose);
    document.querySelectorAll('.sb-item').forEach(function(a){ a.addEventListener('click',navClose); });
  }

  if(!id){ renderNotFound(); return; }
  var client=findClient();
  if(!client){ renderNotFound(); return; }
  renderClient(client);

})();
</script>
</body>
</html>
