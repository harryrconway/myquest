<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Reports — MyQuest CRM</title>
<link rel="stylesheet" href="style.css?v=20260816">
<style>
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.rep-card{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);padding:24px}
.rep-title{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin-bottom:20px}

/* Bar chart */
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-lbl{font-size:11.5px;color:var(--stone);width:28px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:8px;background:rgba(35,44,84,.07);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--navy)}
.bar-fill.green{background:var(--green)}
.bar-val{font-size:11.5px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;width:52px;text-align:right;flex-shrink:0}

/* Client breakdown */
.cl-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.cl-bar-row:last-child{margin-bottom:0}
.cl-bar-name{font-size:12px;color:var(--stone);width:140px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-bar-track{flex:1;height:6px;background:rgba(35,44,84,.07);border-radius:3px;overflow:hidden}
.cl-bar-fill{height:100%;border-radius:3px;background:var(--navy);opacity:.7}
.cl-bar-val{font-size:11.5px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;width:58px;text-align:right;flex-shrink:0}

/* Summary table */
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.sum-row:last-child{border-bottom:none;padding-bottom:0}
.sum-row:first-child{padding-top:0}
.sum-lbl{font-size:12.5px;color:var(--stone)}
.sum-val{font-size:13px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}

/* Staff roles breakdown */
.role-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.role-row:last-child{margin-bottom:0}
.role-name{font-size:12px;color:var(--stone);width:140px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.role-track{flex:1;height:6px;background:rgba(35,44,84,.07);border-radius:3px;overflow:hidden}
.role-fill{height:100%;border-radius:3px;background:var(--navy);opacity:.7}
.role-val{font-size:11.5px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;width:32px;text-align:right;flex-shrink:0}

@media(max-width:900px){.rep-grid{grid-template-columns:1fr}}
@media(max-width:500px){.cl-bar-name{width:90px}}
</style>
</head>
<body>
<div class="layout">

  <aside class="sidebar">
    <a class="sb-logo" href="https://myquest.au">
      <div class="sb-mark">MQ</div>
      <span class="sb-name">MyQuest</span>

      <a class="sb-item" href="index.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Clients

      <a class="sb-item" href="jobs.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Jobs
      </a>
      <a class="sb-item" href="inquiries.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>

        <span class="sb-notif" id="inq-notif"></span>

      <a class="sb-item" href="scope.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>

        Sign out
      </button>
    </div>
  </aside>

  <main class="main">

    <div class="ph pg-1">
      <button class="mob-menu-btn" id="mob-menu" aria-label="Open menu"><span class="mob-bar"></span><span class="mob-bar"></span><span class="mob-bar"></span></button>
      <h1 class="ph-title">Reports</h1>
    </div>

    <div class="stats pg-2" id="rep-stats"></div>

    <div class="rep-grid pg-3">
      <div class="rep-card" id="rev-chart-card"></div>
      <div class="rep-card" id="client-chart-card"></div>
      <div class="rep-card" id="staff-roles-card"></div>
    </div>

    <div class="sh pg-4"><span class="sh-lbl">Year to date summary</span></div>
    <div class="ac pg-4" id="rep-summary"></div>

    <div class="sh" style="margin-top:32px"><span class="sh-lbl">Inquiries &amp; leads</span></div>
    <div class="stats" id="inq-stats" style="margin-bottom:18px"></div>
    <div class="rep-grid" style="margin-bottom:18px">
      <div class="rep-card" id="inq-source-card"></div>
      <div class="rep-card" id="inq-lost-card"></div>
    </div>
    <div class="ac" id="inq-summary"></div>

</div>
<div class="mob-overlay" id="mob-overlay"><div class="mob-nav-inner"><nav class="mob-nav-links"><a href="overview.html">Overview</a><a href="index.html">Clients</a><a href="jobs.html">Jobs</a><a href="inquiries.html">Inquiries</a><a href="scope.html">Scope</a><a href="calculator.html">Calculator</a><a href="reports.html" class="mob-on">Reports</a><a href="staff.html">Staff</a></nav><button class="mob-signout" onclick="MQ&&MQ.signOut()">Sign out</button></div></div>
<script src="supabase.min.js?v=20260806"></script>
<script src="auth.js?v=20260806"></script>
<script>
(function(){
'use strict';
window.MQ.requireAuth(function(){
var sb=MQ.sb;
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function srow(lbl,val){return'<div class="sum-row"><span class="sum-lbl">'+lbl+'</span><span class="sum-val">'+val+'</span></div>';}

var now=new Date();
var yr=now.getFullYear();
var mo=now.getMonth();
var today=now.toISOString().slice(0,10);
var MO_LABELS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var dow=now.getDay()||7;
var mon=new Date(now);mon.setDate(now.getDate()-(dow-1));
var sun=new Date(mon);sun.setDate(mon.getDate()+6);
var monStr=mon.toISOString().slice(0,10);
var sunStr=sun.toISOString().slice(0,10);

Promise.all([
  sb.from('jobs').select('id,status,date,client_name'),
  sb.from('clients').select('id,status'),
  sb.from('staff').select('id,status,role'),
  sb.from('inquiries').select('id,status,source,lost_reason,created_at,converted_at')
]).then(function(results){
  var jobs=results[0].data||[];
  var clients=results[1].data||[];
  var staff=results[2].data||[];
  var inquiries=results[3].data||[];

  var jobsDoneYTD=jobs.filter(function(j){return j.status==='completed'&&j.date&&j.date.slice(0,4)===String(yr);});
  var jobsDoneTotal=jobs.filter(function(j){return j.status==='completed';}).length;
  var upcomingJobs=jobs.filter(function(j){return j.status==='upcoming'&&j.date>=today;}).length;
  var activeClients=clients.filter(function(c){return c.status==='active';}).length;
  var activeStaff=staff.filter(function(s){return s.status==='active';}).length;
  var onLeaveStaff=staff.filter(function(s){return s.status==='on-leave';}).length;
  var resignedStaff=staff.filter(function(s){return s.status==='left';}).length;
  var onboardingClients=clients.filter(function(c){return c.status==='onboarding';}).length;
  var jobsThisWeek=jobs.filter(function(j){return j.date>=monStr&&j.date<=sunStr;}).length;

  var statsEl=document.getElementById('rep-stats');
  if(statsEl)statsEl.innerHTML=
    '<div class="stat"><div class="stat-lbl">Jobs completed YTD</div><div class="stat-val">'+jobsDoneYTD.length+'</div><div class="stat-hint">Jan – '+MO_LABELS[mo]+' '+yr+'</div></div>'+
    '<div class="stat"><div class="stat-lbl">Jobs completed</div><div class="stat-val">'+jobsDoneTotal+'</div><div class="stat-hint">All time</div></div>'+
    '<div class="stat"><div class="stat-lbl">Upcoming jobs</div><div class="stat-val">'+upcomingJobs+'</div><div class="stat-hint">Scheduled ahead</div></div>'+
    '<div class="stat"><div class="stat-lbl">Active clients</div><div class="stat-val">'+activeClients+'</div><div class="stat-hint">'+clients.length+' total</div></div>';

  var moJobs=new Array(12).fill(0);
  jobsDoneYTD.forEach(function(j){var m=new Date(j.date+'T00:00:00').getMonth();moJobs[m]++;});
  var maxMo=Math.max.apply(null,moJobs.slice(0,mo+1).concat([1]));
  var chartCard=document.getElementById('rev-chart-card');
  if(chartCard){
    var barRows=MO_LABELS.slice(0,mo+1).map(function(lbl,m){
      return '<div class="bar-row">'+
        '<span class="bar-lbl">'+lbl+'</span>'+
        '<div class="bar-track"><div class="bar-fill'+(m===mo?' green':'')+'" style="width:'+Math.round(moJobs[m]/maxMo*100)+'%"></div></div>'+
        '<span class="bar-val">'+moJobs[m]+'</span></div>';
    }).join('');
    chartCard.innerHTML='<div class="rep-title">Jobs completed per month — '+yr+'</div><div class="bar-chart">'+barRows+'</div>';
  }

  var byClient={};
  jobs.filter(function(j){return j.status==='completed';}).forEach(function(j){
    if(!j.client_name)return;byClient[j.client_name]=(byClient[j.client_name]||0)+1;
  });
  var sorted=Object.keys(byClient).map(function(n){return{name:n,total:byClient[n]};}).sort(function(a,b){return b.total-a.total;});
  var clientCard=document.getElementById('client-chart-card');
  if(clientCard){
    if(!sorted.length){
      clientCard.innerHTML='<div class="rep-title">Jobs by client</div><div style="padding:12px 0;color:var(--stone);font-size:13px">No completed jobs yet.</div>';
    } else {
      var maxClient=sorted[0].total||1;
      clientCard.innerHTML='<div class="rep-title">Jobs by client</div>'+sorted.slice(0,8).map(function(c){
        return '<div class="cl-bar-row">'+
          '<span class="cl-bar-name">'+esc(c.name)+'</span>'+
          '<div class="cl-bar-track"><div class="cl-bar-fill" style="width:'+Math.round(c.total/maxClient*100)+'%"></div></div>'+
          '<span class="cl-bar-val">'+c.total+(c.total===1?' job':' jobs')+'</span></div>';
      }).join('');
    }
  }

  var rolesCard=document.getElementById('staff-roles-card');
  if(rolesCard){
    var byRole={};
    staff.forEach(function(s){if(!s.role)return;byRole[s.role]=(byRole[s.role]||0)+1;});
    var rolesSorted=Object.keys(byRole).map(function(r){return{role:r,n:byRole[r]};}).sort(function(a,b){return b.n-a.n;});
    if(!rolesSorted.length){
      rolesCard.innerHTML='<div class="rep-title">Team breakdown</div><div style="padding:12px 0;color:var(--stone);font-size:13px">No staff yet.</div>';
    } else {
      var maxRole=rolesSorted[0].n||1;
      rolesCard.innerHTML='<div class="rep-title">Team breakdown</div>'+rolesSorted.map(function(r){
        return '<div class="role-row">'+
          '<span class="role-name">'+esc(r.role)+'</span>'+
          '<div class="role-track"><div class="role-fill" style="width:'+Math.round(r.n/maxRole*100)+'%"></div></div>'+
          '<span class="role-val">'+r.n+'</span></div>';
      }).join('');
    }
  }

  var sumEl=document.getElementById('rep-summary');
  if(sumEl)sumEl.innerHTML=
    srow('Total clients',String(clients.length))+
    srow('Active clients',String(activeClients))+
    srow('Clients onboarding',String(onboardingClients))+
    srow('Total staff',String(staff.length))+
    srow('Active staff',String(activeStaff))+
    (onLeaveStaff?srow('On leave',String(onLeaveStaff)):'')+
    (resignedStaff?srow('Resigned',String(resignedStaff)):'')+
    srow('Jobs this week',String(jobsThisWeek))+
    srow('Total jobs completed',String(jobsDoneTotal));

  // Inquiries analytics
  var inqTotal=inquiries.length;
  var inqNew=inquiries.filter(function(i){return i.status==='new';}).length;
  var inqActive=inquiries.filter(function(i){return i.status==='new'||i.status==='viewed';}).length;
  var inqWon=inquiries.filter(function(i){return i.status==='won';}).length;
  var inqLost=inquiries.filter(function(i){return i.status==='lost';}).length;
  var convRate=inqTotal>0?Math.round(inqWon/inqTotal*100):0;

  var avgDays='—';
  var converted=inquiries.filter(function(i){return i.status==='won'&&i.converted_at&&i.created_at;});
  if(converted.length){
    var totalMs=converted.reduce(function(acc,i){return acc+(new Date(i.converted_at)-new Date(i.created_at));},0);
    avgDays=Math.round(totalMs/converted.length/86400000)+' days';
  }

  var inqStatsEl=document.getElementById('inq-stats');
  if(inqStatsEl)inqStatsEl.innerHTML=
    '<div class="stat"><div class="stat-lbl">Total inquiries</div><div class="stat-val">'+inqTotal+'</div><div class="stat-hint">All time</div></div>'+
    '<div class="stat"><div class="stat-lbl">Active</div><div class="stat-val">'+inqActive+'</div><div class="stat-hint">'+inqNew+' unread</div></div>'+
    '<div class="stat"><div class="stat-lbl">Converted</div><div class="stat-val">'+inqWon+'</div><div class="stat-hint">'+convRate+'% conversion rate</div></div>'+
    '<div class="stat"><div class="stat-lbl">Avg. time to convert</div><div class="stat-val">'+avgDays+'</div><div class="stat-hint">From inquiry to client</div></div>';

  // Source breakdown
  var bySource={};
  inquiries.forEach(function(i){var s=i.source||'Not specified';bySource[s]=(bySource[s]||0)+1;});
  var srcSorted=Object.keys(bySource).map(function(s){return{source:s,n:bySource[s]};}).sort(function(a,b){return b.n-a.n;});
  var srcCard=document.getElementById('inq-source-card');
  if(srcCard){
    if(!srcSorted.length){
      srcCard.innerHTML='<div class="rep-title">Inquiries by source</div><div style="padding:12px 0;color:var(--stone);font-size:13px">No inquiries yet.</div>';
    } else {
      var maxSrc=srcSorted[0].n||1;
      srcCard.innerHTML='<div class="rep-title">Inquiries by source</div>'+srcSorted.map(function(s){
        return'<div class="cl-bar-row">'+
          '<span class="cl-bar-name">'+esc(s.source)+'</span>'+
          '<div class="cl-bar-track"><div class="cl-bar-fill" style="width:'+Math.round(s.n/maxSrc*100)+'%"></div></div>'+
          '<span class="cl-bar-val">'+s.n+(s.n===1?' lead':' leads')+'</span></div>';
      }).join('');
    }
  }

  // Lost reason breakdown
  var byLost={};
  inquiries.filter(function(i){return i.status==='lost';}).forEach(function(i){
    var r=i.lost_reason||'No reason given';byLost[r]=(byLost[r]||0)+1;
  });
  var lostSorted=Object.keys(byLost).map(function(r){return{reason:r,n:byLost[r]};}).sort(function(a,b){return b.n-a.n;});
  var lostCard=document.getElementById('inq-lost-card');
  if(lostCard){
    if(!lostSorted.length){
      lostCard.innerHTML='<div class="rep-title">Lost reasons</div><div style="padding:12px 0;color:var(--stone);font-size:13px">'+(inqLost?'No reasons recorded.':'No lost inquiries.')+'</div>';
    } else {
      var maxLost=lostSorted[0].n||1;
      lostCard.innerHTML='<div class="rep-title">Lost reasons</div>'+lostSorted.map(function(r){
        return'<div class="cl-bar-row">'+
          '<span class="cl-bar-name">'+esc(r.reason)+'</span>'+
          '<div class="cl-bar-track"><div class="cl-bar-fill" style="width:'+Math.round(r.n/maxLost*100)+'%;opacity:.5"></div></div>'+
          '<span class="cl-bar-val">'+r.n+'</span></div>';
      }).join('');
    }
  }

  var inqSumEl=document.getElementById('inq-summary');
  if(inqSumEl)inqSumEl.innerHTML=
    srow('Total inquiries',String(inqTotal))+
    srow('Active (unactioned)',String(inqActive))+
    srow('Converted to clients',String(inqWon))+
    srow('Lost',String(inqLost))+
    srow('Conversion rate',convRate+'%')+
    srow('Avg. days to convert',avgDays);
MQ.sb.from('inquiries').select('id',{count:'exact',head:true}).eq('status','new').then(function(r){
  var n=r.count||0;var el=document.getElementById('inq-notif');
  if(el&&n>0){el.textContent=n>9?'9+':String(n);el.classList.add('show');}
});
});

var btn=document.getElementById('mob-menu');
var overlay=document.getElementById('mob-overlay');
if(btn)btn.addEventListener('click',function(){document.body.classList.toggle('mob-open');});
if(overlay)overlay.addEventListener('click',function(e){if(!e.target.closest('.mob-nav-links')||e.target.tagName==='A')document.body.classList.remove('mob-open');});

}); // end requireAuth
})();
</script>
</body>
</html>
