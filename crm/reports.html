<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Reports — MyQuest CRM</title>
<link rel="stylesheet" href="style.css?v=20260805">
<style>
.rep-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.rep-card{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);padding:24px}
.rep-title{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin-bottom:20px}

/* Bar chart */
.bar-chart{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-lbl{font-size:11.5px;color:var(--stone);width:28px;flex-shrink:0;text-align:right}
.bar-track{flex:1;height:8px;background:rgba(35,44,84,.07);border-radius:4px;overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--navy)}
.bar-fill.green{background:var(--green)}
.bar-val{font-size:11.5px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;width:52px;text-align:right;flex-shrink:0}

/* Client breakdown */
.cl-bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.cl-bar-row:last-child{margin-bottom:0}
.cl-bar-name{font-size:12px;color:var(--stone);width:140px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl-bar-track{flex:1;height:6px;background:rgba(35,44,84,.07);border-radius:3px;overflow:hidden}
.cl-bar-fill{height:100%;border-radius:3px;background:var(--navy);opacity:.7}
.cl-bar-val{font-size:11.5px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;width:58px;text-align:right;flex-shrink:0}

/* Summary table */
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--hair)}
.sum-row:last-child{border-bottom:none;padding-bottom:0}
.sum-row:first-child{padding-top:0}
.sum-lbl{font-size:12.5px;color:var(--stone)}
.sum-val{font-size:13px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums}

@media(max-width:900px){.rep-grid{grid-template-columns:1fr}}
@media(max-width:500px){.cl-bar-name{width:90px}}
</style>
</head>
<body>
<div class="layout">

        Overview

      <a class="sb-item" href="index.html">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>

    <div class="ac pg-4" id="rep-summary"></div>

</div>
<div class="mob-overlay" id="mob-overlay"><div class="mob-nav-inner"><nav class="mob-nav-links"><a href="overview.html">Overview</a><a href="index.html">Clients</a><a href="jobs.html">Jobs</a><a href="quotes.html">Quotes</a><a href="invoices.html">Invoices</a><a href="calculator.html">Calculator</a><a href="scope.html">Scope</a><a href="reports.html" class="mob-on">Reports</a><a href="staff.html">Staff</a></nav></div></div>
<script>
(function(){
'use strict';

if(localStorage.getItem('mq_v')!=='2'){
  Object.keys(localStorage).filter(function(k){return k.indexOf('mq_')===0;}).forEach(function(k){localStorage.removeItem(k);});
  localStorage.setItem('mq_v','2');
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ls(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):[];}catch(e){return[];}}

var invoices=ls('mq_invoices');
var jobs=ls('mq_jobs');
var quotes=ls('mq_quotes');

var now=new Date();
var yr=now.getFullYear();
var mo=now.getMonth();
var MO_LABELS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var paidYTD=invoices.filter(function(i){return i.status==='paid'&&i.issued&&i.issued.slice(0,4)===String(yr);});
var ytdRev=paidYTD.reduce(function(s,i){return s+(Number(i.amount)||0);},0);
var elapsedMonths=mo+1;
var avgPerMonth=elapsedMonths>0?Math.round(ytdRev/elapsedMonths):0;
var jobsDone=jobs.filter(function(j){return j.status==='completed'&&j.date&&j.date.slice(0,4)===String(yr);}).length;
var totalInvYTD=invoices.filter(function(i){return i.issued&&i.issued.slice(0,4)===String(yr);}).length;
var paidInvYTD=paidYTD.length;
var collRate=totalInvYTD>0?(paidInvYTD/totalInvYTD*100).toFixed(1)+'%':'—';

// Stat tiles
var statsEl=document.getElementById('rep-stats');
if(statsEl){
  statsEl.innerHTML=
    '<div class="stat"><div class="stat-lbl">YTD revenue</div><div class="stat-val">$'+ytdRev.toLocaleString('en-AU')+'</div><div class="stat-hint">Jan – '+MO_LABELS[mo]+' '+yr+'</div></div>'+
    '<div class="stat"><div class="stat-lbl">Avg per month</div><div class="stat-val">$'+avgPerMonth.toLocaleString('en-AU')+'</div><div class="stat-hint">Based on '+elapsedMonths+' month'+(elapsedMonths!==1?'s':'')+'</div></div>'+
    '<div class="stat"><div class="stat-lbl">Jobs completed</div><div class="stat-val">'+jobsDone+'</div><div class="stat-hint">YTD</div></div>'+
    '<div class="stat"><div class="stat-lbl">Collection rate</div><div class="stat-val">'+collRate+'</div><div class="stat-hint">Invoices paid</div></div>';
}

// Monthly revenue bar chart
var moRev=new Array(12).fill(0);
paidYTD.forEach(function(i){var m=new Date(i.issued+'T00:00:00').getMonth();moRev[m]+=Number(i.amount)||0;});
var maxMo=Math.max.apply(null,moRev.slice(0,mo+1).concat([1]));
var chartCard=document.getElementById('rev-chart-card');
if(chartCard){
  var barRows=MO_LABELS.slice(0,mo+1).map(function(lbl,m){
    var pct=Math.round(moRev[m]/maxMo*100);
    return '<div class="bar-row">'+
      '<span class="bar-lbl">'+lbl+'</span>'+
      '<div class="bar-track"><div class="bar-fill'+(m===mo?' green':'')+'" style="width:'+pct+'%"></div></div>'+
      '<span class="bar-val">$'+moRev[m].toLocaleString('en-AU')+'</span>'+
    '</div>';
  }).join('');
  chartCard.innerHTML='<div class="rep-title">Monthly revenue — '+yr+'</div><div class="bar-chart">'+barRows+'</div>';
}

// Revenue by client
var byClient={};
invoices.forEach(function(i){if(!i.clientName)return;byClient[i.clientName]=(byClient[i.clientName]||0)+(Number(i.amount)||0);});
var sorted=Object.keys(byClient).map(function(n){return{name:n,total:byClient[n]};}).sort(function(a,b){return b.total-a.total;});
var clientCard=document.getElementById('client-chart-card');
if(clientCard){
  if(!sorted.length){
    clientCard.innerHTML='<div class="rep-title">Revenue by client</div><div style="padding:12px 0;color:var(--stone);font-size:13px">No invoice data yet.</div>';
  } else {
    var maxClient=sorted[0].total||1;
    var clientRows=sorted.slice(0,8).map(function(c){
      return '<div class="cl-bar-row">'+
        '<span class="cl-bar-name">'+esc(c.name)+'</span>'+
        '<div class="cl-bar-track"><div class="cl-bar-fill" style="width:'+Math.round(c.total/maxClient*100)+'%"></div></div>'+
        '<span class="cl-bar-val">$'+c.total.toLocaleString('en-AU')+'</span>'+
      '</div>';
    }).join('');
    clientCard.innerHTML='<div class="rep-title">Revenue by client</div>'+clientRows;
  }
}

// YTD summary table
var allSentQ=quotes.filter(function(q){return q.status!=='draft';}).length;
var accQ=quotes.filter(function(q){return q.status==='accepted';}).length;
var accRate=allSentQ>0?Math.round(accQ/allSentQ*100)+'%':'—';
var outstanding=invoices.filter(function(i){return i.status!=='paid';}).reduce(function(s,i){return s+(Number(i.amount)||0);},0);
var sumEl=document.getElementById('rep-summary');
if(sumEl){
  function srow(lbl,val){return '<div class="sum-row"><span class="sum-lbl">'+lbl+'</span><span class="sum-val">'+val+'</span></div>';}
  sumEl.innerHTML=
    srow('Total revenue','$'+ytdRev.toLocaleString('en-AU'))+
    srow('Total invoices raised',String(totalInvYTD))+
    srow('Total invoices paid',String(paidInvYTD))+
    srow('Outstanding balance','$'+outstanding.toLocaleString('en-AU'))+
    srow('Total jobs completed',String(jobsDone))+
    srow('Quotes sent',String(allSentQ))+
    srow('Quote acceptance rate',accRate);
}

// Mobile nav
var btn=document.getElementById('mob-menu');
var overlay=document.getElementById('mob-overlay');
function mobClose(){document.body.classList.remove('mob-open');}
if(btn)btn.addEventListener('click',function(){document.body.classList.toggle('mob-open');});
if(overlay)overlay.addEventListener('click',function(e){if(!e.target.closest('.mob-nav-links')||e.target.tagName==='A')mobClose();});

})();
</script>
</body>
