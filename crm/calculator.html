<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Quote Calculator — MyQuest CRM</title>
<link rel="stylesheet" href="style.css?v=20260814">
<style>
/* Layout */
.qc-layout{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
.qc-form-col{min-width:0}
.qc-section{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);padding:20px 22px;margin-bottom:14px}
.qc-sec-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin-bottom:14px;display:block}
.qc-sec-inner{display:flex;gap:20px}
.qc-sec-inner>div{flex:1;min-width:0}
#qc-preview{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);padding:28px 24px;position:sticky;top:28px}
/* Placeholder */
.qc-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 20px;gap:10px;text-align:center}
/* Pills */
.qc-pills{display:flex;flex-wrap:wrap;gap:9px}
.qc-pill{border:1.5px solid var(--hair-md);border-radius:999px;padding:9px 19px;color:var(--stone);font-size:14px;background:var(--field);cursor:pointer;transition:all .18s;font-family:inherit;line-height:1;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.qc-pill:hover{border-color:rgba(35,44,84,.35);color:var(--navy)}
.qc-pill.on{background:var(--navy);color:var(--on);border-color:var(--navy);font-weight:600}
.qc-pills-v{flex-direction:column}
.qc-pills-v .qc-pill{text-align:center}
/* Stepper */
.qc-stepper{display:inline-flex;align-items:center;border:1.5px solid var(--hair-md);border-radius:999px;overflow:hidden}
.qc-sbtn{background:none;border:none;color:var(--navy);width:44px;height:44px;font-size:20px;cursor:pointer;transition:background .18s;font-family:inherit;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.qc-sbtn:hover{background:rgba(35,44,84,.05)}
.qc-stepper .qc-sbtn:first-child{border-radius:999px 0 0 999px}
.qc-stepper .qc-sbtn:last-child{border-radius:0 999px 999px 0}
.qc-snum{color:var(--navy);font-size:17px;font-weight:600;min-width:42px;text-align:center}
.qc-sub{color:var(--stone);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:8px}
.qc-fields-wrap{display:flex;flex-direction:column;gap:16px}
/* SQM */
.qc-sqm-wrap{margin:4px 0}
.qc-sqm-row{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:14px;margin-bottom:14px}
.qc-sqm-field{display:flex;align-items:baseline;gap:8px;justify-content:center}
#qc-sqm-v{width:100px;text-align:center;font-size:34px;font-weight:700;background:transparent;border:none;border-bottom:2px solid rgba(35,44,84,.18);color:var(--navy);padding:4px 0;outline:none;-moz-appearance:textfield;font-family:inherit}
#qc-sqm-v::-webkit-outer-spin-button,#qc-sqm-v::-webkit-inner-spin-button{-webkit-appearance:none}
#qc-sqm-v:focus{border-bottom-color:rgba(35,44,84,.55)}
.qc-sqm-u{font-size:14px;font-weight:500;color:var(--stone)}
/* Preview result */
.qc-rtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.qc-rtag{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--stone);background:var(--field);border-radius:999px;padding:4px 10px}
.qc-range{font-size:32px;font-weight:700;color:var(--navy);letter-spacing:-.025em;line-height:1}
.qc-per-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px}
.qc-per{color:var(--stone);font-size:13px}
.qc-mth{color:var(--stone);font-size:13px}
.qc-per-sub{font-size:12px;color:var(--stone);margin-top:3px}
.qc-breakdown{margin:18px 0 0;border-top:1px solid var(--hair)}
.qc-brow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair);color:var(--stone);font-size:13px}
.qc-brow.tot{color:var(--navy);font-weight:600;border-bottom:none;padding-top:14px;font-size:14px;border-top:1px solid var(--hair-md);margin-top:4px}
.qc-brow.ann{color:var(--navy);font-weight:700;font-size:13px;border-bottom:none;padding-top:8px}
.qc-buf-row{width:100%;border:none;border-bottom:1px solid var(--hair);background:none;font-family:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;color:rgba(35,44,84,.28);transition:color .15s;text-align:left;-webkit-tap-highlight-color:transparent}
.qc-buf-row:hover,.qc-buf-row.on{color:var(--stone)}
.qc-incl{border-top:1px solid var(--hair);margin:16px 0 0;padding-top:12px}
.qc-incl-row{font-size:12px;color:var(--stone);padding:3px 0}
.qc-valid{font-size:10.5px;color:rgba(35,44,84,.3);text-align:center;margin-top:6px;letter-spacing:.04em}
/* Action buttons */
.qc-save{width:100%;background:var(--navy);color:var(--on);border:none;border-radius:999px;padding:14px 20px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;letter-spacing:-.01em;transition:opacity .18s;margin-top:18px;-webkit-tap-highlight-color:transparent}
.qc-save:hover{opacity:.88}
.qc-dl{width:100%;background:transparent;border:1.5px solid var(--hair-md);border-radius:999px;color:var(--navy);padding:11px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;margin-top:8px;font-family:inherit}
.qc-dl:hover{background:rgba(35,44,84,.04);border-color:rgba(35,44,84,.3)}
.qc-restart{background:none;border:none;color:var(--stone);font-size:13px;cursor:pointer;padding:10px;transition:color .2s;width:100%;text-align:center;font-family:inherit}
.qc-restart:hover{color:var(--navy)}
/* Save form */
.qc-sf-wrap{display:flex;flex-direction:column;gap:11px;margin-bottom:16px}
.qc-sf-row{display:flex;flex-direction:column;gap:5px}
.qc-sf-row label{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);font-weight:700}
.qc-sf-row input{background:var(--field);border:1.5px solid var(--hair);border-radius:var(--r-sm);padding:11px 14px;font-size:14px;color:var(--navy);font-family:inherit;outline:none;-webkit-appearance:none;transition:border-color .18s}
.qc-sf-row input::placeholder{color:rgba(35,44,84,.25)}
.qc-sf-row input:focus{border-color:rgba(35,44,84,.4)}
.qc-sf-submit{width:100%;background:var(--navy);color:var(--on);border:none;border-radius:999px;padding:14px 20px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:opacity .18s}
.qc-sf-submit:hover{opacity:.88}
.qc-sf-submit:disabled{opacity:.35;cursor:not-allowed}
/* Success */
.qc-ok{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 0}
.qc-ok-tick{width:48px;height:48px;background:rgba(35,44,84,.07);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:20px;color:var(--navy)}
.qc-ok-title{font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin-bottom:7px}
.qc-ok-sub{font-size:14px;color:var(--stone);line-height:1.6;margin-bottom:24px}
.qc-view-jobs{display:block;width:100%;background:var(--navy);color:var(--on);border:none;border-radius:999px;padding:14px 20px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;text-align:center;margin-bottom:4px;box-sizing:border-box}
.qc-view-jobs:hover{opacity:.88}
/* Mobile sticky bar */
.qc-mob-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--navy);color:var(--on);padding:14px 20px;align-items:center;justify-content:space-between;border-top:1px solid rgba(243,239,228,.12)}
.qc-mob-price{font-size:17px;font-weight:700;letter-spacing:-.02em}
.qc-mob-sub{font-size:11px;color:rgba(243,239,228,.5);margin-top:2px}
.qc-mob-see{background:rgba(243,239,228,.12);border:none;color:var(--on);font-family:inherit;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}
/* Print */
.qc-print{display:none}
@media print{body>*{display:none!important}#qc-print{display:block!important;position:fixed;inset:0;padding:18mm 20mm;background:#fff;color:#232c54;font-family:system-ui,sans-serif;font-size:13px;line-height:1.6}}
/* Mobile */
@media (max-width:768px){
  .stats{display:none}
  .qc-layout{grid-template-columns:1fr}
  #qc-preview{position:static}
  .qc-sec-inner{flex-direction:column;gap:14px}
  .main{padding:20px 16px 88px}
  .qc-mob-bar{display:flex}
  .qc-range{font-size:28px}
  .qc-section{padding:16px 18px}
}
</style>
</head>

<script>
(function(){
'use strict';
window.MQ.requireAuth(function(){

if(localStorage.getItem('mq_v')!=='3'){
  Object.keys(localStorage).filter(function(k){return k.indexOf('mq_')===0;}).forEach(function(k){localStorage.removeItem(k);});
  localStorage.setItem('mq_v','3');
}

var QC={
  rate:65,
  sqmHr:{maintenance:200,deep:85},
  spaceMult:{office:1.0,retail:1.0,medical:1.5,industrial:1.0},
  bathMins:22,
  kitchenMins:25,
  extras:{floor_polish:0.55,carpet:0.25,rubbish:25},
  freqDisc:{once:1.0,monthly:0.97,fortnightly:0.95,weekly:0.90},
  suppliesCost:20,
  bufferPct:0.15,
  minHrsMaint:2,
  minHrsDeepRecurring:3,
  minHrsDeep:5
};

var SPACE_LABELS=['Office / Corporate','Retail / Showroom','Medical / Allied Health','Industrial / Warehouse'];
var SPACE_KEYS=['office','retail','medical','industrial'];
var FREQ_LABELS=['One-off','Monthly','Fortnightly','Weekly'];
var FREQ_KEYS=['once','monthly','fortnightly','weekly'];
var EXTRA_LABELS=['Hard floor polish','Carpet vacuum','Rubbish removal'];
var EXTRA_KEYS=['floor_polish','carpet','rubbish'];

var s={
  space:null,sqm:100,baths:2,kitchen:null,freq:null,type:null,
  extras:{},buffer:false,hasResult:false,
  saving:false,saved:false,savedClientName:''
};
var lastResult=null;

function resetState(){
  s={space:null,sqm:100,baths:2,kitchen:null,freq:null,type:null,extras:{},buffer:false,hasResult:false,saving:false,saved:false,savedClientName:''};
  lastResult=null;
}

// ─── UTILS ───────────────────────────────────────────────

function calc(){
  var sqm=Math.max(50,Math.min(5000,Math.floor(s.sqm||50)));
  var hrs=(sqm/QC.sqmHr[s.type])*QC.spaceMult[s.space];
  var bHrs=(s.baths*QC.bathMins)/60;
  var kHrs=s.kitchen?QC.kitchenMins/60:0;
  var total=Math.ceil((hrs+bHrs+kHrs)*2)/2;
  if(s.type==='maintenance')total=Math.max(total,QC.minHrsMaint);
  else if(s.freq==='once')total=Math.max(total,QC.minHrsDeep);
  else total=Math.max(total,QC.minHrsDeepRecurring);
  var labour=total*QC.rate;
  var sup=QC.suppliesCost;
  var ext=0;
  if(s.extras.floor_polish)ext+=sqm*QC.extras.floor_polish;
  if(s.extras.carpet)ext+=sqm*QC.extras.carpet;
  if(s.extras.rubbish)ext+=QC.extras.rubbish;
  var per=labour+sup+ext;
  var bufferAmt=s.buffer?per*QC.bufferPct:0;
  per+=bufferAmt;
  var disc=QC.freqDisc[s.freq]||1.0;
  var subBeforeDisc=per;
  per=per*disc;
  var mthMult={once:null,monthly:1,fortnightly:2.17,weekly:4.33};
  return{per:per,lo:r5(per*.9),hi:r5(per*1.1),monthly:mthMult[s.freq]?per*mthMult[s.freq]:null,hrs:total,labour:labour,sup:sup,ext:ext,bufferAmt:bufferAmt,disc:disc,subBeforeDisc:subBeforeDisc};
}
function r5(n){return Math.round(n/5)*5;}
function au(n){return '$'+Math.round(n).toLocaleString('en-AU');}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function brow(l,v){return '<div class="qc-brow"><span>'+l+'</span><span>'+v+'</span></div>';}
function pill(label,key,on,group){
  return '<button type="button" class="qc-pill'+(on?' on':'')+'" data-key="'+key+'"'+(group?' data-grp="'+group+'"':'')+'>'+label+'</button>';
}

// ─── STATS STRIP ─────────────────────────────────────────

function initStats(){
  var el=document.getElementById('qc-stats');
  if(!el)return;
  var minCost=QC.rate*QC.minHrsMaint;
  var deepCost=QC.rate*QC.minHrsDeep+QC.suppliesCost;
  el.innerHTML=
    '<div class="stat">'+
      '<div class="stat-lbl">Labour rate</div>'+
      '<div class="stat-val">$'+QC.rate+'<span style="font-size:13px;font-weight:500;opacity:.6"> /hr</span></div>'+
    '</div>'+
    '<div class="stat">'+
      '<div class="stat-lbl">Minimum clean</div>'+
      '<div class="stat-val">'+QC.minHrsMaint+' hrs</div>'+
      '<div class="stat-hint">'+au(minCost)+' min charge</div>'+
    '</div>'+
    '<div class="stat">'+
      '<div class="stat-lbl">Deep clean</div>'+
      '<div class="stat-val">from '+au(deepCost)+'</div>'+
      '<div class="stat-hint">'+QC.minHrsDeep+' hr minimum</div>'+
    '</div>'+
    '<div class="stat">'+
      '<div class="stat-lbl">Site allowance</div>'+
      '<div class="stat-val">+'+Math.round(QC.bufferPct*100)+'%</div>'+
      '<div class="stat-hint">tap to include</div>'+
    '</div>';
}

// ─── FORM COLUMN ─────────────────────────────────────────

function renderFormCol(){
  var h='';

  h+='<div class="qc-section">'+
    '<span class="qc-sec-lbl">Premises type</span>'+
    '<div class="qc-pills qc-pills-v">'+
      SPACE_KEYS.map(function(k,i){return pill(SPACE_LABELS[i],k,s.space===k,'space');}).join('')+
    '</div>'+
  '</div>';

  h+='<div class="qc-section">'+
    '<span class="qc-sec-lbl">Floor area</span>'+
    '<div class="qc-sqm-wrap">'+
      '<div class="qc-sqm-row">'+
        '<button type="button" class="qc-sbtn" id="qc-sqm-m">&#8722;</button>'+
        '<div class="qc-sqm-field">'+
          '<input type="number" id="qc-sqm-v" min="50" max="5000" step="1" value="'+(s.sqm||'')+'" inputmode="numeric" placeholder="100">'+
          '<span class="qc-sqm-u">sqm</span>'+
        '</div>'+
        '<button type="button" class="qc-sbtn" id="qc-sqm-p">+</button>'+
      '</div>'+
      '<p id="qc-sqm-hint" style="color:rgba(35,44,84,.4);font-size:12px;margin:0 0 10px;visibility:hidden;text-align:center">Minimum 50 sqm</p>'+
      '<div class="qc-pills">'+
        [50,100,200,500,1000].map(function(v){
          return '<button type="button" class="qc-pill'+(s.sqm===v?' on':'')+'" data-sqm="'+v+'">'+v+'</button>';
        }).join('')+
      '</div>'+
    '</div>'+
  '</div>';

  h+='<div class="qc-section">'+
    '<span class="qc-sec-lbl">Bathrooms &amp; kitchen</span>'+
    '<div class="qc-sec-inner">'+
      '<div>'+
        '<div class="qc-sub">Bathrooms / toilets</div>'+
        '<div class="qc-stepper">'+
          '<button type="button" class="qc-sbtn" id="qc-minus">&#8722;</button>'+
          '<span class="qc-snum" id="qc-bnum">'+s.baths+'</span>'+
          '<button type="button" class="qc-sbtn" id="qc-plus">+</button>'+
        '</div>'+
      '</div>'+
      '<div>'+
        '<div class="qc-sub">Kitchen or breakroom?</div>'+
        '<div class="qc-pills">'+
          pill('Yes','yes',s.kitchen===true,'kit')+
          pill('No','no',s.kitchen===false,'kit')+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';

  h+='<div class="qc-section">'+
    '<span class="qc-sec-lbl">Frequency &amp; clean type</span>'+
    '<div class="qc-sec-inner">'+
      '<div>'+
        '<div class="qc-sub">Frequency</div>'+
        '<div class="qc-pills qc-pills-v">'+
          FREQ_KEYS.map(function(k,i){return pill(FREQ_LABELS[i],k,s.freq===k,'freq');}).join('')+
        '</div>'+
      '</div>'+
      '<div>'+
        '<div class="qc-sub">Type of clean</div>'+
        '<div class="qc-pills qc-pills-v">'+
          pill('Maintenance','maintenance',s.type==='maintenance','type')+
          pill('Deep clean','deep',s.type==='deep','type')+
        '</div>'+
      '</div>'+
    '</div>'+
  '</div>';

  h+='<div class="qc-section">'+
    '<span class="qc-sec-lbl">Add-ons <span style="font-weight:500;color:rgba(35,44,84,.35);text-transform:none;letter-spacing:0;font-size:9px">— Optional</span></span>'+
    '<div class="qc-pills qc-pills-v">'+
      EXTRA_KEYS.map(function(k,i){return pill(EXTRA_LABELS[i],k,!!s.extras[k],'ext');}).join('')+
    '</div>'+
  '</div>';

  return h;
}

function initForm(){
  var fc=document.getElementById('qc-form');
  if(fc)fc.innerHTML=renderFormCol();
  bindForm();
}

function bindForm(){
  document.querySelectorAll('#qc-form .qc-pill[data-grp]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var key=this.dataset.key,grp=this.dataset.grp;
      if(grp==='space')s.space=key;
      else if(grp==='kit')s.kitchen=(key==='yes');
      else if(grp==='freq')s.freq=key;
      else if(grp==='type')s.type=key;
      else if(grp==='ext'){s.extras[key]=!s.extras[key];this.classList.toggle('on',!!s.extras[key]);calcLive();return;}
      document.querySelectorAll('#qc-form .qc-pill[data-grp="'+grp+'"]').forEach(function(b){
        b.classList.toggle('on',b.dataset.key===key);
      });
      calcLive();
    });
  });

  document.querySelectorAll('#qc-form .qc-pill[data-sqm]').forEach(function(btn){
    btn.addEventListener('click',function(){
      s.sqm=parseInt(this.dataset.sqm,10);
      document.querySelectorAll('#qc-form .qc-pill[data-sqm]').forEach(function(b){
        b.classList.toggle('on',parseInt(b.dataset.sqm,10)===s.sqm);
      });
      var v=document.getElementById('qc-sqm-v');if(v)v.value=s.sqm;
      calcLive();
    });
  });

  var sqmM=document.getElementById('qc-sqm-m');
  var sqmP=document.getElementById('qc-sqm-p');
  var sqmV=document.getElementById('qc-sqm-v');
  if(sqmM)sqmM.addEventListener('click',function(){
    var v=Math.max(50,(s.sqm||100)-50);s.sqm=v;
    if(sqmV)sqmV.value=v;
    syncSqmPills();calcLive();
  });
  if(sqmP)sqmP.addEventListener('click',function(){
    var v=Math.min(5000,(s.sqm||100)+50);s.sqm=v;
    if(sqmV)sqmV.value=v;
    syncSqmPills();calcLive();
  });
  if(sqmV)sqmV.addEventListener('input',function(){
    var v=parseInt(this.value,10);
    s.sqm=(isNaN(v)||v<1)?0:Math.min(5000,v);
    var hint=document.getElementById('qc-sqm-hint');
    if(hint)hint.style.visibility=(s.sqm>=10&&s.sqm<50)?'visible':'hidden';
    syncSqmPills();calcLive();
  });

  var bm=document.getElementById('qc-minus');
  var bp=document.getElementById('qc-plus');
  if(bm)bm.addEventListener('click',function(){
    if(s.baths>0){s.baths--;var n=document.getElementById('qc-bnum');if(n)n.textContent=s.baths;calcLive();}
  });
  if(bp)bp.addEventListener('click',function(){
    if(s.baths<8){s.baths++;var n=document.getElementById('qc-bnum');if(n)n.textContent=s.baths;calcLive();}
  });
}

function syncSqmPills(){
  document.querySelectorAll('#qc-form .qc-pill[data-sqm]').forEach(function(b){
    b.classList.toggle('on',parseInt(b.dataset.sqm,10)===s.sqm);
  });
}

// ─── PREVIEW PANEL ───────────────────────────────────────

function renderPreviewEmpty(){
  return '<div class="qc-ph">'+
    '<div style="font-size:32px;opacity:.18;color:var(--navy);margin-bottom:4px">&#8592;</div>'+
    '<div style="font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(35,44,84,.28);margin-bottom:6px">Live estimate</div>'+
    '<div style="color:var(--stone);font-size:13px;line-height:1.6">Fill in the details on the left<br>to see your quote instantly.</div>'+
  '</div>';
}

function renderPreview(r){
  if(s.saved)return renderSaved();
  if(s.saving)return renderSaveForm(r);

  var sLab={office:'Office',retail:'Retail',medical:'Medical',industrial:'Industrial'}[s.space]||'';
  var qLab=s.sqm+' sqm';
  var fLab=FREQ_LABELS[FREQ_KEYS.indexOf(s.freq)]||'';
  var tLab=s.type==='deep'?'Deep clean':'Maintenance';
  var ANN_MULT={monthly:12,fortnightly:26,weekly:52};
  var annVal=ANN_MULT[s.freq]?r.per*ANN_MULT[s.freq]:null;
  var weeklyEq=null;
  if(s.freq==='fortnightly')weeklyEq=r.per/2;
  else if(s.freq==='monthly')weeklyEq=r.per*12/52;

  var rows='';
  rows+=brow('Labour ('+r.hrs.toFixed(1)+' hrs)',au(r.labour));
  rows+=brow('Supplies',au(r.sup));
  if(r.ext>0)rows+=brow('Add-ons',au(r.ext));
  rows+='<button type="button" class="qc-buf-row'+(s.buffer?' on':'')+'" id="qc-buf">'+
    '<span>Site allowance <span style="opacity:.5;font-size:11px">(+'+Math.round(QC.bufferPct*100)+'%)</span></span>'+
    '<span>'+(s.buffer?'+'+au(r.bufferAmt):'tap to add')+'</span>'+
  '</button>';
  if(r.disc<1.0)rows+=brow('Freq. discount ('+Math.round((1-r.disc)*100)+'% off)','&#8722;'+au(r.subBeforeDisc*(1-r.disc)));
  rows+='<div class="qc-brow tot"><span>Per clean</span><span>'+au(r.per)+'</span></div>';
  if(annVal)rows+='<div class="qc-brow ann"><span>Annual contract</span><span>&#8776; '+au(annVal)+'</span></div>';

  updatePrint(r,sLab,qLab,fLab,tLab);

  return '<div class="qc-rtags">'+
    '<span class="qc-rtag">'+esc(sLab)+'</span>'+
    '<span class="qc-rtag">'+esc(qLab)+'</span>'+
    '<span class="qc-rtag">'+esc(fLab)+'</span>'+
    '<span class="qc-rtag">'+tLab+'</span>'+
  '</div>'+
  '<div class="qc-range">'+au(r.lo)+' &#8211; '+au(r.hi)+'</div>'+
  '<div class="qc-per-row">'+
    '<span class="qc-per">per clean (estimate)</span>'+
    (r.monthly?'<span class="qc-mth">&#8776;'+au(r.monthly)+'/month</span>':'')+
  '</div>'+
  (weeklyEq?'<div class="qc-per-sub">&#8776; '+au(weeklyEq)+' per week</div>':'')+
  '<div class="qc-breakdown">'+rows+'</div>'+
  '<div class="qc-incl">'+
    '<div class="qc-incl-row">&#10003;&#160; Cleaning supplies &amp; chemicals</div>'+
    '<div class="qc-incl-row">&#10003;&#160; Public liability insurance</div>'+
    '<div class="qc-incl-row">&#10003;&#160; Background-checked, trained staff</div>'+
  '</div>'+
  '<button type="button" class="qc-save" id="qc-save">Save this quote &#8594;</button>'+
  '<button type="button" class="qc-dl" id="qc-dl">&#8595; Download estimate</button>'+
  '<div class="qc-valid">Estimate valid for 30 days</div>';
}

function renderSaveForm(r){
  var sLab={office:'Office',retail:'Retail',medical:'Medical',industrial:'Industrial'}[s.space]||'';
  var fLab=FREQ_LABELS[FREQ_KEYS.indexOf(s.freq)]||'';
  var tLab=s.type==='deep'?'Deep clean':'Maintenance';
  return '<div class="qc-rtags">'+
    '<span class="qc-rtag">'+esc(sLab)+'</span>'+
    '<span class="qc-rtag">'+s.sqm+' sqm</span>'+
    '<span class="qc-rtag">'+esc(fLab)+'</span>'+
    '<span class="qc-rtag">'+tLab+'</span>'+
  '</div>'+
  '<div style="font-size:22px;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin-bottom:20px">'+au(r.lo)+' &#8211; '+au(r.hi)+'</div>'+
  '<div style="font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin-bottom:14px">Who are we quoting?</div>'+
  '<div class="qc-sf-wrap">'+
    '<div class="qc-sf-row"><label>Business name</label><input type="text" id="qs-biz" placeholder="Acme Pty Ltd" autocomplete="organization"></div>'+
    '<div class="qc-sf-row"><label>Contact name</label><input type="text" id="qs-contact" placeholder="Jane Smith" autocomplete="name"></div>'+
    '<div class="qc-sf-row"><label>Email</label><input type="email" id="qs-email" placeholder="name@company.com.au" autocomplete="email"></div>'+
    '<div class="qc-sf-row"><label>Phone</label><input type="tel" id="qs-phone" placeholder="0400 000 000" autocomplete="tel"></div>'+
    '<div class="qc-sf-row"><label>Site address</label><input type="text" id="qs-site" placeholder="123 Main St, Suburb" autocomplete="street-address"></div>'+
  '</div>'+
  '<button type="button" class="qc-sf-submit" id="qs-submit">Save &amp; create job</button>'+
  '<button type="button" class="qc-restart" id="qc-back-res" style="margin-top:4px">&#8592; Back to quote</button>';
}

function renderSaved(){
  return '<div class="qc-ok">'+
    '<div class="qc-ok-tick">&#10003;</div>'+
    '<div class="qc-ok-title">Done</div>'+
    '<div class="qc-ok-sub">'+esc(s.savedClientName||'')+' has been added as a client and an upcoming job is ready to schedule.</div>'+
    '<a href="jobs.html" class="qc-view-jobs">View jobs &#8594;</a>'+
    '<button type="button" class="qc-restart" id="qc-restart" style="margin-top:4px">&#8592; New quote</button>'+
  '</div>';
}

// ─── MOBILE BAR ──────────────────────────────────────────

function updateMobBar(r){
  var bar=document.getElementById('qc-mob-bar');
  if(!bar)return;
  if(!r){bar.style.display='none';return;}
  bar.style.display='flex';
  var price=document.getElementById('qc-mob-price');
  if(price)price.textContent=au(r.lo)+' – '+au(r.hi);
}

// ─── LIVE CALC ───────────────────────────────────────────

function calcLive(){
  var preview=document.getElementById('qc-preview');
  if(!preview)return;
  var ready=s.space&&s.sqm>=50&&s.kitchen!==null&&s.freq&&s.type;
  if(!ready){
    s.hasResult=false;
    if(!s.saving&&!s.saved)preview.innerHTML=renderPreviewEmpty();
    updateMobBar(null);
    return;
  }
  var r=calc();
  lastResult=r;
  s.hasResult=true;
  preview.innerHTML=renderPreview(r);
  bindPreview(r);
  updateMobBar(s.saved?null:r);
}

function bindPreview(r){
  var buf=document.getElementById('qc-buf');
  if(buf)buf.addEventListener('click',function(){s.buffer=!s.buffer;calcLive();});

  var dl=document.getElementById('qc-dl');
  if(dl)dl.addEventListener('click',function(){
    var el=document.getElementById('qc-print');if(el&&el.innerHTML)window.print();
  });

  var sv=document.getElementById('qc-save');
  if(sv)sv.addEventListener('click',function(){s.saving=true;calcLive();});

  var qss=document.getElementById('qs-submit');
  if(qss)qss.addEventListener('click',saveQuote);

  var bkr=document.getElementById('qc-back-res');
  if(bkr)bkr.addEventListener('click',function(){s.saving=false;calcLive();});

  var rs=document.getElementById('qc-restart');
  if(rs)rs.addEventListener('click',function(){resetState();initForm();calcLive();});
}

// ─── SAVE TO SUPABASE ────────────────────────────────────

function saveQuote(){
  var biz=((document.getElementById('qs-biz')||{}).value||'').trim();
  var contact=((document.getElementById('qs-contact')||{}).value||'').trim();
  var email=((document.getElementById('qs-email')||{}).value||'').trim();
  var phone=((document.getElementById('qs-phone')||{}).value||'').trim();
  var site=((document.getElementById('qs-site')||{}).value||'').trim();
  if(!biz){var f=document.getElementById('qs-biz');if(f)f.focus();return;}
  var btn=document.getElementById('qs-submit');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  var sb=MQ.sb;
  var FREQ_TO_REPEAT={monthly:'monthly',fortnightly:'fortnightly',weekly:'weekly'};
  var SPACE_TO_INDUSTRY={office:'Commercial office',retail:'Retail',medical:'Medical',industrial:'Industrial'};
  sb.from('clients').insert([{
    name:biz,contact:contact||null,email:email||null,phone:phone||null,
    site_address:site||null,industry:SPACE_TO_INDUSTRY[s.space]||null,status:'active'
  }]).select('id,name').single()
    .then(function(res){
      if(res.error)throw res.error;
      var cid=res.data.id,cname=res.data.name;
      var today=new Date().toISOString().slice(0,10);
      var jrow={client_id:cid,client_name:cname,date:today,type:s.type==='deep'?'deep':'maintenance',status:'upcoming'};
      if(site)jrow.site=site;
      if(FREQ_TO_REPEAT[s.freq])jrow.repeat=FREQ_TO_REPEAT[s.freq];
      return sb.from('jobs').insert([jrow]).select('id').single().then(function(jr){
        if(jr.error)throw jr.error;
        s.savedClientName=cname;
        s.saving=false;
        s.saved=true;
        var preview=document.getElementById('qc-preview');
        if(preview){preview.innerHTML=renderSaved();bindPreview(null);}
        updateMobBar(null);
      });
    })
    .catch(function(err){
      if(btn){btn.disabled=false;btn.textContent='Save & create job';}
      alert('Could not save: '+(err.message||String(err)));
    });
}

// ─── PRINT TEMPLATE ──────────────────────────────────────

function updatePrint(r,sLab,qLab,fLab,tLab){
  var el=document.getElementById('qc-print');if(!el)return;
  var date=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  var extList=EXTRA_KEYS.filter(function(k){return s.extras[k];}).map(function(k){return EXTRA_LABELS[EXTRA_KEYS.indexOf(k)];}).join(', ');
  var basedOn=[qLab+' '+sLab,fLab+' '+tLab.toLowerCase()+' clean',s.baths+(s.baths===1?' bathroom':' bathrooms')];
  if(s.kitchen)basedOn.push('Kitchenette');if(extList)basedOn.push(extList);
  function prow(l,v){return '<tr><td style="padding:6px 0;color:#555;border-bottom:1px solid #eee">'+l+'</td><td style="padding:6px 0;text-align:right;font-weight:500;color:#000;border-bottom:1px solid #eee">'+v+'</td></tr>';}
  el.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:16px;margin-bottom:24px">'+
      '<div><div style="font-size:20px;font-weight:700;color:#000">MyQuest</div><div style="font-size:11px;color:#555;margin-top:2px">Pty Ltd</div></div>'+
      '<div style="text-align:right"><div style="font-size:15px;font-weight:600;color:#000">Quote Estimate</div><div style="font-size:11px;color:#555;margin-top:2px">'+date+'</div></div>'+
    '</div>'+
    '<div style="margin-bottom:24px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#555;margin-bottom:10px">Based on</div>'+
    '<ul style="list-style:none;padding:0;margin:0">'+basedOn.map(function(item){return '<li style="font-size:14px;font-weight:500;color:#000;padding:4px 0;border-bottom:1px solid #f0f0f0">'+item+'</li>';}).join('')+'</ul></div>'+
    '<div style="margin-bottom:24px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#555;margin-bottom:10px">Price breakdown</div>'+
    '<table style="width:100%;border-collapse:collapse;font-size:13px">'+
      prow('Labour ('+r.hrs.toFixed(1)+' hrs)',au(r.labour))+
      prow('Supplies',au(r.sup))+
      (r.ext>0?prow(extList||'Add-ons',au(r.ext)):'')+
      (r.bufferAmt>0?prow('Site allowance (+15%)','+'+au(r.bufferAmt)):'')+
      '<tr><td style="padding:8px 0;font-weight:700;font-size:14px;color:#000;border-top:2px solid #000">Per clean</td>'+
      '<td style="padding:8px 0;font-weight:700;font-size:14px;color:#000;text-align:right;border-top:2px solid #000">'+au(r.per)+'</td></tr>'+
    '</table></div>'+
    '<div style="background:#f5f5f5;border-radius:10px;padding:20px 24px;margin-bottom:20px">'+
      '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#555;margin-bottom:6px">Estimated price per clean</div>'+
      '<div style="font-size:30px;font-weight:700;letter-spacing:-.02em;color:#000">'+au(r.lo)+' – '+au(r.hi)+'</div>'+
      (r.monthly?'<div style="font-size:12px;color:#555;margin-top:4px">Approx. '+au(r.monthly)+' per month</div>':'')+
    '</div>'+
    '<div style="font-size:11px;color:#555;line-height:1.65;margin-bottom:22px">This is an estimate only. Final pricing will be confirmed in writing before any work begins.</div>'+
    '<div style="font-size:12px;color:#000;border-top:1px solid #ddd;padding-top:12px">hello@myquest.au  &#183;  0413 154 932  &#183;  myquest.au</div>';
}

initStats();
