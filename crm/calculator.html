<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Quote Calculator — MyQuest CRM</title>
<link rel="stylesheet" href="style.css?v=20260814">
<style>
/* ── Two-column grid (matches overview.html) ── */
.qc-grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.qc-left{min-width:0}

/* ── Section cards (matches .ac) ── */
.qc-card{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);padding:20px 22px;margin-bottom:14px}
.qc-card:last-child{margin-bottom:0}
.qc-card-head{margin-bottom:14px}
.qc-card-lbl{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone)}
.qc-card-hint{font-size:11.5px;color:var(--stone);margin-top:3px}

/* ── Choice buttons ── */
.qc-choices{display:flex;flex-wrap:wrap;gap:8px}
.qc-choice{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;
  background:var(--field);
  border:1.5px solid var(--hair-md);
  border-radius:var(--r-sm);
  color:var(--stone);font-size:13.5px;font-family:inherit;
  cursor:pointer;transition:border-color .13s,color .13s,background .13s;
  line-height:1;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.qc-choice:hover{border-color:rgba(35,44,84,.3);color:var(--navy)}
.qc-choice.on{background:var(--navy);border-color:var(--navy);color:var(--on);font-weight:600}
.qc-choices.col{flex-direction:column}
.qc-choices.col .qc-choice{width:100%}
.qc-choice-ico{width:18px;height:18px;flex-shrink:0;opacity:.55}
.qc-choice.on .qc-choice-ico{opacity:.7}

/* ── SQM input ── */
.qc-sqm-row{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.qc-sqm-mid{display:flex;align-items:baseline;gap:7px}
#qc-sqm-v{
  width:100px;font-size:44px;font-weight:700;color:var(--navy);
  background:transparent;border:none;outline:none;text-align:center;
  -moz-appearance:textfield;font-family:inherit;letter-spacing:-.02em;line-height:1;
}
#qc-sqm-v::-webkit-outer-spin-button,#qc-sqm-v::-webkit-inner-spin-button{-webkit-appearance:none}
.qc-sqm-unit{font-size:15px;font-weight:500;color:var(--stone);letter-spacing:.02em}
.qc-sqm-picks{display:flex;flex-wrap:wrap;gap:6px}
.qc-sqm-pick{
  background:none;border:1px solid var(--hair);border-radius:6px;
  font-family:inherit;font-size:12px;color:var(--stone);cursor:pointer;
  padding:4px 10px;transition:border-color .13s,color .13s,background .13s;
}
.qc-sqm-pick:hover{border-color:rgba(35,44,84,.3);color:var(--navy)}
.qc-sqm-pick.on{background:rgba(35,44,84,.07);border-color:rgba(35,44,84,.25);color:var(--navy);font-weight:600}
.qc-sqm-hint{font-size:11.5px;color:var(--amber);margin-top:6px;display:none}
.qc-sqm-hint.vis{display:block}

/* ── Bathroom stepper ── */
.qc-stepper-row{display:flex;align-items:center;gap:16px}
.qc-ste-btn{
  background:var(--field);border:1.5px solid var(--hair-md);border-radius:var(--r-sm);
  color:var(--stone);font-family:inherit;font-size:18px;width:38px;height:38px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .13s,color .13s;-webkit-tap-highlight-color:transparent;
}
.qc-ste-btn:hover{border-color:rgba(35,44,84,.3);color:var(--navy)}
.qc-ste-val{font-size:26px;font-weight:700;color:var(--navy);min-width:32px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.qc-ste-sub{font-size:11.5px;color:var(--stone);margin-top:2px}

/* ── Inner layouts ── */
.qc-two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.qc-sched-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
.qc-two-lbl{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin-bottom:10px}
.qc-card-sep{border-top:1px solid var(--hair);margin:18px 0 16px}

/* ── Right panel: live preview ── */
#qc-preview{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);position:sticky;top:28px;max-height:calc(100vh - 80px);overflow-y:auto}

/* Placeholder */
.qc-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px;gap:10px;text-align:center}
.qc-ph-icon{opacity:.2;color:var(--navy);margin-bottom:2px}
.qc-ph-ttl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--stone)}
.qc-ph-sub{font-size:13px;color:var(--stone);line-height:1.55}

/* Checklist inside placeholder */
.qc-ph-list{display:flex;flex-direction:column;gap:5px;margin-top:10px;text-align:left;width:100%;max-width:220px}
.qc-ph-item{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--stone)}
.qc-ph-item.done{color:var(--navy)}
.qc-ph-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--hair-md)}
.qc-ph-item.done .qc-ph-dot{background:var(--navy)}

/* Quote panel header band */
.qc-q-band{background:var(--navy);padding:22px 22px 18px;border-radius:calc(var(--r) - 1px) calc(var(--r) - 1px) 0 0}
.qc-q-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.qc-q-tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:rgba(243,239,228,.55);background:rgba(243,239,228,.1);border-radius:5px;padding:3px 8px}
.qc-q-range{font-size:40px;font-weight:700;color:var(--on);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.qc-q-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.qc-q-lbl{font-size:12px;color:var(--on-sub)}
.qc-q-mth{font-size:12px;color:var(--on-sub)}
.qc-q-wk{font-size:11.5px;color:var(--on-sub);margin-top:3px}

/* Quote panel body */
.qc-q-body{padding:18px 22px}
.qc-q-sec{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin:14px 0 8px}
.qc-q-sec:first-child{margin-top:0}

/* Breakdown rows */
.qc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair);color:var(--stone);font-size:13px;font-variant-numeric:tabular-nums}
.qc-row:last-child{border-bottom:none}
.qc-row.total{color:var(--navy);font-weight:600;font-size:13.5px;border-bottom:none;border-top:1px solid var(--hair-md);padding-top:10px;margin-top:4px}
.qc-row.ann{color:var(--navy);font-weight:700;font-size:13px;border-bottom:none;padding-top:6px}

/* Buffer toggle row */
.qc-buf-btn{
  width:100%;border:none;border-bottom:1px solid var(--hair);background:none;
  font-family:inherit;cursor:pointer;display:flex;justify-content:space-between;
  align-items:center;padding:7px 0;font-size:13px;color:rgba(35,44,84,.3);
  transition:color .15s;text-align:left;-webkit-tap-highlight-color:transparent;
}
.qc-buf-btn:hover,.qc-buf-btn.on{color:var(--stone)}
.qc-buf-btn.on span:last-child{color:var(--navy)}

/* Inclusions */
.qc-incl{display:flex;flex-direction:column;gap:4px}
.qc-incl-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--stone)}
.qc-incl-check{width:14px;height:14px;border-radius:50%;background:rgba(58,107,78,.12);border:1px solid rgba(58,107,78,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;color:var(--green)}

/* Valid notice */
.qc-valid{font-size:11px;color:var(--stone);text-align:center;padding:12px 22px;border-top:1px solid var(--hair);background:var(--field);opacity:.7;letter-spacing:.02em}

/* Action buttons */
.qc-actions{padding:16px 22px;border-top:1px solid var(--hair);display:flex;flex-direction:column;gap:8px}
.qc-btn-save{
  width:100%;background:var(--navy);color:var(--on);border:none;
  border-radius:var(--r-sm);padding:13px 20px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;letter-spacing:-.01em;transition:background .15s;
  -webkit-tap-highlight-color:transparent;
}
.qc-btn-save:hover{background:var(--navy-deep)}
.qc-btn-dl{
  width:100%;background:transparent;border:1.5px solid var(--hair-md);
  border-radius:var(--r-sm);color:var(--navy);padding:10px;font-size:13px;font-weight:500;
  cursor:pointer;transition:border-color .15s;font-family:inherit;
}
.qc-btn-dl:hover{border-color:rgba(35,44,84,.3)}
.qc-btn-back{background:none;border:none;color:var(--stone);font-size:12.5px;cursor:pointer;padding:4px;font-family:inherit;transition:color .15s;width:100%;text-align:center}
.qc-btn-back:hover{color:var(--navy)}

/* Save form */
.qc-sf-wrap{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.qc-sf-row{display:flex;flex-direction:column;gap:5px}
.qc-sf-row label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);font-weight:700}
.qc-sf-row input{
  background:var(--field);border:1.5px solid var(--hair);border-radius:var(--r-sm);
  padding:10px 13px;font-size:13.5px;color:var(--navy);font-family:inherit;
  outline:none;-webkit-appearance:none;transition:border-color .15s;
}
.qc-sf-row input::placeholder{color:rgba(35,44,84,.25)}
.qc-sf-row input:focus{border-color:rgba(35,44,84,.4)}
.qc-sf-submit{
  width:100%;background:var(--navy);color:var(--on);border:none;
  border-radius:var(--r-sm);padding:13px 20px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:background .15s;
}
.qc-sf-submit:hover{background:var(--navy-deep)}
.qc-sf-submit:disabled{opacity:.35;cursor:not-allowed}

/* Success */
.qc-ok{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 24px}
.qc-ok-tick{width:44px;height:44px;background:rgba(58,107,78,.1);border:1px solid rgba(58,107,78,.2);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--green);font-size:18px}
.qc-ok-title{font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-.02em;margin-bottom:6px}
.qc-ok-sub{font-size:13.5px;color:var(--stone);line-height:1.6;margin-bottom:22px}
.qc-ok-jobs{display:block;width:100%;background:var(--navy);color:var(--on);border:none;border-radius:var(--r-sm);padding:13px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;text-decoration:none;text-align:center;margin-bottom:4px;box-sizing:border-box;transition:background .15s}
.qc-ok-jobs:hover{background:var(--navy-deep)}

/* Mobile sticky bar */
.qc-mob-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--navy);color:var(--on);padding:13px 20px;border-top:1px solid rgba(243,239,228,.1);align-items:center;justify-content:space-between}
.qc-mob-price{font-size:17px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qc-mob-sub{font-size:11px;color:var(--on-sub);margin-top:2px}
.qc-mob-see{background:rgba(243,239,228,.1);border:1px solid rgba(243,239,228,.18);color:var(--on);font-family:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}

/* Print */
.qc-print{display:none}
@media print{body>*{display:none!important}#qc-print{display:block!important;position:fixed;inset:0;padding:18mm 20mm;background:#fff;color:#232c54;font-family:system-ui,sans-serif;font-size:13px;line-height:1.6}}

/* Mobile */
@media(max-width:900px){
  .qc-grid{grid-template-columns:1fr}
  #qc-preview{position:static;max-height:none}
  .qc-two{grid-template-columns:1fr;gap:14px}
  .qc-sched-grid{grid-template-columns:1fr;gap:14px}
  .qc-mob-bar{display:flex}
  .main{padding-bottom:80px}
}
@media(max-width:600px){
  .qc-choices{flex-direction:column}
  .qc-q-range{font-size:32px}
}
</style>
</head>

<script>
(function(){
'use strict';
window.MQ.requireAuth(function(){

if(localStorage.getItem('mq_v')!=='3'){
  Object.keys(localStorage).filter(function(k){return k.indexOf('mq_')===0;}).forEach(function(k){localStorage.removeItem(k);});
  localStorage.setItem('mq_v','3');
}

// ─── Config ──────────────────────────────────────────────────────

var QC={
  rate:65,
  afterHoursPct:0.20,
  floorMins:12,
  sqmHr:{maintenance:200,deep:85},
  spaceMult:{office:1.0,retail:1.0,medical:1.5,industrial:1.0},
  bathMins:22,
  kitchenMins:25,
  extras:{floor_polish:0.55,carpet:0.25,windows:0.12,rubbish:25},
  suppliesCost:20,
  consumablesBase:12,
  consumablesPerBath:7,
  bufferPct:0.15,
  minHrsMaint:2,
  minHrsDeepRecurring:3,
  minHrsDeep:5
};

var SPACE_LABELS=['Office / Corporate','Retail / Showroom','Medical / Allied Health','Industrial / Warehouse'];
var SPACE_KEYS=['office','retail','medical','industrial'];
var SPACE_HINTS=['Workstations, meeting rooms, amenities','Shopfront, fitting rooms, stockroom','Enhanced protocols, treatment areas','Warehouse floor, amenities, offices'];

var FREQ_LABELS=['One-off','Monthly','Fortnightly','Weekly'];
var FREQ_KEYS=['once','monthly','fortnightly','weekly'];

var EXTRA_LABELS=['Hard floor polish','Carpet vacuum & spot clean','Internal window cleaning','Rubbish removal & bins'];
var EXTRA_KEYS=['floor_polish','carpet','windows','rubbish'];

// ─── State ───────────────────────────────────────────────────────

var s={
  space:null,sqm:100,baths:2,kitchen:null,freq:null,type:null,
  extras:{},buffer:false,floors:1,afterHours:false,consumables:false,
  hasResult:false,saving:false,saved:false,savedClientName:''
};

function resetState(){
  s={space:null,sqm:100,baths:2,kitchen:null,freq:null,type:null,extras:{},buffer:false,floors:1,afterHours:false,consumables:false,hasResult:false,saving:false,saved:false,savedClientName:''};
}

// ─── Calculation (unchanged) ─────────────────────────────────────

function calc(){
  var sqm=Math.max(50,Math.min(5000,Math.floor(s.sqm||50)));
  var hrs=(sqm/QC.sqmHr[s.type])*QC.spaceMult[s.space];
  var bHrs=(s.baths*QC.bathMins)/60;
  var kHrs=s.kitchen?QC.kitchenMins/60:0;
  var floorHrs=s.floors>1?(s.floors-1)*QC.floorMins/60:0;
  var total=Math.ceil((hrs+bHrs+kHrs+floorHrs)*2)/2;
  if(s.type==='maintenance')total=Math.max(total,QC.minHrsMaint);
  else if(s.freq==='once')total=Math.max(total,QC.minHrsDeep);
  else total=Math.max(total,QC.minHrsDeepRecurring);
  var baseLabour=total*QC.rate;
  var afterHoursAmt=s.afterHours?baseLabour*QC.afterHoursPct:0;
  var labour=baseLabour+afterHoursAmt;
  var sup=QC.suppliesCost;
  var ext=0;
  if(s.extras.floor_polish)ext+=sqm*QC.extras.floor_polish;
  if(s.extras.carpet)ext+=sqm*QC.extras.carpet;
  if(s.extras.windows)ext+=sqm*QC.extras.windows;
  if(s.extras.rubbish)ext+=QC.extras.rubbish;
  var consumablesAmt=s.consumables?QC.consumablesBase+(s.baths*QC.consumablesPerBath):0;
  var per=labour+sup+ext+consumablesAmt;
  var bufferAmt=s.buffer?per*QC.bufferPct:0;
  per+=bufferAmt;
  var mthMult={once:null,monthly:1,fortnightly:2.17,weekly:4.33};
  return{
    per:per,lo:r5(per*.9),hi:r5(per*1.1),
    monthly:mthMult[s.freq]?per*mthMult[s.freq]:null,
    hrs:total,baseLabour:baseLabour,afterHoursAmt:afterHoursAmt,
    labour:labour,sup:sup,ext:ext,consumablesAmt:consumablesAmt,bufferAmt:bufferAmt
  };
}
function r5(n){return Math.round(n/5)*5;}
function au(n){return '$'+Math.round(n).toLocaleString('en-AU');}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function row(l,v,cls){return '<div class="qc-row'+(cls?' '+cls:'')+'"><span>'+l+'</span><span>'+v+'</span></div>';}
function chk(txt){return '<div class="qc-incl-row"><div class="qc-incl-check">&#10003;</div><span>'+txt+'</span></div>';}

function renderPreview(r){
  if(s.saved)return renderSaved();
  if(s.saving)return renderSaveForm(r);

  var tLab=s.type==='deep'?'Deep clean':'Maintenance';
  var ANN={monthly:12,fortnightly:26,weekly:52};
  var annVal=ANN[s.freq]?r.per*ANN[s.freq]:null;
  var weeklyEq=null;
  if(s.freq==='fortnightly')weeklyEq=r.per/2;
  else if(s.freq==='monthly')weeklyEq=r.per*12/52;

  updatePrint(r,sLab,fLab,tLab);

  var h='';

  // Navy band: price display
  h+='<div class="qc-q-band">'+
    '<div class="qc-q-tags">'+

    '<div class="qc-q-meta">'+

      (r.monthly?'<span class="qc-q-mth">&#8776; '+au(r.monthly)+' / month</span>':'')+
    '</div>'+
    (weeklyEq?'<div class="qc-q-wk">&#8776; '+au(weeklyEq)+' per week equivalent</div>':'')+

  // Body: breakdown + inclusions
  h+='<div class="qc-q-body">';
  h+='<div class="qc-q-sec">Cost breakdown</div>';
  h+=row('Labour ('+r.hrs.toFixed(1)+' hrs)',au(r.baseLabour));
  if(r.afterHoursAmt>0)h+=row('After-hours premium (+'+Math.round(QC.afterHoursPct*100)+'%)',au(r.afterHoursAmt));
  h+=row('Cleaning chemicals &amp; equipment',au(r.sup));
  if(r.consumablesAmt>0)h+=row('Consumables provision',au(r.consumablesAmt));
  if(r.ext>0)h+=row('Add-on services',au(r.ext));
  h+='<button type="button" class="qc-buf-btn'+(s.buffer?' on':'')+'" id="qc-buf">'+
    '<span>Site allowance <span style="font-size:11px;opacity:.55">(+'+Math.round(QC.bufferPct*100)+'% buffer)</span></span>'+
    '<span>'+(s.buffer?'+'+au(r.bufferAmt):'+ Add')+'</span>'+
  '</button>';

  h+='<div class="qc-q-sec">What\'s included</div>';
  h+='<div class="qc-incl">'+

    chk('Background-checked, trained staff')+

  h+='<div class="qc-actions">'+
    '<button type="button" class="qc-btn-save" id="qc-save">Save quote &amp; create job &#8594;</button>'+
    '<button type="button" class="qc-btn-dl" id="qc-dl">&#8595; Download estimate (PDF)</button>'+

// ─── Mobile bar ───────────────────────────────────────────────────

function updateMobBar(r){
  var bar=document.getElementById('qc-mob-bar');
  if(!bar)return;
  if(!r){bar.style.display='none';return;}
  bar.style.display='flex';
  var price=document.getElementById('qc-mob-price');
  if(price)price.textContent=au(r.lo)+' – '+au(r.hi);
}

// ─── Live calc ────────────────────────────────────────────────────

function calcLive(){
  var preview=document.getElementById('qc-preview');
  if(!preview)return;
  var ready=s.space&&s.sqm>=50&&s.kitchen!==null&&s.freq&&s.type;
  if(!ready){
    s.hasResult=false;
    if(!s.saving&&!s.saved)preview.innerHTML=renderPreviewEmpty();
    updateMobBar(null);
    return;
  }
  var r=calc();
  s.hasResult=true;
  preview.innerHTML=renderPreview(r);
  bindPreview(r);
  updateMobBar(s.saved?null:r);
}

function bindPreview(r){
  var buf=document.getElementById('qc-buf');
  if(buf)buf.addEventListener('click',function(){s.buffer=!s.buffer;calcLive();});
  var dl=document.getElementById('qc-dl');
  if(dl)dl.addEventListener('click',function(){var el=document.getElementById('qc-print');if(el&&el.innerHTML)window.print();});
  var sv=document.getElementById('qc-save');
  if(sv)sv.addEventListener('click',function(){s.saving=true;calcLive();});
  var sub=document.getElementById('qs-submit');
  if(sub)sub.addEventListener('click',saveQuote);
  var bk=document.getElementById('qc-back-res');
  if(bk)bk.addEventListener('click',function(){s.saving=false;calcLive();});
  var rs=document.getElementById('qc-restart');
  if(rs)rs.addEventListener('click',function(){resetState();initForm();calcLive();});
}

// ─── Form init & bind ─────────────────────────────────────────────

function initForm(){
  var fc=document.getElementById('qc-form');
  if(fc)fc.innerHTML=renderFormCol();
  bindForm();
}

function bindForm(){
  document.querySelectorAll('#qc-form .qc-choice[data-grp]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var key=this.dataset.key,grp=this.dataset.grp;
      if(grp==='space')s.space=key;
      else if(grp==='kit')s.kitchen=(key==='yes');
      else if(grp==='freq')s.freq=key;
      else if(grp==='type')s.type=key;
      else if(grp==='ah')s.afterHours=(key==='after');
      else if(grp==='ext'){
        s.extras[key]=!s.extras[key];
        var fc=document.getElementById('qc-form');
        if(fc)fc.innerHTML=renderFormCol();
        bindForm();
        calcLive();return;
      }
      else if(grp==='cons'){
        s.consumables=!s.consumables;
        var fc=document.getElementById('qc-form');
        if(fc)fc.innerHTML=renderFormCol();
        bindForm();
        calcLive();return;
      }
      document.querySelectorAll('#qc-form .qc-choice[data-grp="'+grp+'"]').forEach(function(b){
        b.classList.toggle('on',b.dataset.key===key);
      });
      if(grp==='freq'||grp==='type'||grp==='ah'){
        var fc=document.getElementById('qc-form');
        if(fc)fc.innerHTML=renderFormCol();
        bindForm();
      }
      calcLive();
    });
  });

  // SQM quick picks
  document.querySelectorAll('#qc-form .qc-sqm-pick').forEach(function(btn){
    btn.addEventListener('click',function(){
      s.sqm=parseInt(this.dataset.sqm,10);
      var v=document.getElementById('qc-sqm-v');if(v)v.value=s.sqm;
      syncSqmPicks();calcLive();
    });
  });

  // SQM ± buttons
  var sqmM=document.getElementById('qc-sqm-m');
  var sqmP=document.getElementById('qc-sqm-p');
  var sqmV=document.getElementById('qc-sqm-v');
  var step=50;
  if(sqmM)sqmM.addEventListener('click',function(){
    var v=Math.max(50,(s.sqm||100)-step);s.sqm=v;
    if(sqmV)sqmV.value=v;syncSqmPicks();calcLive();
  });
  if(sqmP)sqmP.addEventListener('click',function(){
    var v=Math.min(5000,(s.sqm||100)+step);s.sqm=v;
    if(sqmV)sqmV.value=v;syncSqmPicks();calcLive();
  });
  if(sqmV)sqmV.addEventListener('input',function(){
    var v=parseInt(this.value,10);
    s.sqm=(isNaN(v)||v<1)?0:Math.min(5000,v);
    var hint=document.getElementById('qc-sqm-hint');
    if(hint)hint.classList.toggle('vis',s.sqm>=10&&s.sqm<50);
    syncSqmPicks();calcLive();
  });

  // Bath stepper
  var bm=document.getElementById('qc-minus');
  var bp=document.getElementById('qc-plus');
  if(bm)bm.addEventListener('click',function(){
    if(s.baths>0){
      s.baths--;
      var n=document.getElementById('qc-bnum');if(n)n.textContent=s.baths;
      var sub=document.getElementById('qc-bsub');if(sub)sub.textContent=s.baths===1?'bathroom':'bathrooms';
      calcLive();
    }
  });
  if(bp)bp.addEventListener('click',function(){
    if(s.baths<8){
      s.baths++;
      var n=document.getElementById('qc-bnum');if(n)n.textContent=s.baths;
      var sub=document.getElementById('qc-bsub');if(sub)sub.textContent=s.baths===1?'bathroom':'bathrooms';
      calcLive();
    }
  });

  // Floors stepper
  var flm=document.getElementById('qc-fl-minus');
  var flp=document.getElementById('qc-fl-plus');
  if(flm)flm.addEventListener('click',function(){
    if(s.floors>1){
      s.floors--;
      var n=document.getElementById('qc-flnum');if(n)n.textContent=s.floors;
      var sub=document.getElementById('qc-flsub');if(sub)sub.textContent=s.floors===1?'level':'levels';
      calcLive();
    }
  });
  if(flp)flp.addEventListener('click',function(){
    if(s.floors<20){
      s.floors++;
      var n=document.getElementById('qc-flnum');if(n)n.textContent=s.floors;
      var sub=document.getElementById('qc-flsub');if(sub)sub.textContent=s.floors===1?'level':'levels';
      calcLive();
    }
  });
}

function syncSqmPicks(){
  document.querySelectorAll('#qc-form .qc-sqm-pick').forEach(function(b){
    b.classList.toggle('on',parseInt(b.dataset.sqm,10)===s.sqm);
  });
}

  var phone=((document.getElementById('qs-phone')||{}).value||'').trim();
  var site=((document.getElementById('qs-site')||{}).value||'').trim();
  if(!biz){var f=document.getElementById('qs-biz');if(f)f.focus();return;}
  var btn=document.getElementById('qs-submit');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  var sb=MQ.sb;
  var FREQ_TO_REPEAT={monthly:'monthly',fortnightly:'fortnightly',weekly:'weekly'};
  var SPACE_TO_INDUSTRY={office:'Commercial office',retail:'Retail',medical:'Medical',industrial:'Industrial'};
  sb.from('clients').insert([{
    name:biz,contact:contact||null,email:email||null,phone:phone||null,
    site_address:site||null,industry:SPACE_TO_INDUSTRY[s.space]||null,status:'active'
  }]).select('id,name').single()
    .then(function(res){
      if(res.error)throw res.error;
      var cid=res.data.id,cname=res.data.name;
      var today=new Date().toISOString().slice(0,10);
      var jrow={client_id:cid,client_name:cname,date:today,type:s.type==='deep'?'deep':'maintenance',status:'upcoming'};
      if(site)jrow.site=site;
      if(FREQ_TO_REPEAT[s.freq])jrow.repeat=FREQ_TO_REPEAT[s.freq];
      return sb.from('jobs').insert([jrow]).select('id').single().then(function(jr){
        if(jr.error)throw jr.error;
        s.savedClientName=cname;
        s.saving=false;s.saved=true;
        var preview=document.getElementById('qc-preview');
        if(preview){preview.innerHTML=renderSaved();bindPreview(null);}
        updateMobBar(null);
      });
    })
    .catch(function(err){
      if(btn){btn.disabled=false;btn.textContent='Save & create job';}
      alert('Could not save: '+(err.message||String(err)));
    });
}

      prow('Cleaning chemicals & equipment',au(r.sup))+

      (r.ext>0?prow('Add-on services',au(r.ext)):'')+
      (r.bufferAmt>0?prow('Site allowance (+'+Math.round(QC.bufferPct*100)+'%)','+'+au(r.bufferAmt)):'')+
      '<tr><td style="padding:8px 0;font-weight:700;font-size:14px;color:#000;border-top:2px solid #000">Per clean</td>'+
      '<td style="padding:8px 0;font-weight:700;font-size:14px;color:#000;text-align:right;border-top:2px solid #000">'+au(r.per)+'</td></tr>'+
    '</table>'+
    '<div style="background:#f5f5f5;border-radius:8px;padding:18px 22px;margin-bottom:16px">'+
      '<div style="font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#666;margin-bottom:4px">Price estimate</div>'+
      '<div style="font-size:28px;font-weight:700;letter-spacing:-.02em;color:#000">'+au(r.lo)+' – '+au(r.hi)+'</div>'+
      (r.monthly?'<div style="font-size:12px;color:#555;margin-top:4px">≈ '+au(r.monthly)+' per month</div>':'')+
    '</div>'+

    '<div style="font-size:12px;color:#000;border-top:1px solid #ddd;padding-top:12px">hello@myquest.au  ·  0413 154 932  ·  myquest.au</div>';
}
