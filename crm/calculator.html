<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Quote Calculator — MyQuest CRM</title>
<link rel="stylesheet" href="style.css?v=20260909">
<style>
/* ── Outer layout ── */
.qc-outer{display:flex;flex-direction:column;gap:16px;margin-top:16px}

/* ── Stats strip: 3 cols ── */
#qc-stats{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){#qc-stats{grid-template-columns:1fr}}

/* ── Step cards ── */
.qc-card{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);padding:22px 24px}

/* ── Step header ── */
.qc-step-hd{display:flex;align-items:flex-start;gap:14px;margin-bottom:20px}
.qc-step-num{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--on);background:var(--navy);border-radius:6px;padding:3px 7px;flex-shrink:0;margin-top:3px;font-family:inherit}
.qc-step-title{font-size:15px;font-weight:700;color:var(--navy);letter-spacing:-.01em;line-height:1.2}
.qc-step-sub{font-size:12px;color:var(--stone);margin-top:3px}

/* ── Premises tile grid ── */
.qc-space-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qc-space-tile{
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;
  padding:16px 18px;background:var(--field);
  border:1.5px solid var(--hair-md);border-radius:var(--r-sm);
  color:var(--stone);font-family:inherit;
  cursor:pointer;transition:border-color .13s,color .13s,background .13s;
  text-align:left;-webkit-tap-highlight-color:transparent;touch-action:manipulation;width:100%;
}
.qc-space-tile:hover{border-color:rgba(35,44,84,.3);color:var(--navy)}
.qc-space-tile.on{background:var(--navy);border-color:var(--navy);color:var(--on)}
.qst-ico{width:20px;height:20px;flex-shrink:0;opacity:.5;margin-bottom:6px}
.qc-space-tile.on .qst-ico{opacity:.7}
.qst-label{font-size:13.5px;font-weight:600;color:inherit;line-height:1.2}
.qst-sub{font-size:11px;color:inherit;opacity:.55;line-height:1.35;margin-top:1px}
.qc-space-tile.on .qst-sub{opacity:.65}

/* ── Separator ── */
.qc-sep{border-top:1px solid var(--hair);margin:20px 0 18px}

/* ── Inner label ── */
.qc-inner-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--stone);margin-bottom:10px}

/* ── 2-col grid ── */
.qc-2col{display:grid;grid-template-columns:1fr 1fr;gap:24px}

/* ── Choice buttons ── */
.qc-choices{display:flex;flex-wrap:wrap;gap:8px}
.qc-choices.col{flex-direction:column}
.qc-choices.col .qc-choice{width:100%}
.qc-choice{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;background:var(--field);
  border:1.5px solid var(--hair-md);border-radius:var(--r-sm);
  color:var(--stone);font-size:13.5px;font-family:inherit;
  cursor:pointer;transition:border-color .13s,color .13s,background .13s;
  line-height:1;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.qc-choice:hover{border-color:rgba(35,44,84,.3);color:var(--navy)}
.qc-choice.on{background:var(--navy);border-color:var(--navy);color:var(--on);font-weight:600}

/* ── After-hours info ── */
.qc-ah-info{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px;padding:12px 14px;background:rgba(35,44,84,.04);border-radius:8px}
.qc-ah-info-row{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--stone);line-height:1.5}
.qc-ah-dot{width:4px;height:4px;border-radius:50%;background:var(--stone);opacity:.4;flex-shrink:0;margin-top:6px}

/* ── After-hours stepper ── */
.qc-stepper-row{display:flex;align-items:center;gap:16px}
.qc-ste-btn{
  background:var(--field);border:1.5px solid var(--hair-md);border-radius:var(--r-sm);
  color:var(--stone);font-family:inherit;font-size:18px;width:38px;height:38px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:border-color .13s,color .13s;-webkit-tap-highlight-color:transparent;
}
.qc-ste-btn:hover{border-color:rgba(35,44,84,.3);color:var(--navy)}
.qc-ste-val{font-size:26px;font-weight:700;color:var(--navy);min-width:32px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.qc-ste-sub{font-size:11.5px;color:var(--stone);margin-top:2px}

/* ── Hours input ── */
.qc-hrs-row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.qc-hrs-mid{display:flex;align-items:baseline;gap:8px}
#qc-hrs-v{
  width:80px;font-size:44px;font-weight:700;color:var(--navy);
  background:transparent;border:none;outline:none;text-align:center;
  -moz-appearance:textfield;font-family:inherit;letter-spacing:-.02em;line-height:1;
}
#qc-hrs-v::-webkit-outer-spin-button,#qc-hrs-v::-webkit-inner-spin-button{-webkit-appearance:none}
.qc-hrs-unit{font-size:16px;font-weight:500;color:var(--stone);letter-spacing:.02em}
.qc-hrs-picks{display:flex;flex-wrap:wrap;gap:6px}
.qc-hrs-pick{
  background:none;border:1px solid var(--hair);border-radius:6px;
  font-family:inherit;font-size:12px;color:var(--stone);cursor:pointer;
  padding:5px 11px;transition:border-color .13s,color .13s,background .13s;
}
.qc-hrs-pick:hover{border-color:rgba(35,44,84,.3);color:var(--navy)}
.qc-hrs-pick.on{background:rgba(35,44,84,.07);border-color:rgba(35,44,84,.25);color:var(--navy);font-weight:600}
.qc-hrs-hint{font-size:11.5px;color:var(--stone);margin-top:10px;opacity:.6;line-height:1.5}

/* ── Quote card wrapper ── */
#qc-preview{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);overflow:hidden}

/* ── Progress pills (empty state) ── */
.qc-card-top{padding:22px 24px 0}
.qc-prog-band{background:var(--navy);padding:18px 24px;margin-top:18px}
.qc-prog-title{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--on-sub);margin-bottom:12px}
.qc-pills{display:flex;flex-wrap:wrap;gap:8px}
.qc-pill{font-size:11.5px;font-weight:600;padding:5px 12px;border-radius:20px;letter-spacing:.01em;white-space:nowrap}
.qc-pill.done{background:var(--on);color:var(--navy)}
.qc-pill.todo{background:rgba(243,239,228,.1);color:rgba(243,239,228,.4);border:1px solid rgba(243,239,228,.1)}
.qc-prog-body{padding:20px 24px}
.qc-prog-hint{font-size:13px;color:var(--stone);margin:0}

/* ── Quote band (live state) ── */
.qc-q-band{background:var(--navy);padding:20px 24px 18px;margin-top:18px}
.qc-q-tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}
.qc-q-tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:rgba(243,239,228,.55);background:rgba(243,239,228,.1);border-radius:5px;padding:3px 8px}
.qc-q-price-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--on-sub);margin-bottom:6px}
.qc-q-range{font-size:40px;font-weight:700;color:var(--on);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.qc-q-meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px;flex-wrap:wrap;gap:4px}
.qc-q-lbl{font-size:11px;color:var(--on-sub)}
.qc-q-mth{font-size:11px;color:var(--on-sub)}
.qc-q-wk{font-size:11px;color:var(--on-sub);margin-top:3px}

/* ── Quote body ── */
.qc-q-body{padding:18px 24px}
.qc-q-sec{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin:16px 0 10px}
.qc-q-sec:first-child{margin-top:0}
.qc-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--hair);color:var(--stone);font-size:13px;font-variant-numeric:tabular-nums}
.qc-row:last-child{border-bottom:none}
.qc-row.total{color:var(--navy);font-weight:600;font-size:14px;border-bottom:none;border-top:1px solid var(--hair-md);padding-top:10px;margin-top:4px}
.qc-row.ann{color:var(--navy);font-weight:700;font-size:13px;border-bottom:none;padding-top:6px}

/* ── Site allowance checkbox toggle ── */
.qc-allow{
  display:flex;align-items:flex-start;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--hair);
  cursor:pointer;-webkit-tap-highlight-color:transparent;
  width:100%;background:none;border-top:none;border-left:none;border-right:none;
  font-family:inherit;text-align:left;
}
.qc-allow-box{
  width:16px;height:16px;border-radius:4px;
  border:1.5px solid var(--hair-md);flex-shrink:0;margin-top:3px;
  display:flex;align-items:center;justify-content:center;
  transition:background .13s,border-color .13s;
}
.qc-allow.on .qc-allow-box{background:var(--navy);border-color:var(--navy)}
.qc-allow-tick{display:none;color:var(--on);font-size:9px;line-height:1;font-weight:900}
.qc-allow.on .qc-allow-tick{display:block}
.qc-allow-text{flex:1}
.qc-allow-label{font-size:13px;color:var(--stone);display:block;line-height:1.2}
.qc-allow.on .qc-allow-label{color:var(--navy)}
.qc-allow-sub{font-size:11px;color:var(--stone);opacity:.6;margin-top:3px;display:block}
.qc-allow-amt{font-size:13px;font-weight:600;color:var(--stone);flex-shrink:0;font-variant-numeric:tabular-nums;align-self:center}
.qc-allow.on .qc-allow-amt{color:var(--navy)}

/* ── Internal margin section ── */
.qc-int{background:var(--field);border-radius:10px;padding:14px 16px;margin:16px 0 2px}
.qc-int-hd{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);opacity:.6;margin-bottom:10px}
.qc-int-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px;font-variant-numeric:tabular-nums}
.qc-int-row+.qc-int-row{border-top:1px solid var(--hair);margin-top:4px;padding-top:8px}
.qc-int-lbl{color:var(--stone)}
.qc-int-val{font-weight:600;color:var(--navy)}
.qc-int-val.green{color:var(--green)}

/* ── Inclusions ── */
.qc-incl{display:flex;flex-direction:column;gap:5px}
.qc-incl-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--stone)}
.qc-incl-check{width:14px;height:14px;border-radius:50%;background:rgba(58,107,78,.12);border:1px solid rgba(58,107,78,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:8px;color:var(--green)}

/* ── Footer / actions ── */
.qc-valid{font-size:11px;color:var(--stone);text-align:center;padding:12px 22px;border-top:1px solid var(--hair);background:var(--field);opacity:.7;letter-spacing:.02em}
.qc-actions{padding:16px 24px;border-top:1px solid var(--hair)}
.qc-btn-dl{
  width:100%;background:var(--navy);color:var(--on);border:none;
  border-radius:var(--r-sm);padding:13px 20px;font-size:14px;font-weight:600;
  cursor:pointer;font-family:inherit;letter-spacing:-.01em;transition:background .15s;
  -webkit-tap-highlight-color:transparent;
}
.qc-btn-dl:hover{background:var(--navy-deep)}

/* ── Print ── */
.qc-print{display:none}
@media print{body>*{display:none!important}#qc-print{display:block!important;position:fixed;inset:0;padding:18mm 20mm;background:#fff;color:#232c54;font-family:system-ui,sans-serif;font-size:13px;line-height:1.6}}

/* ── Responsive ── */
@media(max-width:900px){.qc-2col{grid-template-columns:1fr}}
@media(max-width:600px){
  .qc-q-range{font-size:32px}
  .qc-card{padding:18px 18px}
  .qc-q-body{padding:16px 18px}
  .qc-card-top{padding:18px 18px 0}
  .qc-actions{padding:14px 18px}
  .qc-prog-body{padding:16px 18px}
  .qc-q-band,.qc-prog-band{padding:16px 18px}
}
</style>
</head>

<script>
(function(){
'use strict';
window.MQ.requireAuth(function(){

if(localStorage.getItem('mq_v')!=='3'){
  Object.keys(localStorage).filter(function(k){return k.indexOf('mq_')===0;}).forEach(function(k){localStorage.removeItem(k);});
  localStorage.setItem('mq_v','3');
}

// ─── Config ──────────────────────────────────────────────────────

var QC={
  rate:70,
  suppliesCost:20,
  bufferPct:0.15,
  staffPct:0.35
};

var SPACE_LABELS=['Office / Corporate','Retail / Showroom','Medical / Allied Health','Industrial / Warehouse'];
var SPACE_KEYS=['office','retail','medical','industrial'];
var SPACE_HINTS=['Workstations, meeting rooms, amenities','Shopfront, fitting rooms, stockroom','Enhanced protocols, treatment areas','Warehouse floor, amenities, offices'];

var FREQ_LABELS=['One-off','Monthly','Fortnightly','Weekly'];
var FREQ_KEYS=['once','monthly','fortnightly','weekly'];

var HRS_PRESETS=[1,1.5,2,2.5,3,3.5,4,5,6];

// ─── State ───────────────────────────────────────────────────────

var s={
  space:null,freq:null,type:null,
  hrs:null,afterHoursPct:0,buffer:false,
  hasResult:false
};

function resetState(){
  s={space:null,freq:null,type:null,hrs:null,afterHoursPct:0,buffer:false,hasResult:false};
}

// ─── Calculation ─────────────────────────────────────────────────

function calc(){
  var baseLabour=s.hrs*QC.rate;
  var afterHoursAmt=s.afterHoursPct>0?baseLabour*(s.afterHoursPct/100):0;
  var labour=baseLabour+afterHoursAmt;
  var sup=QC.suppliesCost;
  var per=labour+sup;
  var bufferAmt=s.buffer?per*QC.bufferPct:0;
  per+=bufferAmt;
  var mthMult={once:null,monthly:1,fortnightly:2.17,weekly:4.33};
  return{
    per:per,lo:r5(per*.9),hi:r5(per*1.1),
    monthly:mthMult[s.freq]?per*mthMult[s.freq]:null,
    hrs:s.hrs,baseLabour:baseLabour,afterHoursAmt:afterHoursAmt,afterHoursPct:s.afterHoursPct,
    labour:labour,sup:sup,bufferAmt:bufferAmt
  };
}
function r5(n){return Math.round(n/5)*5;}
function au(n){return '$'+Math.round(n).toLocaleString('en-AU');}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function row(l,v,cls){return '<div class="qc-row'+(cls?' '+cls:'')+'"><span>'+l+'</span><span>'+v+'</span></div>';}
function chk(txt){return '<div class="qc-incl-row"><div class="qc-incl-check">&#10003;</div><span>'+txt+'</span></div>';}

// ─── Stats strip ─────────────────────────────────────────────────

function initStats(){
  var el=document.getElementById('qc-stats');
  if(!el)return;
  el.innerHTML=
    '<div class="stat"><div class="stat-lbl">Labour rate</div><div class="stat-val">$'+QC.rate+'<span style="font-size:13px;opacity:.55;font-weight:500"> /hr</span></div></div>'+
    '<div class="stat"><div class="stat-lbl">Supplies included</div><div class="stat-val">$'+QC.suppliesCost+'</div><div class="stat-hint">Per clean, all products</div></div>'+
    '<div class="stat"><div class="stat-lbl">Staff split</div><div class="stat-val">'+Math.round(QC.staffPct*100)+'%</div><div class="stat-hint">Of job price to staff</div></div>';
}

// ─── Icons ───────────────────────────────────────────────────────

var SPACE_ICONS={
  office:'<svg class="qst-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>',
  retail:'<svg class="qst-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>',

// ─── Preview: empty state ─────────────────────────────────────────

function renderPreviewEmpty(){
  var done={freq:!!s.freq,type:!!s.type,hrs:s.hrs>0};
  function pill(label,ok){
    return '<span class="qc-pill '+(ok?'done':'todo')+'">'+(ok?'&#10003; ':'')+label+'</span>';
  }
  return '<div class="qc-card-top">'+
    '<div class="qc-step-hd" style="margin-bottom:0">'+
      '<span class="qc-step-num">04</span>'+
      '<div><div class="qc-step-title">Your quote</div><div class="qc-step-sub">Appears once you\'ve filled in the cards above</div></div>'+
    '</div>'+
  '</div>'+
  '<div class="qc-prog-band">'+
    '<div class="qc-prog-title">Still needed</div>'+
    '<div class="qc-pills">'+
      pill('Frequency',done.freq)+
      pill('Clean type',done.type)+
      pill('Hours estimate',done.hrs)+
    '</div>'+
  '</div>'+
  '<div class="qc-prog-body">'+
    '<p class="qc-prog-hint">Answer the questions above and your price estimate will appear here.</p>'+

// ─── Preview: live quote ──────────────────────────────────────────

function renderPreview(r){
  var sLab=s.space?({office:'Office',retail:'Retail',medical:'Medical',industrial:'Industrial'}[s.space]||''):'';
  var fLab=FREQ_LABELS[FREQ_KEYS.indexOf(s.freq)]||'';
  var tLab=s.type==='deep'?'Deep clean':'Maintenance';
  var ANN={monthly:12,fortnightly:26,weekly:52};
  var annVal=ANN[s.freq]?r.per*ANN[s.freq]:null;
  var weeklyEq=null;
  if(s.freq==='fortnightly')weeklyEq=r.per/2;
  else if(s.freq==='monthly')weeklyEq=r.per*12/52;

  updatePrint(r,sLab,fLab,tLab);

  var allowDisplayAmt=s.buffer?au(r.bufferAmt):au(r5(r.per*QC.bufferPct));

  var h='';

  h+='<div class="qc-card-top">'+
    '<div class="qc-step-hd" style="margin-bottom:0">'+
      '<span class="qc-step-num">04</span>'+
      '<div><div class="qc-step-title">Your quote</div><div class="qc-step-sub">Based on '+r.hrs+' hrs at $'+QC.rate+'/hr</div></div>'+
    '</div>'+
  '</div>';

  h+='<div class="qc-q-band">'+
    '<div class="qc-q-tags">'+
      (sLab?'<span class="qc-q-tag">'+esc(sLab)+'</span>':'')+
      '<span class="qc-q-tag">'+r.hrs+' hrs</span>'+
      '<span class="qc-q-tag">'+esc(fLab)+'</span>'+
      '<span class="qc-q-tag">'+tLab+'</span>'+
    '</div>'+
    '<div class="qc-q-price-lbl">Price per clean</div>'+
    '<div class="qc-q-range">'+au(r.per)+'</div>'+
    '<div class="qc-q-meta">'+
      '<span class="qc-q-lbl">GST not included</span>'+
      (r.monthly?'<span class="qc-q-mth">&#8776; '+au(r.monthly)+' / mo</span>':'')+
    '</div>'+
    (weeklyEq?'<div class="qc-q-wk">&#8776; '+au(weeklyEq)+' per week</div>':'')+
  '</div>';

  h+='<div class="qc-q-body">';
  h+='<div class="qc-q-sec">Cost breakdown</div>';
  h+=row(r.hrs+' hrs &times; $'+QC.rate+'/hr',au(r.baseLabour));
  if(r.afterHoursAmt>0)h+=row('After-hours loading (+'+r.afterHoursPct+'%)','+'+au(r.afterHoursAmt));
  h+=row('Cleaning supplies &amp; equipment',au(r.sup));

  h+='<button type="button" class="qc-allow'+(s.buffer?' on':'')+'" id="qc-allow">'+
    '<div class="qc-allow-box"><span class="qc-allow-tick">&#10003;</span></div>'+
    '<div class="qc-allow-text">'+
      '<span class="qc-allow-label">Add site allowance (+'+Math.round(QC.bufferPct*100)+'%)</span>'+
      '<span class="qc-allow-sub">For travel time or site complexity</span>'+
    '</div>'+
    '<span class="qc-allow-amt">+'+allowDisplayAmt+'</span>'+
  '</button>';

  h+=row('Per clean total',au(r.per),'total');
  if(annVal)h+=row('Annual contract value','&#8776; '+au(annVal),'ann');

  var staffCost=Math.round(r.per*QC.staffPct);
  var margin=Math.round(r.per*(1-QC.staffPct));
  h+='<div class="qc-int">'+
    '<div class="qc-int-hd">Internal &mdash; not on client quote</div>'+
    '<div class="qc-int-row">'+
      '<span class="qc-int-lbl">Staff cost ('+Math.round(QC.staffPct*100)+'%)</span>'+
      '<span class="qc-int-val">&#126;'+au(staffCost)+'</span>'+
    '</div>'+
    '<div class="qc-int-row">'+
      '<span class="qc-int-lbl">Your margin ('+(100-Math.round(QC.staffPct*100))+'%)</span>'+
      '<span class="qc-int-val green">&#126;'+au(margin)+'</span>'+
    '</div>'+
  '</div>';

  h+='<div class="qc-q-sec" style="margin-top:18px">What\'s included</div>';
  h+='<div class="qc-incl">'+
    chk('Cleaning supplies &amp; equipment')+
    chk('Public liability insurance')+
    chk('Background-checked, trained staff')+
    chk('Post-clean quality checklist')+
  '</div>';
  h+='</div>';

  h+='<div class="qc-valid">Estimate valid 30 days &middot; GST not included</div>';
  h+='<div class="qc-actions">'+
    '<button type="button" class="qc-btn-dl" id="qc-dl">&#8595; Download estimate (PDF)</button>'+
  '</div>';

  return h;
}

// ─── Live calc ────────────────────────────────────────────────────

function calcLive(){
  var preview=document.getElementById('qc-preview');
  if(!preview)return;
  var ready=s.freq&&s.type&&s.hrs>0;
  if(!ready){
    s.hasResult=false;
    preview.innerHTML=renderPreviewEmpty();
    return;
  }
  var r=calc();
  s.hasResult=true;
  preview.innerHTML=renderPreview(r);
  bindPreview();
}

function bindPreview(){
  var allow=document.getElementById('qc-allow');
  if(allow)allow.addEventListener('click',function(){s.buffer=!s.buffer;calcLive();});
  var dl=document.getElementById('qc-dl');
  if(dl)dl.addEventListener('click',function(){var el=document.getElementById('qc-print');if(el&&el.innerHTML)window.print();});
}

// ─── Form init & bind ─────────────────────────────────────────────

function initForm(){
  var fc=document.getElementById('qc-form');
  if(fc)fc.innerHTML=renderFormCol();
  bindForm();
}

function bindForm(){
  // Space tiles
  document.querySelectorAll('#qc-form .qc-space-tile').forEach(function(btn){
    btn.addEventListener('click',function(){
      s.space=this.dataset.key;
      document.querySelectorAll('#qc-form .qc-space-tile').forEach(function(b){
        b.classList.toggle('on',b.dataset.key===s.space);
      });
      calcLive();
    });
  });

  // Choice buttons (freq + type)
  document.querySelectorAll('#qc-form .qc-choice[data-grp]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var key=this.dataset.key,grp=this.dataset.grp;
      if(grp==='freq')s.freq=key;
      else if(grp==='type')s.type=key;
      document.querySelectorAll('#qc-form .qc-choice[data-grp="'+grp+'"]').forEach(function(b){
        b.classList.toggle('on',b.dataset.key===key);
      });
      if(grp==='type'){
        var fc=document.getElementById('qc-form');
        if(fc)fc.innerHTML=renderFormCol();
        bindForm();
        return;
      }
      calcLive();
    });
  });

  // Hours presets
  document.querySelectorAll('#qc-form .qc-hrs-pick').forEach(function(btn){
    btn.addEventListener('click',function(){
      s.hrs=parseFloat(this.dataset.hrs);
      var v=document.getElementById('qc-hrs-v');if(v)v.value=s.hrs;
      syncHrsPicks();calcLive();
    });
  });

  // Hours ± buttons
  var hrsM=document.getElementById('qc-hrs-m');
  var hrsP=document.getElementById('qc-hrs-p');
  var hrsV=document.getElementById('qc-hrs-v');
  if(hrsM)hrsM.addEventListener('click',function(){
    var v=Math.max(0.5,Math.round(((s.hrs||1)-0.5)*2)/2);
    s.hrs=v;if(hrsV)hrsV.value=v;syncHrsPicks();calcLive();
  });
  if(hrsP)hrsP.addEventListener('click',function(){
    var v=Math.min(20,Math.round(((s.hrs||0)+0.5)*2)/2);
    s.hrs=v;if(hrsV)hrsV.value=v;syncHrsPicks();calcLive();
  });
  if(hrsV)hrsV.addEventListener('input',function(){
    var v=parseFloat(this.value);
    s.hrs=(isNaN(v)||v<=0)?null:Math.min(20,Math.round(v*2)/2);
    syncHrsPicks();calcLive();
  });

  // After-hours stepper
  var ahm=document.getElementById('qc-ah-minus');
  var ahp=document.getElementById('qc-ah-plus');
  if(ahm)ahm.addEventListener('click',function(){
    if(s.afterHoursPct>0){
      s.afterHoursPct=Math.max(0,s.afterHoursPct-5);
      var n=document.getElementById('qc-ahnum');if(n)n.textContent=s.afterHoursPct+'%';
      var sub=document.getElementById('qc-ahsub');if(sub)sub.textContent=s.afterHoursPct>0?'+'+s.afterHoursPct+'% on labour':'No premium';
      calcLive();
    }
  });
  if(ahp)ahp.addEventListener('click',function(){
    if(s.afterHoursPct<50){
      s.afterHoursPct=Math.min(50,s.afterHoursPct+5);
      var n=document.getElementById('qc-ahnum');if(n)n.textContent=s.afterHoursPct+'%';
      var sub=document.getElementById('qc-ahsub');if(sub)sub.textContent=s.afterHoursPct>0?'+'+s.afterHoursPct+'% on labour':'No premium';
      calcLive();
    }
  });
}

function syncHrsPicks(){
  document.querySelectorAll('#qc-form .qc-hrs-pick').forEach(function(b){
    b.classList.toggle('on',parseFloat(b.dataset.hrs)===s.hrs);
  });
}

// ─── Print template ──────────────────────────────────────────────

function updatePrint(r,sLab,fLab,tLab){
  var el=document.getElementById('qc-print');if(!el)return;
  var date=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  function prow(l,v){return '<tr><td style="padding:6px 0;color:#555;border-bottom:1px solid #eee">'+l+'</td><td style="padding:6px 0;text-align:right;font-weight:500;color:#000;border-bottom:1px solid #eee">'+v+'</td></tr>';}
  el.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:16px;margin-bottom:24px">'+
      '<div><div style="font-size:20px;font-weight:700;color:#000">MyQuest</div><div style="font-size:11px;color:#555;margin-top:2px">Pty Ltd</div></div>'+
      '<div style="text-align:right"><div style="font-size:15px;font-weight:600;color:#000">Quote Estimate</div><div style="font-size:11px;color:#555;margin-top:2px">'+date+'</div></div>'+
    '</div>'+
    '<div style="margin-bottom:20px">'+
      (sLab?'<b>'+sLab+'</b> &mdash; ':'')+fLab+' '+tLab.toLowerCase()+'<br>'+
      r.hrs+' hours estimated'+
    '</div>'+
    '<table style="width:100%;border-collapse:collapse;font-size:13px;margin-bottom:20px">'+
      prow(r.hrs+' hrs &times; $'+QC.rate+'/hr',au(r.baseLabour))+
      (r.afterHoursAmt>0?prow('After-hours loading (+'+r.afterHoursPct+'%)','+'+au(r.afterHoursAmt)):'')+
      prow('Cleaning supplies &amp; equipment',au(r.sup))+
      (r.bufferAmt>0?prow('Site allowance (+'+Math.round(QC.bufferPct*100)+'%)','+'+au(r.bufferAmt)):'')+
      '<tr><td style="padding:8px 0;font-weight:700;font-size:14px;color:#000;border-top:2px solid #000">Per clean</td>'+
      '<td style="padding:8px 0;font-weight:700;font-size:14px;color:#000;text-align:right;border-top:2px solid #000">'+au(r.per)+'</td></tr>'+
    '</table>'+
    (r.monthly?'<div style="margin-bottom:12px;font-size:13px;color:#555">Approx. '+au(r.monthly)+' per month</div>':'')+
    '<div style="font-size:11px;color:#777;line-height:1.65;margin-bottom:20px">Estimate valid for 30 days. GST not included. Final pricing confirmed in writing before work begins.</div>'+
    '<div style="font-size:12px;color:#000;border-top:1px solid #ddd;padding-top:12px">hello@myquest.au &middot; 0413 154 932 &middot; myquest.au</div>';
}

// ─── Mobile nav ───────────────────────────────────────────────────

var mob=document.getElementById('mob-menu');
var mOverlay=document.getElementById('mob-overlay');
function navClose(){document.body.classList.remove('mob-open');}
if(mob)mob.addEventListener('click',function(){document.body.classList.toggle('mob-open');});
if(mOverlay)mOverlay.addEventListener('click',function(e){if(!e.target.closest('.mob-nav-links')||e.target.tagName==='A')navClose();});

// ─── Init ─────────────────────────────────────────────────────────

initStats();
initForm();
calcLive();

MQ.sb.from('inquiries').select('id',{count:'exact',head:true}).eq('status','new').then(function(r){
  var n=r.count||0;['inq-notif','mob-inq-notif'].forEach(function(id){var el=document.getElementById(id);if(!el)return;if(n>0){el.textContent=n>9?'9+':String(n);el.classList.add('show');}else el.classList.remove('show');});
});
}); // end requireAuth
})();
</script>
