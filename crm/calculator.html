<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Quote Calculator — MyQuest CRM</title>
<link rel="stylesheet" href="style.css?v=20260814">
<style>
:root{
  --qc-bg:#131720;
  --qc-panel:#1c2230;
  --qc-rule:rgba(255,255,255,.07);
  --qc-rule-md:rgba(255,255,255,.12);
  --qc-label:rgba(240,236,224,.38);
  --qc-body:rgba(240,236,224,.72);
  --qc-cream:#f0ece0;
  --qc-gold:#c8a96a;
  --qc-seg:rgba(255,255,255,.06);
  --qc-seg-bd:rgba(255,255,255,.12);
}

/* ── Dark canvas override ── */
.qc-main{background:var(--qc-bg)}
.qc-main .ph{border-bottom:1px solid var(--qc-rule);padding-bottom:28px;margin-bottom:0}
.qc-main .ph-title{color:var(--qc-cream)}
.qc-main .mob-bar{background:var(--qc-cream)}

/* ── Layout ── */
.qc-layout{display:grid;grid-template-columns:1fr 400px;gap:32px;align-items:start;padding-top:32px}
.qc-form-col{min-width:0}

/* ── Pricing toolbar ── */
.qc-toolbar{display:flex;flex-wrap:wrap;gap:6px 20px;padding:18px 0;border-bottom:1px solid var(--qc-rule);margin-bottom:0;font-size:12px;color:var(--qc-label);letter-spacing:.03em;align-items:center}
.qc-toolbar-sep{color:var(--qc-rule-md);font-size:10px;user-select:none}

/* ── Form slabs ── */
.qc-slab{display:grid;grid-template-columns:116px 1fr;gap:20px;align-items:start;padding:28px 0;border-bottom:1px solid var(--qc-rule)}
.qc-slab:last-child{border-bottom:none}
.qc-slab-head{padding-top:3px}
.qc-slab-num{font-size:10px;font-family:ui-monospace,monospace;color:var(--qc-label);opacity:.45;display:block;margin-bottom:5px;letter-spacing:.04em}
.qc-slab-lbl{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--qc-label);line-height:1.45}
.qc-slab-body{min-width:0}

/* ── Segmented control ── */
.qc-seg-ctrl{display:inline-flex;background:var(--qc-seg);border:1px solid var(--qc-seg-bd);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.qc-seg-ctrl.block{display:flex;width:100%}
.qc-seg-ctrl.block .qc-seg-btn{flex:1}
.qc-seg-btn{border:none;background:transparent;color:var(--qc-body);font-family:inherit;font-size:13.5px;padding:9px 18px;border-radius:7px;cursor:pointer;transition:background .13s,color .13s;white-space:nowrap;line-height:1;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.qc-seg-btn:hover{color:var(--qc-cream)}
.qc-seg-btn.on{background:var(--qc-cream);color:#131720;font-weight:600}

/* ── SQM ── */
.qc-sqm-ctrl{display:flex;align-items:center;gap:16px;margin-bottom:16px}
#qc-sqm-v{font-size:72px;font-weight:700;color:var(--qc-cream);background:transparent;border:none;outline:none;text-align:center;width:180px;-moz-appearance:textfield;font-family:inherit;letter-spacing:-.03em;line-height:1}
#qc-sqm-v::-webkit-outer-spin-button,#qc-sqm-v::-webkit-inner-spin-button{-webkit-appearance:none}
.qc-sqm-label{display:flex;align-items:center}
.qc-sqm-u{font-size:18px;font-weight:300;color:var(--qc-label);margin-left:6px;line-height:1}
.qc-sqm-pm{background:none;border:1px solid var(--qc-seg-bd);color:var(--qc-body);font-family:inherit;font-size:22px;width:44px;height:44px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .13s,color .13s;flex-shrink:0;line-height:1}
.qc-sqm-pm:hover{border-color:var(--qc-cream);color:var(--qc-cream)}
.qc-sqm-picks{display:flex;gap:18px;flex-wrap:wrap}
.qc-sqm-pick{background:none;border:none;font-family:inherit;font-size:12.5px;color:var(--qc-label);cursor:pointer;padding:2px 0;border-bottom:1px solid transparent;transition:color .13s,border-color .13s}
.qc-sqm-pick:hover,.qc-sqm-pick.on{color:var(--qc-cream);border-bottom-color:var(--qc-gold)}
.qc-sqm-hint{font-size:11px;color:var(--qc-gold);margin-top:8px;display:none}
.qc-sqm-hint.vis{display:block}

/* ── Bath stepper ── */
.qc-bath-wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.qc-bath-group{display:flex;flex-direction:column;gap:10px}
.qc-bath-sub{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--qc-label);opacity:.7}
.qc-bath-row{display:flex;align-items:center;gap:14px}
.qc-bath-btn{background:none;border:1px solid var(--qc-seg-bd);color:var(--qc-body);font-family:inherit;font-size:18px;width:38px;height:38px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color .13s,color .13s;-webkit-tap-highlight-color:transparent}
.qc-bath-btn:hover{border-color:var(--qc-cream);color:var(--qc-cream)}
.qc-bath-num{font-size:28px;font-weight:700;color:var(--qc-cream);min-width:36px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.qc-bath-divider{width:1px;height:40px;background:var(--qc-rule-md);flex-shrink:0}

/* ── Freq+Type pair ── */
.qc-pair{display:flex;gap:24px;flex-wrap:wrap}
.qc-pair-col{display:flex;flex-direction:column;gap:10px}
.qc-pair-sub{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--qc-label);opacity:.7}

/* ── Preview panel ── */
#qc-preview{background:var(--qc-panel);border-radius:16px;padding:28px 26px;position:sticky;top:28px;border:1px solid rgba(255,255,255,.06)}

/* Placeholder */
.qc-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 20px;gap:12px;text-align:center}
.qc-ph-arrow{font-size:28px;color:var(--qc-cream);opacity:.12}
.qc-ph-lbl{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--qc-label);opacity:.7}
.qc-ph-hint{font-size:13px;color:var(--qc-label);line-height:1.6}

/* Result */
.qc-rtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px}
.qc-rtag{font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--qc-body);background:rgba(255,255,255,.06);border-radius:6px;padding:3px 8px}
.qc-range{font-size:48px;font-weight:700;color:var(--qc-cream);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.qc-range-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:7px}
.qc-range-lbl{font-size:12px;color:var(--qc-label)}
.qc-range-mth{font-size:12px;color:var(--qc-label)}
.qc-per-sub{font-size:12px;color:var(--qc-label);margin-top:3px}

.qc-breakdown{margin:20px 0 0;border-top:1px solid rgba(255,255,255,.08)}
.qc-brow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);color:var(--qc-body);font-size:13px;font-variant-numeric:tabular-nums}
.qc-brow.tot{color:var(--qc-cream);font-weight:600;font-size:14px;border-bottom:none;border-top:1px solid rgba(255,255,255,.1);padding-top:13px;margin-top:4px}
.qc-brow.ann{color:var(--qc-gold);font-size:13px;font-weight:600;border-bottom:none;padding-top:6px}
.qc-buf-row{width:100%;border:none;border-bottom:1px solid rgba(255,255,255,.05);background:none;font-family:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;color:rgba(240,236,224,.2);transition:color .15s;text-align:left;-webkit-tap-highlight-color:transparent}
.qc-buf-row:hover,.qc-buf-row.on{color:var(--qc-body)}

.qc-incl{border-top:1px solid rgba(255,255,255,.07);margin:16px 0 0;padding-top:12px}
.qc-incl-row{font-size:11.5px;color:var(--qc-label);padding:3px 0}
.qc-valid{font-size:10.5px;color:rgba(240,236,224,.18);text-align:center;margin-top:6px;letter-spacing:.04em}

/* Buttons */
.qc-save{width:100%;background:var(--qc-cream);color:#131720;border:none;border-radius:10px;padding:14px 20px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:-.01em;transition:opacity .15s;margin-top:20px;-webkit-tap-highlight-color:transparent}
.qc-save:hover{opacity:.88}
.qc-dl{width:100%;background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:10px;color:var(--qc-body);padding:11px;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .2s,color .2s;margin-top:8px;font-family:inherit}
.qc-dl:hover{border-color:rgba(255,255,255,.35);color:var(--qc-cream)}
.qc-restart{background:none;border:none;color:var(--qc-label);font-size:12px;cursor:pointer;padding:10px;transition:color .2s;width:100%;text-align:center;font-family:inherit}
.qc-restart:hover{color:var(--qc-cream)}

/* Save form */
.qc-sf-title{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--qc-label);margin-bottom:14px}
.qc-sf-wrap{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.qc-sf-row{display:flex;flex-direction:column;gap:5px}
.qc-sf-row label{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--qc-label);font-weight:700}
.qc-sf-row input{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:11px 14px;font-size:14px;color:var(--qc-cream);font-family:inherit;outline:none;-webkit-appearance:none;transition:border-color .18s}
.qc-sf-row input::placeholder{color:rgba(240,236,224,.2)}
.qc-sf-row input:focus{border-color:rgba(255,255,255,.35)}
.qc-sf-submit{width:100%;background:var(--qc-cream);color:#131720;border:none;border-radius:10px;padding:14px 20px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .18s}
.qc-sf-submit:hover{opacity:.88}
.qc-sf-submit:disabled{opacity:.35;cursor:not-allowed}

/* Success */
.qc-ok{display:flex;flex-direction:column;align-items:center;text-align:center;padding:16px 0}
.qc-ok-tick{width:48px;height:48px;background:rgba(200,169,106,.12);border:1px solid rgba(200,169,106,.28);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:20px;color:var(--qc-gold)}
.qc-ok-title{font-size:22px;font-weight:700;color:var(--qc-cream);letter-spacing:-.02em;margin-bottom:7px}
.qc-ok-sub{font-size:14px;color:var(--qc-body);line-height:1.6;margin-bottom:24px}
.qc-view-jobs{display:block;width:100%;background:var(--qc-cream);color:#131720;border:none;border-radius:10px;padding:14px 20px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;text-align:center;margin-bottom:4px;box-sizing:border-box}
.qc-view-jobs:hover{opacity:.88}

/* Mobile bar */
.qc-mob-bar{display:none;position:fixed;bottom:0;left:0;right:0;z-index:100;background:#0e1119;color:var(--qc-cream);padding:14px 20px;border-top:1px solid rgba(255,255,255,.08);align-items:center;justify-content:space-between}
.qc-mob-price{font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qc-mob-sub{font-size:11px;color:var(--qc-label);margin-top:2px}
.qc-mob-see{background:rgba(255,255,255,.1);border:none;color:var(--qc-cream);font-family:inherit;font-size:13px;font-weight:600;padding:8px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent}

/* Print */
.qc-print{display:none}
@media print{body>*{display:none!important}#qc-print{display:block!important;position:fixed;inset:0;padding:18mm 20mm;background:#fff;color:#232c54;font-family:system-ui,sans-serif;font-size:13px;line-height:1.6}}

/* Mobile */
@media(max-width:768px){
  .qc-main.main{padding:20px 16px 88px}
  .qc-toolbar{display:none}
  .qc-layout{grid-template-columns:1fr;gap:0;padding-top:0}
  .qc-slab{grid-template-columns:1fr;gap:14px}
  .qc-slab-head{display:flex;gap:10px;align-items:baseline}
  .qc-slab-num{margin-bottom:0}
  #qc-preview{position:static;border-radius:0 0 16px 16px}
  .qc-mob-bar{display:flex}
  .qc-range{font-size:36px}
  #qc-sqm-v{font-size:52px;width:130px}
  .qc-pair{flex-direction:column;gap:18px}
  .qc-bath-wrap{gap:14px}
  .qc-bath-divider{display:none}
}
</style>
</head>

<script>
(function(){
'use strict';
window.MQ.requireAuth(function(){

if(localStorage.getItem('mq_v')!=='3'){
  Object.keys(localStorage).filter(function(k){return k.indexOf('mq_')===0;}).forEach(function(k){localStorage.removeItem(k);});
  localStorage.setItem('mq_v','3');
}

var QC={
  rate:65,
  sqmHr:{maintenance:200,deep:85},
  spaceMult:{office:1.0,retail:1.0,medical:1.5,industrial:1.0},
  bathMins:22,
  kitchenMins:25,
  extras:{floor_polish:0.55,carpet:0.25,rubbish:25},
  freqDisc:{once:1.0,monthly:0.97,fortnightly:0.95,weekly:0.90},
  suppliesCost:20,
  bufferPct:0.15,
  minHrsMaint:2,
  minHrsDeepRecurring:3,
  minHrsDeep:5
};

var SPACE_LABELS=['Office / Corporate','Retail / Showroom','Medical / Allied Health','Industrial / Warehouse'];
var SPACE_KEYS=['office','retail','medical','industrial'];
var FREQ_LABELS=['One-off','Monthly','Fortnightly','Weekly'];
var FREQ_KEYS=['once','monthly','fortnightly','weekly'];
var EXTRA_LABELS=['Hard floor polish','Carpet vacuum','Rubbish removal'];
var EXTRA_KEYS=['floor_polish','carpet','rubbish'];

var s={
  space:null,sqm:100,baths:2,kitchen:null,freq:null,type:null,
  extras:{},buffer:false,hasResult:false,
  saving:false,saved:false,savedClientName:''
};
var lastResult=null;

function resetState(){
  s={space:null,sqm:100,baths:2,kitchen:null,freq:null,type:null,extras:{},buffer:false,hasResult:false,saving:false,saved:false,savedClientName:''};
  lastResult=null;
}

// ─── CALC UTILS (unchanged) ───────────────────────────────────

function calc(){
  var sqm=Math.max(50,Math.min(5000,Math.floor(s.sqm||50)));
  var hrs=(sqm/QC.sqmHr[s.type])*QC.spaceMult[s.space];
  var bHrs=(s.baths*QC.bathMins)/60;
  var kHrs=s.kitchen?QC.kitchenMins/60:0;
  var total=Math.ceil((hrs+bHrs+kHrs)*2)/2;
  if(s.type==='maintenance')total=Math.max(total,QC.minHrsMaint);
  else if(s.freq==='once')total=Math.max(total,QC.minHrsDeep);
  else total=Math.max(total,QC.minHrsDeepRecurring);
  var labour=total*QC.rate;
  var sup=QC.suppliesCost;
  var ext=0;
  if(s.extras.floor_polish)ext+=sqm*QC.extras.floor_polish;
  if(s.extras.carpet)ext+=sqm*QC.extras.carpet;
  if(s.extras.rubbish)ext+=QC.extras.rubbish;
  var per=labour+sup+ext;
  var bufferAmt=s.buffer?per*QC.bufferPct:0;
  per+=bufferAmt;
  var disc=QC.freqDisc[s.freq]||1.0;
  var subBeforeDisc=per;
  per=per*disc;
  var mthMult={once:null,monthly:1,fortnightly:2.17,weekly:4.33};
  return{per:per,lo:r5(per*.9),hi:r5(per*1.1),monthly:mthMult[s.freq]?per*mthMult[s.freq]:null,hrs:total,labour:labour,sup:sup,ext:ext,bufferAmt:bufferAmt,disc:disc,subBeforeDisc:subBeforeDisc};
}
function r5(n){return Math.round(n/5)*5;}
function au(n){return '$'+Math.round(n).toLocaleString('en-AU');}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function brow(l,v){return '<div class="qc-brow"><span>'+l+'</span><span>'+v+'</span></div>';}
function seg(label,key,on,group){
  return '<button type="button" class="qc-seg-btn'+(on?' on':'')+'" data-key="'+key+'" data-grp="'+group+'">'+label+'</button>';
}

// ─── TOOLBAR ─────────────────────────────────────────────────

function initToolbar(){
  var el=document.getElementById('qc-toolbar');
  if(!el)return;
  var minCost=QC.rate*QC.minHrsMaint;
  var deepCost=QC.rate*QC.minHrsDeep+QC.suppliesCost;
  var sep='<span class="qc-toolbar-sep">&middot;</span>';
  el.innerHTML=
    '<span>$'+QC.rate+' / hr labour</span>'+sep+
    '<span>'+QC.minHrsMaint+' hr minimum &mdash; '+au(minCost)+'</span>'+sep+
    '<span>deep clean from '+au(deepCost)+'</span>'+sep+
    '<span>+'+Math.round(QC.bufferPct*100)+'% site allowance available</span>';
}

function initForm(){
  var fc=document.getElementById('qc-form');
  if(fc)fc.innerHTML=renderFormCol();
  bindForm();
}

function bindForm(){
  document.querySelectorAll('#qc-form .qc-seg-btn[data-grp]').forEach(function(btn){
    btn.addEventListener('click',function(){
      var key=this.dataset.key,grp=this.dataset.grp;
      if(grp==='space')s.space=key;
      else if(grp==='kit')s.kitchen=(key==='yes');
      else if(grp==='freq')s.freq=key;
      else if(grp==='type')s.type=key;
      else if(grp==='ext'){
        s.extras[key]=!s.extras[key];
        this.classList.toggle('on',!!s.extras[key]);
        calcLive();return;
      }
      document.querySelectorAll('#qc-form .qc-seg-btn[data-grp="'+grp+'"]').forEach(function(b){
        b.classList.toggle('on',b.dataset.key===key);
      });
      calcLive();
    });
  });

  document.querySelectorAll('#qc-form .qc-sqm-pick').forEach(function(btn){
    btn.addEventListener('click',function(){
      s.sqm=parseInt(this.dataset.sqm,10);
      var v=document.getElementById('qc-sqm-v');if(v)v.value=s.sqm;
      syncSqmPicks();calcLive();
    });
  });

  var sqmM=document.getElementById('qc-sqm-m');
  var sqmP=document.getElementById('qc-sqm-p');
  var sqmV=document.getElementById('qc-sqm-v');
  if(sqmM)sqmM.addEventListener('click',function(){
    var v=Math.max(50,(s.sqm||100)-50);s.sqm=v;
    if(sqmV)sqmV.value=v;syncSqmPicks();calcLive();
  });
  if(sqmP)sqmP.addEventListener('click',function(){
    var v=Math.min(5000,(s.sqm||100)+50);s.sqm=v;
    if(sqmV)sqmV.value=v;syncSqmPicks();calcLive();
  });
  if(sqmV)sqmV.addEventListener('input',function(){
    var v=parseInt(this.value,10);
    s.sqm=(isNaN(v)||v<1)?0:Math.min(5000,v);
    var hint=document.getElementById('qc-sqm-hint');
    if(hint)hint.classList.toggle('vis',s.sqm>=10&&s.sqm<50);
    syncSqmPicks();calcLive();
  });

  var bm=document.getElementById('qc-minus');
  var bp=document.getElementById('qc-plus');
  if(bm)bm.addEventListener('click',function(){
    if(s.baths>0){s.baths--;var n=document.getElementById('qc-bnum');if(n)n.textContent=s.baths;calcLive();}
  });
  if(bp)bp.addEventListener('click',function(){
    if(s.baths<8){s.baths++;var n=document.getElementById('qc-bnum');if(n)n.textContent=s.baths;calcLive();}
  });
}

function syncSqmPicks(){
  document.querySelectorAll('#qc-form .qc-sqm-pick').forEach(function(b){
    b.classList.toggle('on',parseInt(b.dataset.sqm,10)===s.sqm);
  });
}

  var qLab=s.sqm+' sqm';
  var fLab=FREQ_LABELS[FREQ_KEYS.indexOf(s.freq)]||'';
  var tLab=s.type==='deep'?'Deep clean':'Maintenance';
  var ANN_MULT={monthly:12,fortnightly:26,weekly:52};
  var annVal=ANN_MULT[s.freq]?r.per*ANN_MULT[s.freq]:null;
  var weeklyEq=null;
  if(s.freq==='fortnightly')weeklyEq=r.per/2;
  else if(s.freq==='monthly')weeklyEq=r.per*12/52;

  var rows='';
  rows+=brow('Labour ('+r.hrs.toFixed(1)+' hrs)',au(r.labour));
  rows+=brow('Supplies',au(r.sup));
  if(r.ext>0)rows+=brow('Add-ons',au(r.ext));
  rows+='<button type="button" class="qc-buf-row'+(s.buffer?' on':'')+'" id="qc-buf">'+
    '<span>Site allowance <span style="opacity:.45;font-size:11px">(+'+Math.round(QC.bufferPct*100)+'%)</span></span>'+
    '<span>'+(s.buffer?'+'+au(r.bufferAmt):'tap to add')+'</span>'+
  '</button>';
  if(r.disc<1.0)rows+=brow('Freq. discount ('+Math.round((1-r.disc)*100)+'% off)','&#8722;'+au(r.subBeforeDisc*(1-r.disc)));
  rows+='<div class="qc-brow tot"><span>Per clean</span><span>'+au(r.per)+'</span></div>';
  if(annVal)rows+='<div class="qc-brow ann"><span>Annual contract</span><span>&#8776; '+au(annVal)+'</span></div>';

  updatePrint(r,sLab,qLab,fLab,tLab);

  return '<div class="qc-rtags">'+
    '<span class="qc-rtag">'+esc(sLab)+'</span>'+
    '<span class="qc-rtag">'+esc(qLab)+'</span>'+
    '<span class="qc-rtag">'+esc(fLab)+'</span>'+
    '<span class="qc-rtag">'+tLab+'</span>'+
  '</div>'+
  '<div class="qc-range">'+au(r.lo)+' &#8211; '+au(r.hi)+'</div>'+
  '<div class="qc-range-row">'+
    '<span class="qc-range-lbl">per clean (estimate)</span>'+
    (r.monthly?'<span class="qc-range-mth">&#8776;'+au(r.monthly)+'/month</span>':'')+
  '</div>'+
  (weeklyEq?'<div class="qc-per-sub">&#8776; '+au(weeklyEq)+' per week</div>':'')+
  '<div class="qc-breakdown">'+rows+'</div>'+
  '<div class="qc-incl">'+
    '<div class="qc-incl-row">&#10003;&#160; Cleaning supplies &amp; chemicals</div>'+
    '<div class="qc-incl-row">&#10003;&#160; Public liability insurance</div>'+
    '<div class="qc-incl-row">&#10003;&#160; Background-checked, trained staff</div>'+
  '</div>'+
  '<button type="button" class="qc-save" id="qc-save">Save this quote &#8594;</button>'+
  '<button type="button" class="qc-dl" id="qc-dl">&#8595; Download estimate</button>'+
  '<div class="qc-valid">Estimate valid for 30 days</div>';
}

// ─── MOBILE BAR ──────────────────────────────────────────────

function updateMobBar(r){
  var bar=document.getElementById('qc-mob-bar');
  if(!bar)return;
  if(!r){bar.style.display='none';return;}
  bar.style.display='flex';
  var price=document.getElementById('qc-mob-price');
  if(price)price.textContent=au(r.lo)+' – '+au(r.hi);
}

// ─── LIVE CALC ───────────────────────────────────────────────

function calcLive(){
  var preview=document.getElementById('qc-preview');
  if(!preview)return;
  var ready=s.space&&s.sqm>=50&&s.kitchen!==null&&s.freq&&s.type;
  if(!ready){
    s.hasResult=false;
    if(!s.saving&&!s.saved)preview.innerHTML=renderPreviewEmpty();
    updateMobBar(null);
    return;
  }
  var r=calc();
  lastResult=r;
  s.hasResult=true;
  preview.innerHTML=renderPreview(r);
  bindPreview(r);
  updateMobBar(s.saved?null:r);
}

function bindPreview(r){
  var buf=document.getElementById('qc-buf');
  if(buf)buf.addEventListener('click',function(){s.buffer=!s.buffer;calcLive();});
  var dl=document.getElementById('qc-dl');
  if(dl)dl.addEventListener('click',function(){var el=document.getElementById('qc-print');if(el&&el.innerHTML)window.print();});
  var sv=document.getElementById('qc-save');
  if(sv)sv.addEventListener('click',function(){s.saving=true;calcLive();});
  var qss=document.getElementById('qs-submit');
  if(qss)qss.addEventListener('click',saveQuote);
  var bkr=document.getElementById('qc-back-res');
  if(bkr)bkr.addEventListener('click',function(){s.saving=false;calcLive();});
  var rs=document.getElementById('qc-restart');
  if(rs)rs.addEventListener('click',function(){resetState();initForm();calcLive();});
}

// ─── SAVE TO SUPABASE (unchanged) ────────────────────────────

function saveQuote(){
  var biz=((document.getElementById('qs-biz')||{}).value||'').trim();
  var contact=((document.getElementById('qs-contact')||{}).value||'').trim();
  var email=((document.getElementById('qs-email')||{}).value||'').trim();
  var phone=((document.getElementById('qs-phone')||{}).value||'').trim();
  var site=((document.getElementById('qs-site')||{}).value||'').trim();
  if(!biz){var f=document.getElementById('qs-biz');if(f)f.focus();return;}
  var btn=document.getElementById('qs-submit');
  if(btn){btn.disabled=true;btn.textContent='Saving...';}
  var sb=MQ.sb;
  var FREQ_TO_REPEAT={monthly:'monthly',fortnightly:'fortnightly',weekly:'weekly'};
  var SPACE_TO_INDUSTRY={office:'Commercial office',retail:'Retail',medical:'Medical',industrial:'Industrial'};
  sb.from('clients').insert([{
    name:biz,contact:contact||null,email:email||null,phone:phone||null,
    site_address:site||null,industry:SPACE_TO_INDUSTRY[s.space]||null,status:'active'
  }]).select('id,name').single()
    .then(function(res){
      if(res.error)throw res.error;
      var cid=res.data.id,cname=res.data.name;
      var today=new Date().toISOString().slice(0,10);
      var jrow={client_id:cid,client_name:cname,date:today,type:s.type==='deep'?'deep':'maintenance',status:'upcoming'};
      if(site)jrow.site=site;
      if(FREQ_TO_REPEAT[s.freq])jrow.repeat=FREQ_TO_REPEAT[s.freq];
      return sb.from('jobs').insert([jrow]).select('id').single().then(function(jr){
        if(jr.error)throw jr.error;
        s.savedClientName=cname;
        s.saving=false;
        s.saved=true;
        var preview=document.getElementById('qc-preview');
        if(preview){preview.innerHTML=renderSaved();bindPreview(null);}
        updateMobBar(null);
      });
    })
    .catch(function(err){
      if(btn){btn.disabled=false;btn.textContent='Save & create job';}
      alert('Could not save: '+(err.message||String(err)));
    });
}

// ─── PRINT (unchanged) ───────────────────────────────────────

function updatePrint(r,sLab,qLab,fLab,tLab){
  var el=document.getElementById('qc-print');if(!el)return;
  var date=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'long',year:'numeric'});
  var extList=EXTRA_KEYS.filter(function(k){return s.extras[k];}).map(function(k){return EXTRA_LABELS[EXTRA_KEYS.indexOf(k)];}).join(', ');
  var basedOn=[qLab+' '+sLab,fLab+' '+tLab.toLowerCase()+' clean',s.baths+(s.baths===1?' bathroom':' bathrooms')];
  if(s.kitchen)basedOn.push('Kitchenette');if(extList)basedOn.push(extList);
  function prow(l,v){return '<tr><td style="padding:6px 0;color:#555;border-bottom:1px solid #eee">'+l+'</td><td style="padding:6px 0;text-align:right;font-weight:500;color:#000;border-bottom:1px solid #eee">'+v+'</td></tr>';}
  el.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:16px;margin-bottom:24px">'+
      '<div><div style="font-size:20px;font-weight:700;color:#000">MyQuest</div><div style="font-size:11px;color:#555;margin-top:2px">Pty Ltd</div></div>'+
      '<div style="text-align:right"><div style="font-size:15px;font-weight:600;color:#000">Quote Estimate</div><div style="font-size:11px;color:#555;margin-top:2px">'+date+'</div></div>'+
    '</div>'+
    '<div style="margin-bottom:24px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#555;margin-bottom:10px">Based on</div>'+
    '<ul style="list-style:none;padding:0;margin:0">'+basedOn.map(function(item){return '<li style="font-size:14px;font-weight:500;color:#000;padding:4px 0;border-bottom:1px solid #f0f0f0">'+item+'</li>';}).join('')+'</ul></div>'+
    '<div style="margin-bottom:24px"><div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#555;margin-bottom:10px">Price breakdown</div>'+
    '<table style="width:100%;border-collapse:collapse;font-size:13px">'+
      prow('Labour ('+r.hrs.toFixed(1)+' hrs)',au(r.labour))+
      prow('Supplies',au(r.sup))+
      (r.ext>0?prow(extList||'Add-ons',au(r.ext)):'')+
      (r.bufferAmt>0?prow('Site allowance (+15%)','+'+au(r.bufferAmt)):'')+
      '<tr><td style="padding:8px 0;font-weight:700;font-size:14px;color:#000;border-top:2px solid #000">Per clean</td>'+
      '<td style="padding:8px 0;font-weight:700;font-size:14px;color:#000;text-align:right;border-top:2px solid #000">'+au(r.per)+'</td></tr>'+
    '</table></div>'+
    '<div style="background:#f5f5f5;border-radius:10px;padding:20px 24px;margin-bottom:20px">'+
      '<div style="font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#555;margin-bottom:6px">Estimated price per clean</div>'+
      '<div style="font-size:30px;font-weight:700;letter-spacing:-.02em;color:#000">'+au(r.lo)+' – '+au(r.hi)+'</div>'+
      (r.monthly?'<div style="font-size:12px;color:#555;margin-top:4px">Approx. '+au(r.monthly)+' per month</div>':'')+
    '</div>'+
    '<div style="font-size:11px;color:#555;line-height:1.65;margin-bottom:22px">This is an estimate only. Final pricing will be confirmed in writing before any work begins.</div>'+
    '<div style="font-size:12px;color:#000;border-top:1px solid #ddd;padding-top:12px">hello@myquest.au  &#183;  0413 154 932  &#183;  myquest.au</div>';
}
