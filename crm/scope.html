<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href=/assets/favicon.svg type="image/svg+xml">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Scope of Works — MyQuest CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=20261009">
<style>
.scope-info{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);padding:22px 24px;margin-bottom:20px}
.scope-info-grid{display:grid;grid-template-columns:1fr 1fr 160px;gap:14px;align-items:end}
.scope-name-row{margin-bottom:22px;padding-bottom:18px;border-bottom:1px solid var(--hair)}
.scope-name-lbl{display:block;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin-bottom:14px}
.scope-name-input{width:100%;font-size:36px;font-weight:700;color:var(--navy);border:none;background:none;outline:none;font-family:var(--font);letter-spacing:-.03em;padding:0}
.scope-name-input::placeholder{color:rgba(0,0,0,.2)}

.scope-area{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);margin-bottom:14px;overflow:hidden}
.sa-header{display:flex;align-items:center;gap:12px;padding:14px 20px 12px;border-bottom:1px solid var(--hair);background:rgba(0,0,0,.025)}
.sa-name{flex:1;font-size:14px;font-weight:700;color:var(--navy);border:none;background:none;outline:none;font-family:var(--font);letter-spacing:-.01em;padding:0}
.sa-name::placeholder{color:rgba(0,0,0,.3)}
.sa-remove{border:none;background:none;color:var(--stone);cursor:pointer;font-size:11px;font-weight:600;font-family:var(--font);letter-spacing:.04em;text-transform:uppercase;padding:0;transition:color .12s;flex-shrink:0}
.sa-remove:hover{color:var(--red)}

.sa-tasks{padding:0 20px}
.sa-task{display:grid;grid-template-columns:16px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--hair)}
.sa-task:last-child{border-bottom:none}
.sa-bullet{font-size:16px;color:var(--stone);line-height:1;display:flex;align-items:center;justify-content:center}
.sa-task-text{border:none;background:none;outline:none;font-family:var(--font);font-size:13px;color:var(--navy);width:100%;padding:0}
.sa-task-text::placeholder{color:rgba(0,0,0,.3)}
.sa-task-rm{border:none;background:none;color:var(--stone);cursor:pointer;font-size:18px;line-height:1;padding:0 2px;transition:color .12s;flex-shrink:0;display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px}
.sa-task-rm:hover{color:var(--red);background:var(--red-bg)}

.sa-footer{padding:10px 20px 14px}
.sa-add-task{border:none;background:none;color:var(--stone);font-size:12.5px;font-weight:600;font-family:var(--font);cursor:pointer;padding:0;transition:color .12s}
.sa-add-task:hover{color:var(--navy)}

.scope-add-area{width:100%;padding:13px 20px;border:1.5px dashed rgba(0,0,0,.16);border-radius:var(--r);background:none;font-family:var(--font);font-size:13px;font-weight:600;color:var(--stone);cursor:pointer;transition:border-color .12s,color .12s;margin-bottom:20px;text-align:center}
.scope-add-area:hover{border-color:rgba(0,0,0,.3);color:var(--navy)}

.scope-global{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);padding:20px 24px;margin-bottom:24px}
.scope-global label{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);display:block;margin-bottom:10px}
.scope-global textarea{width:100%;border:none;outline:none;background:none;font-family:var(--font);font-size:13px;color:var(--navy);resize:none;line-height:1.7;min-height:56px}
.scope-global textarea::placeholder{color:rgba(0,0,0,.3);font-style:italic}

.scope-bottom{display:flex;align-items:center;gap:10px;padding-bottom:40px}
.scope-print-btn{padding:9px 16px;border-radius:var(--r-sm);border:1.5px solid var(--hair-md);background:none;font-family:var(--font);font-size:13px;font-weight:600;color:var(--stone);cursor:pointer;transition:border-color .12s,color .12s;display:inline-flex;align-items:center;gap:6px}
.scope-print-btn:hover{color:var(--navy);border-color:rgba(0,0,0,.2)}
.scope-cancel-btn{padding:9px 16px;border-radius:var(--r-sm);border:1.5px solid var(--hair-md);background:none;font-family:var(--font);font-size:13px;font-weight:600;color:var(--stone);cursor:pointer;transition:border-color .12s,color .12s;margin-left:auto}
.scope-cancel-btn:hover{color:var(--navy);border-color:rgba(0,0,0,.2)}

.saved-scopes{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);overflow:hidden;margin-bottom:40px}
.ss-wrap{border-bottom:1px solid var(--hair);border-left:3px solid var(--hair-md);transition:border-left-color .15s}
.ss-wrap:last-child{border-bottom:none}
.ss-wrap:hover{border-left-color:rgba(0,0,0,.25)}
.ss-wrap.open{border-left-color:var(--navy)}
.ss-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:16px 20px;align-items:center;cursor:pointer;transition:background .1s}
.ss-row:hover{background:rgba(0,0,0,.025)}
.ss-name{font-size:15px;font-weight:700;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em}
.ss-sub{font-size:11.5px;color:var(--stone);margin-top:3px}
.ss-date{font-size:11px;color:var(--stone);white-space:nowrap;font-weight:600;letter-spacing:.04em;text-transform:uppercase;background:rgba(0,0,0,.06);padding:3px 8px;border-radius:4px}
.ss-del{background:var(--red);border:1.5px solid var(--red);color:#fff;cursor:pointer;padding:7px 14px;border-radius:var(--r-sm);transition:background .12s,border-color .12s;font-size:12.5px;font-family:var(--font);font-weight:600}
.ss-del:hover{background:#8a3126;border-color:#8a3126}
.ss-site{font-size:13px;color:var(--stone);margin-top:3px}
.ss-arr{color:var(--stone);font-size:18px;line-height:1;transition:transform .22s;display:inline-block}
.ss-wrap.open .ss-arr{transform:rotate(90deg)}
.ss-body{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.4,0,.2,1)}
.ss-body.open{max-height:4000px}
.ss-inner{padding:18px 20px 22px;border-top:1px solid var(--hair);background:var(--field)}
.sv-area{margin-bottom:16px}
.sv-area:last-of-type{margin-bottom:0}
.sv-area-name{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);margin-bottom:8px}
.sv-task{display:flex;align-items:center;gap:9px;padding:5px 0}
.sv-bullet{font-size:14px;color:var(--stone);line-height:1;flex-shrink:0}
.sv-task-text{font-size:12.5px;color:var(--navy)}
.sv-task-text.done{text-decoration:line-through;color:var(--stone)}
.sv-freq{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--stone);background:rgba(0,0,0,.07);padding:2px 6px;border-radius:4px;margin-left:auto;flex-shrink:0}
.sv-notes{font-size:11.5px;color:var(--stone);padding-left:22px;margin-top:2px;font-style:italic}
.sv-global{margin-top:14px;padding-top:12px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--stone);line-height:1.7}
.sv-global-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin-bottom:4px}
.sv-footer{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--hair)}
.sv-edit-btn{padding:7px 14px;border:1.5px solid var(--hair-md);border-radius:var(--r-sm);background:none;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer;transition:background .12s,border-color .12s}
.sv-edit-btn:hover{background:rgba(0,0,0,.06);border-color:rgba(0,0,0,.2)}

.empty-areas{padding:36px 24px;text-align:center;color:var(--stone);font-size:13px;border:1.5px dashed rgba(0,0,0,.12);border-radius:var(--r);margin-bottom:14px}
.empty-areas p{margin-bottom:12px}
.scope-info-badge{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--stone);background:rgba(0,0,0,.07);padding:3px 10px;border-radius:5px;margin-bottom:16px}

.scope-toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--navy);color:#fff;font-size:13px;font-weight:600;font-family:var(--font);letter-spacing:.01em;padding:11px 22px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.28);z-index:500;opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;white-space:nowrap}
.scope-toast.scope-toast-in{opacity:1;transform:translateX(-50%) translateY(0)}
.scope-toast.scope-toast-err{background:var(--red)}

@media print{
  .sidebar,.ph-btn,.scope-add-area,.sa-remove,.sa-task-rm,.sa-add-task,.scope-bottom,.saved-scopes,.sh,.scope-cancel-btn,.sa-footer,.empty-areas,.bc,.scope-info-badge,.scope-empty-state,.scope-name-lbl{display:none!important}
  .layout{display:block!important}
  .main{padding:20px!important;min-width:0}
  body{background:#fff!important}
  .scope-info{border:none;padding:0;margin-bottom:16px;background:none}
  .scope-info-grid{grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid #ddd;padding-top:10px;margin-top:4px}
  .scope-name-input{font-size:20px;color:#000}
  .sa-name{color:#000}
  .scope-area{border:1px solid #ddd;margin-bottom:10px;break-inside:avoid;background:#fff}
  .sa-header{background:#f5f5f5;border-bottom:1px solid #ddd}
  .sa-bullet{color:#555}
  .sa-tasks{padding:0 16px}
  .sa-task-text,.scope-name-input{color:#000}
  .scope-global{border:1px solid #ddd;background:#fff}
  .form-lbl,.scope-global label{color:#666}
  .form-input{border:1px solid #ddd;background:#fff;color:#000}
  select.form-input{background-image:none;padding-right:12px}
}
@media(max-width:600px){
  .scope-info-grid{grid-template-columns:1fr}
  .scope-bottom{flex-wrap:wrap}
  .scope-bottom button{flex:1 1 auto}
}
</style>
</head>

 x1="16" y1="17" x2="8" y2="17"/></svg>Scope</a><a href="calculator.html" class="bnav-si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="9" y2="12"/><line x1="12" y1="12" x2="13" y2="12"/><line x1="16" y1="12" x2="17" y2="12"/><line x1="8" y1="16" x2="9" y2="16"/><line x1="12" y1="16" x2="13" y2="16"/><line x1="16" y1="16" x2="17" y2="16"/></svg>Calculator</a><a href="reports.html" class="bnav-si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>Reports</a><a href="staff.html" class="bnav-si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a6 6 0 0112 0v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.85"/></svg>Staff<span class="sb-notif" id="bnav-staff-notif"></span></a><a href="sop.html" class="bnav-si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><polyline points="9 12 11 14 15 10"/><line x1="9" y1="17" x2="15" y2="17"/></svg>SOPs</a><div class="bnav-sheet-div"></div><button type="button" class="bnav-si bnav-si-danger" onclick="MQ&&MQ.signOut()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out< <script src="supabase.min.js?v=20260806"></script>
<script src="auth.js?v=20260910"></script>
<script src="datepicker.js?v=20260913"></script>
<script>
(function(){
'use strict';
window.MQ.requireAuth(function(){
var sb=MQ.sb;
var editingId=null;
var allClients=[];

function uid(){return '_'+Math.random().toString(36).slice(2,9);}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getParam(name){var m=(window.location.search||'').match(new RegExp('[?&]'+name+'=([^&]*)'));return m?decodeURIComponent(m[1]):null;}

var FREQ_OPTS=[
  {v:'daily',l:'Daily'},{v:'weekly',l:'Weekly'},{v:'fortnightly',l:'Fortnightly'},
  {v:'monthly',l:'Monthly'},{v:'quarterly',l:'Quarterly'},{v:'as-needed',l:'As needed'}
];
var FREQ_LABELS={daily:'Daily',weekly:'Weekly',fortnightly:'Fortnightly',monthly:'Monthly',quarterly:'Quarterly','as-needed':'As needed'};

function freqOpts(sel){
  return FREQ_OPTS.map(function(o){return'<option value="'+o.v+'"'+(sel===o.v?' selected':'')+'>'+o.l+'</option>';}).join('');
}
function taskHTML(t){
  return '<div class="sa-task'+(t.done?' done':'')+'" data-task-id="'+esc(t.id)+'">'+
    '<span class="sa-bullet">•</span>'+
    '<input class="sa-task-text" type="text" placeholder="Task description…" value="'+esc(t.text||'')+'" autocomplete="off">'+
    '<button class="sa-task-rm" data-rm-task="1" title="Remove task">&times;</button>'+
  '</div>';
}
function areaHTML(a){
  return '<div class="scope-area" data-area-id="'+esc(a.id)+'">'+
    '<div class="sa-header">'+
      '<input class="sa-name" type="text" placeholder="Area name — e.g. Reception, Level 2, Bathrooms…" value="'+esc(a.name||'')+'" autocomplete="off">'+
      '<button class="sa-remove" data-rm-area="1">Remove area</button>'+
    '</div>'+
    '<div class="sa-tasks">'+((a.tasks||[]).map(taskHTML).join(''))+'</div>'+
    '<div class="sa-footer">'+
      '<button class="sa-add-task" data-add-task="1">+ Add task</button>'+
    '</div>'+
  '</div>';
}
function renderAreas(areas){
  var el=document.getElementById('scope-areas');
  if(!areas||!areas.length){el.innerHTML='<div class="empty-areas"><p>Walk through the building and add each area below.</p></div>';return;}
  el.innerHTML=areas.map(areaHTML).join('');
}
function addArea(){
  var el=document.getElementById('scope-areas');
  if(el.querySelector('.empty-areas'))el.innerHTML='';
  var a={id:uid(),name:'',tasks:[{id:uid(),text:'',freq:'weekly'}],notes:''};
  var div=document.createElement('div');div.innerHTML=areaHTML(a);
  el.appendChild(div.firstChild);
  el.lastElementChild.querySelector('.sa-name').focus();
}
function addTask(areaEl){
  var tasksEl=areaEl.querySelector('.sa-tasks');
  var t={id:uid(),text:'',freq:'weekly'};
  var div=document.createElement('div');div.innerHTML=taskHTML(t);
  tasksEl.appendChild(div.firstChild);
  tasksEl.lastElementChild.querySelector('.sa-task-text').focus();
}
function readScope(){
  var clientSel=document.getElementById('scope-client');
  var clientId=clientSel.value;
  var clientName=clientId&&clientSel.selectedIndex>0?clientSel.options[clientSel.selectedIndex].text:'';
  var areas=[];
  document.querySelectorAll('.scope-area').forEach(function(aEl){
    var areaName=aEl.querySelector('.sa-name').value.trim();
    var tasks=[];
    aEl.querySelectorAll('.sa-task').forEach(function(tEl){
      var text=tEl.querySelector('.sa-task-text').value.trim();
      if(!text)return;
      tasks.push({id:tEl.dataset.taskId,text:text,freq:'weekly',done:tEl.classList.contains('done')});
    });
    if(areaName||tasks.length)areas.push({id:aEl.dataset.areaId,name:areaName,tasks:tasks,notes:''});
  });
  return {
    name:document.getElementById('scope-name').value.trim(),
    client_id:clientId,client_name:clientName,
    site:document.getElementById('scope-site').value.trim(),
    date:document.getElementById('scope-date').value||null,
    areas:areas,
    global_notes:document.getElementById('scope-global-notes').value.trim()
  };
}
function showToast(msg,isError){
  var t=document.getElementById('scope-toast');
  if(!t){
    t=document.createElement('div');t.id='scope-toast';
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.className='scope-toast'+(isError?' scope-toast-err':'');
  clearTimeout(t._tid);
  requestAnimationFrame(function(){t.classList.add('scope-toast-in');});
  t._tid=setTimeout(function(){t.classList.remove('scope-toast-in');},2800);
}
function saveScope(){
  var sc=readScope();
  if(!sc.name&&!sc.areas.length){alert('Add a scope name or at least one area first.');return;}
  if(!sc.name)sc.name=sc.client_name||'Untitled scope';
  var btn=document.getElementById('scope-save-btn-2');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  if(editingId){
    sb.from('scopes').update(sc).eq('id',editingId).then(function(r){
      if(btn){btn.disabled=false;btn.textContent='Save scope';}
      if(r.error){showToast('Save failed: '+r.error.message,true);return;}
      showToast('Scope saved');resetEditor();renderSavedList();scrollToTop();
    });
  } else {
    sb.from('scopes').insert(sc).then(function(r){
      if(btn){btn.disabled=false;btn.textContent='Save scope';}
      if(r.error){showToast('Save failed: '+r.error.message,true);return;}
      showToast('Scope saved');resetEditor();renderSavedList();scrollToTop();
    });
  }
}
function resetEditor(){
  editingId=null;
  document.getElementById('scope-name').value='';
  document.getElementById('scope-client').value='';
  document.getElementById('scope-site').value='';
  document.getElementById('scope-date').valueAsDate=new Date();
  document.getElementById('scope-global-notes').value='';
  renderAreas([]);
  var lbl=document.getElementById('scope-editor-lbl');if(lbl)lbl.textContent='New scope';
}
function loadIntoEditor(sc){
  editingId=sc.id;
  document.getElementById('scope-name').value=sc.name||'';
  document.getElementById('scope-client').value=sc.client_id||'';
  document.getElementById('scope-site').value=sc.site||'';
  document.getElementById('scope-date').value=sc.date||'';
  document.getElementById('scope-global-notes').value=sc.global_notes||'';
  renderAreas(sc.areas||[]);
  document.getElementById('scope-name').scrollIntoView({behavior:'smooth',block:'start'});
}
function fmtDate(s){
  if(!s)return'';var d=new Date(s+'T00:00:00');
  return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear();
}
function printScope(sc){
  var html='<!DOCTYPE html><html><head><meta charset="UTF-8"><title>'+esc(sc.name||'Scope')+'</title>'+
    '<style>body{font-family:system-ui,sans-serif;color:#222;padding:32px;max-width:700px;margin:0 auto}'+
    'h1{font-size:20px;font-weight:700;margin-bottom:4px}.meta{font-size:12px;color:#666;margin-bottom:24px}'+
    '.area-name{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#888;margin:20px 0 8px}'+
    '.task{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:13px}'+
    '.check{width:12px;height:12px;border:1.5px solid #888;border-radius:2px;flex-shrink:0;margin-top:2px}'+
    '.freq{font-size:9px;font-weight:700;text-transform:uppercase;color:#888;background:#eee;padding:1px 5px;border-radius:3px;margin-left:auto;white-space:nowrap}'+
    '.notes{font-size:11px;color:#888;padding-left:20px;font-style:italic;margin-top:2px}'+
    '.global{margin-top:20px;padding-top:16px;border-top:1px solid #ddd;font-size:12px;color:#666;line-height:1.7}'+
    '.global-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#888;margin-bottom:4px}'+
    '</style></head><body>'+
    '<h1>'+esc(sc.name||'Scope of Works')+'</h1>'+
    '<div class="meta">'+(sc.client_name?esc(sc.client_name)+' · ':'')+esc(sc.site||'')+(sc.date?' · '+fmtDate(sc.date):'')+'</div>';
  (sc.areas||[]).forEach(function(a){
    html+='<div class="area-name">'+esc(a.name||'Area')+'</div>';
    (a.tasks||[]).forEach(function(t){
      html+='<div class="task"><div class="check"></div><span>'+esc(t.text||'')+'</span>'+
        '<span class="freq">'+(FREQ_LABELS[t.freq]||t.freq||'Weekly')+'</span></div>';
    });
    if(a.notes)html+='<div class="notes">'+esc(a.notes)+'</div>';
  });
  if(sc.global_notes)html+='<div class="global"><div class="global-lbl">General notes</div>'+esc(sc.global_notes)+'</div>';
  html+='</body></html>';
  var w=window.open('','_blank','width=800,height=600');
  if(w){w.document.write(html);w.document.close();w.focus();w.print();}
}
function renderScopeView(sc){
  var areas=(sc.areas||[]).map(function(a){
    var tasks=(a.tasks||[]).map(function(t){
      return '<div class="sv-task"><span class="sv-bullet">•</span>'+
        '<span class="sv-task-text'+(t.done?' done':'')+'">'+esc(t.text||'')+'</span>'+
        '<span class="sv-freq">'+(FREQ_LABELS[t.freq]||t.freq||'Weekly')+'</span></div>';
    }).join('');
    var notes=a.notes?'<div class="sv-notes">'+esc(a.notes)+'</div>':'';
    return '<div class="sv-area"><div class="sv-area-name">'+esc(a.name||'Area')+'</div>'+tasks+notes+'</div>';
  }).join('');
  var global=sc.global_notes?('<div class="sv-global"><div class="sv-global-lbl">General notes</div>'+esc(sc.global_notes)+'</div>'):'';
  return areas+global+
    '<div class="sv-footer">'+
      '<div style="display:flex;gap:8px">'+
        '<button class="sv-edit-btn" data-edit-id="'+esc(sc.id)+'">Edit this scope</button>'+
        '<button class="scope-print-btn" data-print-id="'+esc(sc.id)+'">'+
          '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>'+
          'Print / Share'+
        '</button>'+
      '</div>'+
      '<button class="ss-del" data-del-id="'+esc(sc.id)+'">Delete scope</button>'+
    '</div>';
}
function scrollToEditor(){document.getElementById('scope-editor').scrollIntoView({behavior:'smooth',block:'start'});}
function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'});}

function renderSavedList(){
  sb.from('scopes').select('id,client_id,client_name,name,site,date,global_notes,areas,created_at').order('created_at',{ascending:false}).then(function(r){
    var scopes=r.data||[];
    var list=document.getElementById('saved-scopes-list');
    if(!scopes.length){
      list.innerHTML='<div class="scope-empty-state" style="padding:48px 24px;text-align:center;color:var(--stone);font-size:13px;line-height:1.7">No saved scopes yet.<br>Use the editor below to create your first scope.</div>';
      return;
    }
    list.innerHTML=scopes.map(function(sc){
      return '<div class="ss-wrap" data-scope-id="'+esc(sc.id)+'">'+
        '<div class="ss-row"><div>'+
          '<div class="ss-name">'+esc(sc.name||'Untitled scope')+'</div>'+
          (sc.site?'<div class="ss-site">'+esc(sc.site)+'</div>':'')+
          '<div class="ss-sub">'+esc(sc.client_name||'')+'</div></div>'+
          '<div class="ss-date">'+fmtDate(sc.date)+'</div>'+
          '<div style="display:flex;align-items:center;gap:8px">'+
            '<span class="ss-arr">›</span>'+
          '</div>'+
        '</div>'+
        '<div class="ss-body"><div class="ss-inner">'+renderScopeView(sc)+'</div></div>'+
      '</div>';
    }).join('');
  });
}

function init(){
  document.getElementById('scope-editor').hidden=false;

  sb.from('clients').select('id,name,site_address').order('name').then(function(r){
    allClients=r.data||[];
    var sel=document.getElementById('scope-client');
    sel.innerHTML='<option value="">Select client…</option>';
    allClients.forEach(function(c){sel.innerHTML+='<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>';});
    sel.addEventListener('change',function(){
      var found=null;allClients.forEach(function(c){if(c.id===sel.value)found=c;});
      var siteInput=document.getElementById('scope-site');
      if(found&&found.site_address){siteInput.value=found.site_address;}
      else if(found){
        sb.from('jobs').select('site').eq('client_id',found.id).not('site','is',null).order('date',{ascending:false}).limit(1)
          .then(function(jr){siteInput.value=(jr.data&&jr.data[0])?jr.data[0].site:'';});
      } else {siteInput.value='';}
    });
  });

  document.getElementById('scope-date').valueAsDate=new Date();
  renderAreas([]);
  renderSavedList();
}

document.getElementById('scope-add-area').addEventListener('click',addArea);
document.getElementById('scope-save-btn-2').addEventListener('click',saveScope);
document.getElementById('scope-cancel-btn').addEventListener('click',function(){resetEditor();scrollToTop();});

document.getElementById('scope-areas').addEventListener('click',function(e){
var rmTask=e.target.closest('[data-rm-task]');
  if(rmTask){rmTask.closest('.sa-task').remove();return;}
  var addTask2=e.target.closest('[data-add-task]');
  if(addTask2){addTask(addTask2.closest('.scope-area'));return;}
  var rmArea=e.target.closest('[data-rm-area]');
  if(rmArea){
    rmArea.closest('.scope-area').remove();
    if(!document.querySelector('.scope-area'))
      document.getElementById('scope-areas').innerHTML='<div class="empty-areas"><p>Walk through the building and add each area below.</p></div>';
    return;
  }
});

document.getElementById('saved-scopes-list').addEventListener('click',function(e){
  var printBtn=e.target.closest('[data-print-id]');
  if(printBtn){
    var id=printBtn.dataset.printId;
    sb.from('scopes').select('id,client_id,client_name,name,site,date,global_notes,areas').eq('id',id).single().then(function(r){
      if(r.data)printScope(r.data);
    });
    return;
  }
  var delBtn=e.target.closest('[data-del-id]');
  if(delBtn){
    if(!confirm('Delete this scope?'))return;
    var id=delBtn.dataset.delId;
    sb.from('scopes').delete().eq('id',id).then(function(){
      if(editingId===id)resetEditor();
      renderSavedList();
    });
    return;
  }
  var editBtn=e.target.closest('[data-edit-id]');
  if(editBtn){
    var lbl=document.getElementById('scope-editor-lbl');if(lbl)lbl.textContent='Edit scope';
    sb.from('scopes').select('id,client_id,client_name,name,site,date,global_notes,areas,created_at').eq('id',editBtn.dataset.editId).single().then(function(r){
      if(r.data){loadIntoEditor(r.data);scrollToEditor();}
    });
    return;
  }
  var row=e.target.closest('.ss-row');
  if(row){
    var wrap=row.closest('.ss-wrap');
    var body=wrap.querySelector('.ss-body');
    var isOpen=wrap.classList.contains('open');
    document.querySelectorAll('.ss-wrap.open').forEach(function(w){w.classList.remove('open');w.querySelector('.ss-body').classList.remove('open');});
    if(!isOpen){wrap.classList.add('open');body.classList.add('open');}
  }
});

document.addEventListener('keydown',function(e){if(e.key==='Escape')document.activeElement.blur();});

var bnavMore=document.getElementById('bnav-more');
var bnavSheet=document.getElementById('bnav-sheet');
var bnavBg=document.getElementById('bnav-bg');
function bnavClose(){bnavSheet.classList.remove('open');bnavBg.classList.remove('open');}
if(bnavMore)bnavMore.addEventListener('click',function(){var o=bnavSheet.classList.contains('open');o?bnavClose():(bnavSheet.classList.add('open'),bnavBg.classList.add('open'));});
if(bnavBg)bnavBg.addEventListener('click',bnavClose);

init();

function setBadge(id,n){var el=document.getElementById(id);if(!el)return;if(n>0){el.textContent=n>9?'9+':String(n);el.classList.add('show');}else el.classList.remove('show');}
function refreshAllBadges(){
  function _d(dt){var m=dt.getMonth()+1,dy=dt.getDate();return dt.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dy<10?'0':'')+dy;}
  var today=new Date();today.setHours(0,0,0,0);
  var cutoff=new Date(today);cutoff.setDate(cutoff.getDate()+60);
  var todayStr=_d(today),cutoffStr=_d(cutoff);
  MQ.sb.from('inquiries').select('id',{count:'exact',head:true}).eq('status','new').then(function(r){var n=r.count||0;setBadge('inq-notif',n);setBadge('bnav-inq-notif',n);});
  MQ.sb.from('jobs').select('id',{count:'exact',head:true}).neq('status','completed').lte('date',todayStr).then(function(r){var n=r.count||0;setBadge('jobs-notif',n);setBadge('bnav-jobs-notif',n);});
  MQ.sb.from('staff').select('id,police_check_expiry,insurance_expiry').eq('status','active').then(function(r){var n=(r.data||[]).filter(function(s){return (s.police_check_expiry&&s.police_check_expiry<=cutoffStr)||(s.insurance_expiry&&s.insurance_expiry<=cutoffStr);}).length;setBadge('staff-notif',n);setBadge('bnav-staff-notif',n);});
}
setTimeout(refreshAllBadges,0);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refreshAllBadges();});
}); // end requireAuth
})();
</script>
</body>
</html>
