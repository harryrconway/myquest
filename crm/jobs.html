<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Jobs — MyQuest CRM</title>
<link rel="stylesheet" href="style.css?v=20260817">
<style>
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:22px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.f-pill{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;border:1.5px solid var(--hair-md);background:none;color:var(--stone);cursor:pointer;font-family:var(--font);transition:color .12s,background .12s,border-color .12s}
.f-pill:hover{color:var(--navy);border-color:rgba(35,44,84,.2)}
.f-pill.on{color:var(--navy);background:rgba(35,44,84,.07);border-color:rgba(35,44,84,.18)}

.job-list{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);overflow:hidden}
.jl-head{display:grid;grid-template-columns:80px .7fr .8fr 100px 64px 1.2fr auto 28px;gap:12px;padding:10px 20px;border-bottom:1px solid var(--hair)}
.jl-head span{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone)}
.jl-row{
  display:grid;grid-template-columns:80px .7fr .8fr 100px 64px 1.2fr auto 28px;
  gap:12px;padding:13px 20px;align-items:center;
  border-bottom:1px solid var(--hair);
  border-left:3px solid transparent;
  transition:background .1s;cursor:pointer;
}
.xp-wrap:last-child>.jl-row{border-bottom:none}
.jl-row:hover{background:rgba(35,44,84,.03)}
.jl-row.done{border-left-color:var(--green)}
.jl-row.next{border-left-color:var(--navy)}
.jl-date{font-size:12px;color:var(--stone);font-variant-numeric:tabular-nums;line-height:1.4}
.jl-num{display:block;font-size:9px;font-weight:700;letter-spacing:.05em;color:var(--stone);opacity:.55;margin-bottom:2px}
.jl-time{display:block;font-size:10px;font-weight:600;color:var(--navy);margin-top:2px}
.jl-time--empty{color:var(--stone);font-weight:400;opacity:.55}
.jl-client{font-size:13px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jl-site{font-size:12px;color:var(--stone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jl-type{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--stone);background:rgba(35,44,84,.07);padding:2px 7px;border-radius:4px;white-space:nowrap;display:inline-block;justify-self:center;align-self:center}
.jl-type.deep{color:var(--navy);background:rgba(35,44,84,.12)}
.jl-crew{display:flex;gap:4px;min-width:0;overflow:hidden}
.jl-scope-chip{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 6px;border-radius:4px;white-space:nowrap;align-self:center;justify-self:center;color:var(--green);background:var(--green-bg)}
.jl-scope-chip.no-scope{color:var(--stone);background:rgba(35,44,84,.06);font-weight:600}
.jl-crew-name{font-size:12px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.jl-price{font-size:13px;font-weight:600;color:var(--navy);font-variant-numeric:tabular-nums;text-align:right}
.jl-arr{color:var(--stone);display:flex;align-items:center;justify-content:flex-end}
.jl-row:hover .jl-arr{color:var(--navy)}
.jl-arr svg{transition:transform .22s}
.xp-wrap.open .jl-arr svg{transform:rotate(90deg)}
.xp-body{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.4,0,.2,1);border-bottom:1px solid var(--hair)}
.xp-body.open{max-height:900px}
.xp-wrap:last-child .xp-body{border-bottom:none}
.xp-wrap:last-child .xp-body.open{border-top:1px solid var(--hair)}
.xp-inner{padding:20px 24px 22px;background:var(--field)}
.xp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;margin-bottom:18px}
.xp-lbl{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);margin-bottom:3px}
.xp-val{font-size:13px;color:var(--navy)}
.xp-actions{display:flex;gap:8px;flex-wrap:wrap;padding-top:16px;border-top:1px solid var(--hair)}
.xp-btn{padding:7px 14px;border-radius:var(--r-sm);border:1.5px solid var(--hair-md);background:none;font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--navy);cursor:pointer;transition:background .12s,border-color .12s}
.xp-btn:hover{background:rgba(35,44,84,.06);border-color:rgba(35,44,84,.2)}
.xp-btn.primary{background:var(--navy);color:var(--on);border-color:var(--navy)}
.xp-btn.primary:hover{background:var(--navy-deep)}
.xp-btn.danger{color:#fff;background:var(--red);border-color:var(--red)}
.xp-btn.danger:hover{background:#8a3126;border-color:#8a3126}
.xp-quote{border-left:3px solid var(--navy);background:var(--card);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:18px}
.xp-quote-hd{font-size:9px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--navy);margin-bottom:12px}
.xp-quote-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px}
.xp-quote-cell{display:flex;flex-direction:column;gap:2px}
.xp-quote-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--stone)}
.xp-quote-val{font-size:13px;color:var(--navy)}
.xp-quote-price{font-size:20px;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.xp-quote-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.xp-quote-pill{font-size:11px;font-weight:600;color:var(--navy);background:rgba(35,44,84,.07);border-radius:5px;padding:2px 8px}
@media(max-width:600px){.xp-quote-grid{grid-template-columns:1fr}}

.search-wrap{position:relative;flex:1;min-width:160px;max-width:280px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--stone);pointer-events:none}
.search{width:100%;padding:9px 12px 9px 34px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-sm);font-family:var(--font);font-size:13px;color:var(--navy);outline:none;transition:border-color .12s}
.search::placeholder{color:var(--stone)}
.search:focus{border-color:var(--hair-md)}

@media(max-width:1000px){
  .jl-head,.jl-row{grid-template-columns:80px 1fr 100px 64px 80px}
  .jl-head span:nth-child(3),.jl-row .jl-site,
  .jl-head span:nth-child(6),.jl-row .jl-crew,
  .jl-head span:nth-child(8),.jl-row .jl-arr{display:none}
}
@media(max-width:700px){
  .jl-head,.jl-row{grid-template-columns:72px 1fr auto}
  .jl-head span:nth-child(4),.jl-head span:nth-child(5),.jl-row .jl-type,.jl-row .jl-scope-chip{display:none}
}
</style>
</head>

<script>
(function(){
'use strict';
window.MQ.requireAuth(function(){
var sb=MQ.sb;
var ARR='<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>';
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function getParam(name){var m=(window.location.search||'').match(new RegExp('[?&]'+name+'=([^&]*)'));return m?decodeURIComponent(m[1]):null;}
function iso(d){var m=d.getMonth()+1,dy=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dy<10?'0':'')+dy;}
var todayStr=iso(new Date());
function isOverdue(j){return j.status==='upcoming'&&j.date<todayStr;}
function isToday(j){return j.status==='upcoming'&&j.date===todayStr;}
var activeFilter='all',searchTerm='',openId=null,editingJobId=null;
var allJobs=[],allClients=[],allStaff=[],jobsWithScope=new Set();
var TYPE_LABELS={maintenance:'Maintenance',deep:'Deep clean',window:'Window clean',builders:'Builders clean'};
var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var REPEAT_OPTS=[['none','Does not repeat'],['weekly','Weekly'],['fortnightly','Fortnightly'],['monthly','Monthly']];
var editingJobRepeat=null;
function fmtDate(s){if(!s)return'—';var d=new Date(s+'T00:00:00');return d.getDate()+' '+MONTHS[d.getMonth()]+'<br>'+DAYS[d.getDay()];}
function fmtDateFull(s){if(!s)return'—';var d=new Date(s+'T00:00:00');return d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear()+' · '+DAYS[d.getDay()];}
function fmtTime(t){if(!t)return'';var p=t.split(':');var h=parseInt(p[0]);var m=p[1];var ampm=h>=12?'pm':'am';return(h%12||12)+':'+m+' '+ampm;}

function hasScope(j){return jobsWithScope.has(j.id)||(j.source_job_id&&jobsWithScope.has(j.source_job_id));}

function renderExpand(j){
  var typeLbl=TYPE_LABELS[j.type]||esc(j.type||'');
  var actions='';
  if(j.status==='upcoming')actions='<button class="xp-btn primary" data-action="completed">Mark as completed</button>';
  else actions='<button class="xp-btn" data-action="upcoming">Mark as upcoming</button>';
  actions='<button class="xp-btn" data-action="edit">Edit job</button>'+actions;
  var scopeJobId=(j.from_schedule&&j.source_job_id)?j.source_job_id:j.id;
  actions+='<button class="xp-btn" data-action="scope" data-scope-job="'+esc(scopeJobId)+'">'+(hasScope(j)?'View scope':'Add scope')+'</button>';
  actions+='<button class="xp-btn danger" data-action="delete">Delete job</button>';
  var cur=j.repeat||'none';
  if(j.from_schedule&&j.source_job_id){allJobs.forEach(function(t){if(t.id===j.source_job_id)cur=t.repeat||'none';});}
  var repeatLbl=(REPEAT_OPTS.find(function(o){return o[0]===cur;})||['none','—'])[1];
  var repeatRow='<div><div class="xp-lbl">Repeat</div><div class="xp-val">'+esc(repeatLbl)+'</div></div>';
  var teamRow='<div><div class="xp-lbl">Team member</div><div class="xp-val">'+esc(j.assigned_staff_name||'—')+'</div></div>';
  var quotePanel='';
  if(j.quoted_price){
    var ADDON_MAP={windows:'Internal windows',ext_windows:'External windows',high_dust:'High-dusting',kitchen_deep:'Kitchen deep clean'};
    var addonArr=Array.isArray(j.extras)&&j.extras.length?j.extras:[];
    var addonPills=addonArr.length?addonArr.map(function(k){return'<span class="xp-quote-pill">'+esc(ADDON_MAP[k]||k)+'</span>';}).join(''):'<span style="font-size:12px;color:var(--stone)">None</span>';
    var floorSqm=(j.sqm||'—')+' sqm'+(j.floors>1?' · '+j.floors+' floors':'');
    var bathKitch=(j.baths||'—')+' bathroom'+(j.baths===1?'':'s')+(j.kitchen?' · Kitchenette':'');
    quotePanel=
      '<div class="xp-quote">'+
        '<div class="xp-quote-hd">Quote details</div>'+
        '<div class="xp-quote-grid">'+
          '<div class="xp-quote-cell"><div class="xp-quote-lbl">Per-visit price</div><div class="xp-quote-price">$'+j.quoted_price.toFixed(2)+'</div></div>'+
          '<div class="xp-quote-cell"><div class="xp-quote-lbl">Est. hours</div><div class="xp-quote-val">'+Number(j.quoted_hrs).toFixed(1)+' hrs</div></div>'+
          '<div class="xp-quote-cell"><div class="xp-quote-lbl">Floor area</div><div class="xp-quote-val">'+floorSqm+'</div></div>'+
          '<div class="xp-quote-cell"><div class="xp-quote-lbl">Bathrooms</div><div class="xp-quote-val">'+bathKitch+'</div></div>'+
          (j.after_hours_pct?'<div class="xp-quote-cell"><div class="xp-quote-lbl">After-hours loading</div><div class="xp-quote-val">+'+j.after_hours_pct+'% on labour</div></div>':'')+(j.buffer?'<div class="xp-quote-cell"><div class="xp-quote-lbl">Site allowance</div><div class="xp-quote-val">+15% applied</div></div>':'')+(j.consumables?'<div class="xp-quote-cell"><div class="xp-quote-lbl">Consumables</div><div class="xp-quote-val">Included</div></div>':'')+
          '<div class="xp-quote-cell" style="grid-column:1/-1"><div class="xp-quote-lbl">Add-ons</div><div class="xp-quote-pills">'+addonPills+'</div></div>'+
        '</div>'+
      '</div>';
  }
  return quotePanel+'<div class="xp-grid">'+
    '<div style="grid-column:1/-1"><div class="xp-lbl">Date &amp; time</div><div class="xp-val" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">'+fmtDateFull(j.date)+(j.start_time?' · '+fmtTime(j.start_time):'')+(j.job_number?'<span style="font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--stone);background:rgba(35,44,84,.07);padding:2px 7px;border-radius:4px">Job #'+String(j.job_number).padStart(3,'0')+'</span>':'')+'</div></div>'+
    '<div><div class="xp-lbl">Client</div><div class="xp-val">'+esc(j.client_name||'—')+'</div></div>'+
    '<div><div class="xp-lbl">Type</div><div class="xp-val">'+typeLbl+'</div></div>'+
    teamRow+repeatRow+
    '<div style="grid-column:1/-1"><div class="xp-lbl">Site</div><div class="xp-val">'+esc(j.site||'—')+'</div></div>'+
    '</div><div class="xp-actions">'+actions+'</div>';
}
function renderRow(j){
  var isOpen=openId===j.id;
  var typeLbl=TYPE_LABELS[j.type]||esc(j.type||'');
  var badge=j.status==='completed'?'<span class="badge completed">Completed</span>':isOverdue(j)?'<span class="badge overdue">Overdue</span>':isToday(j)?'<span class="badge today">Today</span>':'<span class="badge upcoming">Upcoming</span>';
  var crewHtml='';
  if(j.assigned_staff_name){
    crewHtml='<span class="jl-crew-name">'+esc(j.assigned_staff_name)+'</span>';
  }
  return '<div class="xp-wrap'+(isOpen?' open':'')+'" data-id="'+esc(j.id)+'">'+
    '<div class="jl-row'+(j.status==='completed'?' done':' next')+'" data-type="'+j.type+'" data-status="'+j.status+'">'+
      '<div class="jl-date">'+(j.job_number?'<span class="jl-num">#'+String(j.job_number).padStart(3,'0')+'</span>':'')+fmtDate(j.date)+'<span class="jl-time'+(j.start_time?'':' jl-time--empty')+'">'+(j.start_time?fmtTime(j.start_time):'—')+'</span></div>'+
      '<div class="jl-client">'+esc(j.client_name||'—')+'</div>'+
      '<div class="jl-site">'+esc(j.site||'—')+'</div>'+
      '<span class="jl-type'+(j.type==='deep'?' deep':'')+'">'+typeLbl+'</span>'+
      '<span class="jl-scope-chip'+(hasScope(j)?'':' no-scope')+'">'+(hasScope(j)?'Scope':'No scope')+'</span>'+
      '<div class="jl-crew">'+crewHtml+'</div>'+badge+
      '<div class="jl-arr">'+ARR+'</div>'+
    '</div>'+
    '<div class="xp-body'+(isOpen?' open':'')+'"><div class="xp-inner">'+renderExpand(j)+'</div></div>'+
  '</div>';
}

function renderAll(){
  var jobs=allJobs.slice();
  jobs.sort(function(a,b){
    var ao=isOverdue(a),bo=isOverdue(b);
    var au=a.status==='upcoming'&&!ao,bu=b.status==='upcoming'&&!bo;
    if(ao&&!bo)return -1;if(!ao&&bo)return 1;
    if(ao&&bo)return a.date<b.date?-1:a.date>b.date?1:0;
    if(au&&!bu)return -1;if(!au&&bu)return 1;
    if(au&&bu)return a.date<b.date?-1:a.date>b.date?1:0;
    return a.date>b.date?-1:a.date<b.date?1:0;
  });
  var overdue=jobs.filter(function(j){return isOverdue(j);});
  var todayJobs=jobs.filter(function(j){return isToday(j);});
  var trueUpcoming=jobs.filter(function(j){return j.status==='upcoming'&&!isOverdue(j)&&!isToday(j);});
  var completed=jobs.filter(function(j){return j.status==='completed';});
  var nxt7=iso(new Date(Date.now()+7*86400000));
  var thisWeek=jobs.filter(function(j){return j.status==='upcoming'&&!isOverdue(j)&&j.date>todayStr&&j.date<=nxt7;}).length;
  var statsEl=document.querySelector('.stats');
  if(statsEl)statsEl.innerHTML=
    '<div class="stat'+(overdue.length>0?' stat-warn':'')+'"><div class="stat-lbl">Overdue</div><div class="stat-val">'+overdue.length+'</div><div class="stat-hint">'+(overdue.length===1?'Needs attention':'Need attention')+'</div></div>'+
    '<div class="stat'+(todayJobs.length>0?' stat-today':'')+'"><div class="stat-lbl">Today</div><div class="stat-val">'+todayJobs.length+'</div><div class="stat-hint">This week: '+thisWeek+'</div></div>'+
    '<div class="stat"><div class="stat-lbl">Upcoming</div><div class="stat-val">'+trueUpcoming.length+'</div><div class="stat-hint">All future jobs</div></div>'+
    '<div class="stat"><div class="stat-lbl">Completed</div><div class="stat-val">'+completed.length+'</div><div class="stat-hint">All time</div></div>';
  var html='';
  jobs.forEach(function(j){
    var mf=activeFilter==='all'||(activeFilter==='overdue'&&isOverdue(j))||(activeFilter==='today'&&isToday(j))||(activeFilter==='upcoming'&&j.status==='upcoming'&&!isOverdue(j)&&!isToday(j))||(activeFilter==='completed'&&j.status==='completed')||activeFilter===j.type;
    var ms=!searchTerm||(j.client_name+' '+(j.site||'')).toLowerCase().indexOf(searchTerm)!==-1;
    if(mf&&ms)html+=renderRow(j);
  });
  document.getElementById('jl-body').innerHTML=html||'<div style="padding:28px 20px;color:var(--stone);font-size:13px">No jobs match your filter.</div>';
}
function reload(cb){
  sb.from('jobs').select('id,client_id,client_name,date,start_time,type,status,site,repeat,source_job_id,from_schedule,assigned_staff_id,assigned_staff_name,job_number,sqm,floors,baths,kitchen,after_hours_pct,extras,consumables,quoted_price,quoted_hrs,buffer').then(function(r){allJobs=r.data||[];renderAll();if(cb)cb();});
}

var pills=document.querySelectorAll('.f-pill');
pills.forEach(function(p){
  p.addEventListener('click',function(){
    pills.forEach(function(x){x.classList.remove('on');});
    this.classList.add('on');activeFilter=this.getAttribute('data-filter');renderAll();
  });
});

var modal=document.getElementById('job-modal');
function openModal(j){
  editingJobId=j?j.id:null;
  document.querySelector('#job-modal .modal-title').textContent=j?'Edit job':'New job';
  document.getElementById('job-modal-save').textContent=j?'Save changes':'Add job';
  var sel=document.getElementById('jf-client');
  sel.innerHTML='<option value="">Select client…</option>';
  allClients.forEach(function(c){sel.innerHTML+='<option value="'+esc(c.id)+'">'+esc(c.name)+'</option>';});
  sel.addEventListener('change',function(){
    var found=null;allClients.forEach(function(c){if(c.id===sel.value)found=c;});
    var siteEl=document.getElementById('jf-site');
    if(!siteEl.value&&found&&found.site_address)siteEl.value=found.site_address;
  });
  var staffSel=document.getElementById('jf-staff');
  var MODAL_STAFF_STATUS={active:'Active','on-leave':'On leave',left:'Resigned'};
  staffSel.innerHTML='<option value="">No team member</option>';
  allStaff.forEach(function(s){
    staffSel.innerHTML+='<option value="'+esc(s.id)+'">'+esc(s.name)+' — '+(MODAL_STAFF_STATUS[s.status]||s.status)+'</option>';
  });
  var repeatRow=document.getElementById('jf-repeat-row');
  var repeatSel=document.getElementById('jf-repeat');
  if(j){
    document.getElementById('jf-date').value=j.date||'';
    document.getElementById('jf-time').value=j.start_time||'';
    sel.value=j.client_id||'';
    document.getElementById('jf-site').value=j.site||'';
    document.getElementById('jf-type').value=j.type||'maintenance';
    document.getElementById('jf-status').value=j.status||'upcoming';
    staffSel.value=j.assigned_staff_id||'';
    if(j.from_schedule){
      repeatRow.hidden=true;editingJobRepeat=null;
    } else {
      repeatRow.hidden=false;repeatSel.value=j.repeat||'none';editingJobRepeat=j.repeat||'none';
    }
  } else {
    document.getElementById('jf-date').valueAsDate=new Date();
    document.getElementById('jf-time').value='';
    repeatRow.hidden=false;repeatSel.value='none';editingJobRepeat=null;
  }
  modal.hidden=false;
  setTimeout(function(){document.getElementById(j?'jf-date':'jf-client').focus();},40);
}
function closeModal(){
  modal.hidden=true;editingJobId=null;
  document.querySelector('#job-modal .modal-title').textContent='New job';
  document.getElementById('job-modal-save').textContent='Add job';
  ['jf-date','jf-time','jf-site'].forEach(function(id){var el=document.getElementById(id);if(el)el.value='';});
}
document.getElementById('new-job-btn').addEventListener('click',function(){openModal();});
document.getElementById('job-modal-close').addEventListener('click',closeModal);
document.getElementById('job-modal-cancel').addEventListener('click',closeModal);
modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(!modal.hidden){closeModal();return;}
  if(openId){var prev=document.querySelector('.xp-wrap[data-id="'+openId+'"]');if(prev){prev.classList.remove('open');prev.querySelector('.xp-body').classList.remove('open');}openId=null;}
});

document.getElementById('job-modal-save').addEventListener('click',function(){
  var date=document.getElementById('jf-date').value;
  if(!date){document.getElementById('jf-date').focus();return;}
  var sel=document.getElementById('jf-client');
  if(!sel.value){sel.focus();return;}
  var clientName=sel.selectedIndex>0?sel.options[sel.selectedIndex].text:'';
  var site=document.getElementById('jf-site').value.trim();
  var staffEl=document.getElementById('jf-staff');
  var staffId=staffEl.value||null;
  var staffName=null;if(staffId)allStaff.forEach(function(s){if(s.id===staffId)staffName=s.name;});
  var timeVal=document.getElementById('jf-time').value||null;
  var newRepeat=document.getElementById('jf-repeat').value||'none';
  var repeatChanged=editingJobRepeat!==null&&newRepeat!==editingJobRepeat;
  var row={date:date,start_time:timeVal,client_id:sel.value,client_name:clientName,site:site,
    type:document.getElementById('jf-type').value,status:document.getElementById('jf-status').value,
    assigned_staff_id:staffId,assigned_staff_name:staffName,
    repeat:newRepeat!=='none'?newRepeat:null};
  var savBtn=document.getElementById('job-modal-save');
  savBtn.disabled=true;savBtn.textContent='Saving…';
  if(editingJobId){
    sb.from('jobs').update(row).eq('id',editingJobId).then(function(r){
      savBtn.disabled=false;savBtn.textContent='Save changes';
      if(r&&r.error){alert('Save failed: '+r.error.message);return;}
      if(site){var found=null;allClients.forEach(function(c){if(c.id===sel.value&&!c.site_address)found=c;});
        if(found)sb.from('clients').update({site_address:site}).eq('id',found.id);}
      closeModal();
      if(repeatChanged){
        var td=iso(new Date());
        sb.from('jobs').delete().eq('source_job_id',editingJobId).gt('date',td).then(function(dr){
          if(dr&&dr.error){alert('Could not clear old instances: '+dr.error.message);return;}
          reload(function(){if(newRepeat&&newRepeat!=='none'&&window.mqGenerate)window.mqGenerate().then(reload);});
        });
      } else {
        reload(function(){if(newRepeat&&newRepeat!=='none'&&window.mqGenerate)window.mqGenerate().then(reload);});
      }
    });
  } else {
    sb.from('jobs').insert(row).then(function(r){
      savBtn.disabled=false;savBtn.textContent='Add job';
      if(r&&r.error){alert('Save failed: '+r.error.message);return;}
      if(site){var found=null;allClients.forEach(function(c){if(c.id===sel.value&&!c.site_address)found=c;});
        if(found)sb.from('clients').update({site_address:site}).eq('id',found.id);}
      closeModal();
      reload(function(){if(newRepeat&&newRepeat!=='none'&&window.mqGenerate)window.mqGenerate().then(reload);});
    });
  }
});

function updateJobStatus(id,newStatus){
  sb.from('jobs').update({status:newStatus}).eq('id',id).then(function(){
    allJobs.forEach(function(j){if(j.id===id)j.status=newStatus;});renderAll();
  });
}
function deleteJob(id){
  if(!confirm('Delete this job? This cannot be undone.'))return;
  // Also delete generated instances (source_job_id match)
  sb.from('jobs').delete().eq('source_job_id',id).then(function(){
    sb.from('jobs').delete().eq('id',id).then(function(){openId=null;reload();});
  });
}

document.getElementById('jl-body').addEventListener('click',function(e){
  var actionEl=e.target.closest('[data-action]');
  if(actionEl){
    var wid=actionEl.closest('.xp-wrap').dataset.id;
    var act=actionEl.dataset.action;
    if(act==='delete')deleteJob(wid);
    else if(act==='edit'){var found=null;allJobs.forEach(function(x){if(x.id===wid)found=x;});if(found)openModal(found);}
    else if(act==='scope'){window.location.href='scope.html?job_id='+encodeURIComponent(actionEl.dataset.scopeJob||wid);}
    else updateJobStatus(wid,act);
    return;
  }
  var row=e.target.closest('.jl-row');
  if(!row)return;
  var wrap=row.parentElement;
  var id=wrap.dataset.id;
  if(openId===id){wrap.classList.remove('open');wrap.querySelector('.xp-body').classList.remove('open');openId=null;}
  else{
    if(openId){var prev=document.querySelector('.xp-wrap[data-id="'+openId+'"]');if(prev){prev.classList.remove('open');prev.querySelector('.xp-body').classList.remove('open');}}
    wrap.classList.add('open');wrap.querySelector('.xp-body').classList.add('open');openId=id;
  }
});

var mob=document.getElementById('mob-menu');
var mOverlay=document.getElementById('mob-overlay');
function navClose(){document.body.classList.remove('mob-open');}
if(mob)mob.addEventListener('click',function(){document.body.classList.toggle('mob-open');});
if(mOverlay)mOverlay.addEventListener('click',function(e){if(!e.target.closest('.mob-nav-links')||e.target.tagName==='A')navClose();});
var searchEl=document.getElementById('job-search');
if(searchEl)searchEl.addEventListener('input',function(){searchTerm=this.value.trim().toLowerCase();renderAll();});

// Initial load
Promise.all([
  sb.from('clients').select('id,name,site_address').order('name'),
  sb.from('staff').select('id,name,status').order('name')
]).then(function(results){
  allClients=results[0].data||[];
  allStaff=results[1].data||[];
  sb.from('jobs').select('id,client_id,client_name,date,start_time,type,status,site,repeat,source_job_id,from_schedule,assigned_staff_id,assigned_staff_name,job_number,sqm,floors,baths,kitchen,after_hours_pct,extras,consumables,quoted_price,quoted_hrs,buffer').then(function(jr){
    allJobs=jr.data||[];
    sb.from('scopes').select('job_id').not('job_id','is',null).then(function(sr){
      (sr.data||[]).forEach(function(s){if(s.job_id)jobsWithScope.add(s.job_id);});
      renderAll();
    });

MQ.sb.from('inquiries').select('id',{count:'exact',head:true}).eq('status','new').then(function(r){
  var n=r.count||0;['inq-notif','mob-inq-notif'].forEach(function(id){var el=document.getElementById(id);if(!el)return;if(n>0){el.textContent=n>9?'9+':String(n);el.classList.add('show');}else el.classList.remove('show');});
});
if(window.mqGenerate)window.mqGenerate().then(function(){sb.from('jobs').select('id,client_id,client_name,date,start_time,type,status,site,repeat,source_job_id,from_schedule,assigned_staff_id,assigned_staff_name,job_number,sqm,floors,baths,kitchen,after_hours_pct,extras,consumables,quoted_price,quoted_hrs,buffer').then(function(r2){allJobs=r2.data||[];renderAll();});});
    var jobParam=getParam('job');
    if(jobParam){setTimeout(function(){var w=document.querySelector('.xp-wrap[data-id="'+jobParam+'"]');if(w){w.scrollIntoView({behavior:'smooth',block:'center'});w.classList.add('open');var body=w.querySelector('.xp-body');if(body)body.classList.add('open');openId=jobParam;}},80);}
    if(getParam('newjob')==='1'){
      openModal();
      var cid=getParam('cid');
      if(cid){
        setTimeout(function(){
          document.getElementById('jf-client').value=cid;
          var found=null;allClients.forEach(function(c){if(c.id===cid)found=c;});
          if(found&&found.site_address)document.getElementById('jf-site').value=found.site_address;
        },50);
      }
    }
  });
});

}); // end requireAuth
})();
</script>
