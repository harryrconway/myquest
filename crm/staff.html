<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href=/favicon.svg type="image/svg+xml"><link rel="icon" href=/favicon.ico sizes=any>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Staff — MyQuest CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Chango&family=DynaPuff:wght@400..700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=20260917">
<style>
.staff-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.staff-card{background:var(--card);border-radius:var(--r);border:1px solid var(--hair);padding:22px;cursor:pointer;transition:box-shadow .14s,border-color .14s}
.staff-card:hover{box-shadow:0 0 0 2px rgba(0,0,0,.12);border-color:rgba(0,0,0,.2)}
.sc-top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.sc-av{
  width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.1);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:var(--navy);flex-shrink:0;letter-spacing:.02em;
}
.sc-name{font-size:14px;font-weight:600;color:var(--navy);margin-bottom:3px;letter-spacing:-.01em}
.sc-role{font-size:12px;color:var(--stone)}
.sc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--hair)}
.sc-lbl{font-size:12px;color:var(--stone)}
.sc-val{font-size:12.5px;font-weight:600;color:var(--navy)}
.sc-tenure{color:var(--stone);font-weight:400}
.sc-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.f-pill{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.01em;border:1.5px solid var(--hair-md);background:none;color:var(--stone);cursor:pointer;font-family:var(--font);transition:color .12s,background .12s,border-color .12s}
.f-pill:hover{color:var(--navy);border-color:rgba(0,0,0,.2)}
.f-pill.on{color:var(--navy);background:rgba(0,0,0,.07);border-color:rgba(0,0,0,.18)}
.search-wrap{position:relative;flex:1;min-width:160px;max-width:280px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--stone);pointer-events:none}
.search{width:100%;padding:9px 12px 9px 34px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-sm);font-family:var(--font);font-size:13px;color:var(--navy);outline:none;transition:border-color .12s}
.search::placeholder{color:var(--stone)}
.search:focus{border-color:var(--hair-md)}
/* Staff modal section headers */
.sf-sec{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--stone);padding-top:16px;margin:4px 0 14px;border-top:1px solid var(--hair)}
/* Document upload/view buttons */
.sf-doc-view,.sf-doc-upload{font-size:11.5px;font-weight:500;color:var(--navy);background:none;border:1.5px solid var(--hair-md);border-radius:7px;padding:4px 10px;cursor:pointer;font-family:var(--font);transition:border-color .12s,color .12s;white-space:nowrap}
.sf-doc-upload{color:var(--stone)}
.sf-doc-view:hover,.sf-doc-upload:hover{border-color:rgba(0,0,0,.25);color:var(--navy)}
.sf-doc-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sc-roster-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair)}
.sc-roster-period{flex:1;font-family:var(--font);font-size:12px;color:var(--stone);border:1px solid var(--hair-md);border-radius:6px;padding:6px 8px;background:var(--field);cursor:pointer}
.sc-roster-btn{font-size:12px;font-weight:600;color:var(--stone);cursor:pointer;transition:color .12s;letter-spacing:.01em;background:none;border:none;font-family:var(--font);white-space:nowrap;padding:6px 10px}
.sc-roster-btn:hover{color:var(--navy)}
.rp-page{padding:24px 24px 8px}
.rp-sub{font-size:13px;color:var(--stone);margin-bottom:6px}
.rp-count{display:inline-block;font-size:12px;font-weight:600;color:var(--green);background:var(--green-bg);padding:3px 10px;border-radius:999px;margin-bottom:20px}
.rp-day-block{margin-bottom:20px}
.rp-day-hd{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--stone);margin-bottom:6px;padding-bottom:6px;border-bottom:1.5px solid var(--hair)}
.rp-no-jobs{font-size:12px;color:var(--stone);opacity:.5;padding:4px 0}
.rp-job-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--hair)}
.rp-job-row:last-child{border-bottom:none}
.rp-job-row.done{opacity:.4}
.rp-job-time{font-size:13px;font-weight:700;color:var(--navy);white-space:nowrap;line-height:1.4}
.rp-job-name{font-size:13px;font-weight:600;color:var(--navy);line-height:1.3}
.rp-job-addr{font-size:11px;color:var(--stone);margin-top:2px;line-height:1.4}
.rp-job-done{font-size:10px;color:var(--green);font-weight:700;letter-spacing:.06em;margin-top:3px}
.rp-job-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.rp-job-type{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:5px;white-space:nowrap}
.rp-job-num{font-size:10px;color:var(--stone);opacity:.6;white-space:nowrap}
@media print{
  body>*:not(#roster-modal){display:none!important}
  #roster-modal{position:static!important;background:none!important;padding:0!important;display:block!important}
  #roster-modal .modal-card{box-shadow:none!important;max-width:100%!important;border-radius:0!important;background:#fff!important}
  #roster-modal .modal-hd{display:none!important}
  .rp-page{padding:0;background:#fff}
  .rp-sub,.rp-day-hd,.rp-no-jobs,.rp-job-time,.rp-job-name,.rp-job-addr,.rp-job-type,.rp-job-num{color:#000!important}
  .rp-job-type{background:none!important;border:1px solid #ccc}
  .rp-job-num{opacity:1!important}
  .rp-job-row.done{opacity:1!important}
  .rp-day-hd{border-bottom-color:#000!important}
}
</style>
</head>
<body>

      <a class="sb-item" href="jobs.html">

    <div class="sb-bottom">
      <button class="sb-item" onclick="MQ&&MQ.signOut()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </aside>

  <main class="main">

    <div class="ph pg-1">
      <h1 class="ph-title">Staff</h1>
      <button class="ph-btn" id="new-staff-btn">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add staff
      </button>
    </div>

    <div class="stats pg-2">
      <div class="stat">
        <div class="stat-lbl">Total staff</div>
        <div class="stat-val">0</div>
        <div class="stat-hint">0 active</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Active</div>
        <div class="stat-val">0</div>
        <div class="stat-hint">On the team</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">Roles</div>
        <div class="stat-val">0</div>
        <div class="stat-hint">Distinct roles</div>
      </div>
      <div class="stat">
        <div class="stat-lbl">New this year</div>
        <div class="stat-val">0</div>
        <div class="stat-hint">Joined in 2026</div>
      </div>
    </div>

    <div class="toolbar pg-3">
      <div class="search-wrap">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search" type="text" id="staff-search" placeholder="Search staff…" autocomplete="off">
      </div>
      <div class="filters">
        <button class="f-pill on" data-sf="all">All</button>
        <button class="f-pill" data-sf="active">Active</button>
        <button class="f-pill" data-sf="on-leave">On leave</button>
        <button class="f-pill" data-sf="left">Resigned</button>
      </div>
    </div>
    <div class="staff-grid pg-3" id="staff-grid"></div>
  </main>
</div>

<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="7" x2="16" y2="7"/><line x1="8" y1="12" x2="9" y2="12"/><line x1="12" y1="12" x2="13" y2="12"/><line x1="16" y1="12" x2="17" y2="12"/><line x1="8" y1="16" x2="9" y2="16"/><line x1="12" y1="16" x2="13" y2="16"/><line x1="16" y1="16" x2="17" y2="16"/></svg>Calculator</a><a href="reports.html" class="bnav-si"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>Reports</a><a href="staff.html" class="bnav-si bnav-on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a6 6 0 0112 0v2"/><path d="M16 3.13a4 4 0 010 7.75"/><path d="M21 21v-2a4 4 0 00-3-3.85"/></svg>Staff</a><div class="bnav-sheet-div"></div><button type="button" class="bnav-si bnav-si-danger" onclick="MQ&&MQ.signOut()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button></div>

<div class="modal-overlay" id="staff-modal" hidden>
  <div class="modal-card">
    <div class="modal-hd">
      <span class="modal-title" id="staff-modal-title">Add staff member</span>
      <button class="modal-close" id="staff-modal-close" type="button" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-lbl" for="sf-name">Full name</label>
        <input class="form-input" type="text" id="sf-name" placeholder="e.g. Alex Chen" autocomplete="off">
      </div>
      <div class="form-row-2">
        <div>
          <label class="form-lbl" for="sf-emp-type">Employment type</label>
          <select class="form-input" id="sf-emp-type">
            <option value="">Not set</option>
            <option value="full-time">Full-time</option>
            <option value="part-time">Part-time</option>
            <option value="subcontractor">Subcontractor</option>
            <option value="casual">Casual</option>
          </select>
        </div>
        <div>
          <label class="form-lbl" for="sf-role">Role</label>
          <select class="form-input" id="sf-role">
            <option value="Lead cleaner">Lead cleaner</option>
            <option value="Senior cleaner">Senior cleaner</option>
            <option value="Cleaner">Cleaner</option>
          </select>
        </div>
      </div>
      <div class="form-row-2">
        <div>
          <label class="form-lbl" for="sf-status">Status</label>
          <select class="form-input" id="sf-status">
            <option value="active">Active</option>
            <option value="on-leave">On leave</option>
            <option value="left">Resigned</option>
          </select>
        </div>
        <div>
          <label class="form-lbl" for="sf-since">Start date</label>
          <input class="form-input" type="date" id="sf-since" data-datepicker data-placeholder="Start date">
        </div>
      </div>
      <div class="form-row-2">
        <div>
          <label class="form-lbl" for="sf-phone">Phone</label>
          <input class="form-input" type="tel" id="sf-phone" placeholder="04xx xxx xxx">
        </div>
        <div>
          <label class="form-lbl" for="sf-email">Email</label>
          <input class="form-input" type="email" id="sf-email" placeholder="name@email.com">
        </div>
      </div>
      <div class="form-row" id="sf-abn-row" hidden>
        <label class="form-lbl" for="sf-abn">ABN</label>
        <input class="form-input" type="text" id="sf-abn" placeholder="XX XXX XXX XXX">
      </div>

      <div class="sf-sec">Emergency contact</div>
      <div class="form-row-2">
        <div>
          <label class="form-lbl" for="sf-ec-name">Contact name</label>
          <input class="form-input" type="text" id="sf-ec-name" placeholder="Full name">
        </div>
        <div>
          <label class="form-lbl" for="sf-ec-phone">Contact phone</label>
          <input class="form-input" type="tel" id="sf-ec-phone" placeholder="04xx xxx xxx">
        </div>
      </div>

      <!-- Compliance text fields: shown in both Add and Edit -->
      <div id="sf-compliance-text">
        <div class="sf-sec">Police check</div>
        <div class="form-row">
          <label class="form-lbl" for="sf-police-expiry">Expiry date</label>
          <input class="form-input" type="date" id="sf-police-expiry">
        </div>

        <div class="sf-sec">Insurance</div>
        <div class="form-row-2">
          <div>
            <label class="form-lbl" for="sf-ins-provider">Provider</label>
            <input class="form-input" type="text" id="sf-ins-provider" placeholder="e.g. QBE, Allianz">
          </div>
          <div>
            <label class="form-lbl" for="sf-ins-policy">Policy number</label>
            <input class="form-input" type="text" id="sf-ins-policy" placeholder="POL-XXXXXXX">
          </div>
        </div>
        <div class="form-row">
          <label class="form-lbl" for="sf-ins-expiry">Insurance expiry</label>
          <input class="form-input" type="date" id="sf-ins-expiry">
        </div>
      </div>

      <!-- Certificate uploads: shown only in Edit (need staff ID for storage path) -->
      <div id="sf-compliance-upload" hidden>
        <div class="sf-doc-row" style="margin-bottom:10px">
          <label class="form-lbl" style="margin-bottom:0">Police check certificate</label>
          <div style="display:flex;gap:7px;align-items:center">
            <button type="button" class="sf-doc-view" id="sf-police-view" hidden>View</button>
            <button type="button" class="sf-doc-upload" id="sf-police-upload-btn">Upload</button>
            <input type="file" id="sf-police-cert" accept=".pdf,.jpg,.jpeg,.png" style="display:none">
          </div>
        </div>
        <div class="sf-doc-row">
          <label class="form-lbl" style="margin-bottom:0">Insurance certificate</label>
          <div style="display:flex;gap:7px;align-items:center">
            <button type="button" class="sf-doc-view" id="sf-ins-view" hidden>View</button>
            <button type="button" class="sf-doc-upload" id="sf-ins-upload-btn">Upload</button>
            <input type="file" id="sf-ins-cert" accept=".pdf,.jpg,.jpeg,.png" style="display:none">
          </div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button type="button" class="delete-btn" id="staff-modal-delete" hidden style="margin-right:auto">Remove staff member</button>
      <button type="button" class="cancel-btn" id="staff-modal-cancel">Cancel</button>
      <button type="button" class="ph-btn" id="staff-modal-save">Add staff</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="roster-modal" hidden>
  <div class="modal-card" style="max-width:640px;width:100%">
    <div class="modal-hd">
      <span class="modal-title" id="roster-modal-title">Roster</span>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="ph-btn" id="roster-print-btn">Print</button>
        <button class="modal-close" id="roster-modal-close">&times;</button>
      </div>
    </div>
    <div class="modal-body" id="roster-modal-body" style="padding:0"></div>
  </div>
</div>
<script src="supabase.min.js?v=20260806"></script>
<script src="auth.js?v=20260910"></script>
<script src="datepicker.js?v=20260913"></script>
<script>
(function(){
'use strict';
window.MQ.requireAuth(function(){
var sb=MQ.sb;
var activeFilter='all',searchTerm='',editingId=null;
var allStaff=[];

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function initials(name){var p=name.trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():name.slice(0,2).toUpperCase();}
function displayDate(iso){if(!iso)return'';var d=new Date(iso+'T00:00:00');var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return m[d.getMonth()]+' '+d.getFullYear();}
function tenureText(iso){
  if(!iso)return'';var start=new Date(iso+'T00:00:00');var now=new Date();var diff=now-start;
  if(diff<0)return'Not started';var days=Math.floor(diff/86400000);
  if(days===0)return'Today';if(days===1)return'1 day';if(days<7)return days+' days';
  if(days<30){var wks=Math.floor(days/7);return wks===1?'1 week':wks+' weeks';}
  var totalMo=(now.getFullYear()-start.getFullYear())*12+(now.getMonth()-start.getMonth());
  if(totalMo<12)return totalMo===1?'1 month':totalMo+' months';
  var yrs=Math.floor(totalMo/12),rem=totalMo%12;
  return(yrs===1?'1 yr':yrs+' yrs')+(rem?' '+rem+' mo':'');
}

function complianceBadge(s){
  var now=new Date();now.setHours(0,0,0,0);
  var out=[];
  function chk(ds,lbl){
    if(!ds)return;
    var exp=new Date(ds+'T00:00:00');
    var days=Math.round((exp-now)/86400000);
    if(days<0)out.push('<span class="badge declined" style="font-size:10px">'+lbl+' expired</span>');
    else if(days<=60)out.push('<span class="badge onboarding" style="font-size:10px">'+lbl+' due</span>');
  }
  chk(s.police_check_expiry,'Police');
  chk(s.insurance_expiry,'Insurance');
  return out.join('');
}

function renderCard(s){
  var badgeCls=s.status==='on-leave'?'onboarding':s.status==='left'?'declined':'active';
  var badgeLbl=s.status==='on-leave'?'On leave':s.status==='left'?'Resigned':'Active';
  var compBadge=complianceBadge(s);
  var empLabel={  'full-time':'Full-time','part-time':'Part-time','subcontractor':'Contractor','casual':'Casual'}[s.employment_type]||'';
  return '<div class="staff-card" data-id="'+esc(s.id)+'">'+
    '<div class="sc-top">'+
      '<div class="sc-av">'+initials(s.name||'?')+'</div>'+
      '<div><div class="sc-name">'+esc(s.name)+'</div><div class="sc-role">'+(empLabel?esc(empLabel)+' · ':'')+esc(s.role||'')+'</div></div>'+
      '<span class="badge '+badgeCls+'" style="margin-left:auto">'+badgeLbl+'</span>'+
    '</div>'+
    (s.phone?'<div class="sc-row"><span class="sc-lbl">Phone</span><span class="sc-val">'+esc(s.phone)+'</span></div>':'')+
    (s.email?'<div class="sc-row"><span class="sc-lbl">Email</span><span class="sc-val">'+esc(s.email)+'</span></div>':'')+
    (s.start_date?'<div class="sc-row"><span class="sc-lbl">Since</span><span class="sc-val">'+displayDate(s.start_date)+'<span class="sc-tenure"> · '+tenureText(s.start_date)+'</span></span></div>':'')+
    (compBadge?'<div class="sc-badges">'+compBadge+'</div>':'')+
    '<div class="sc-roster-row">'+
    '<select class="sc-roster-period">'+
      '<option value="week">This week</option>'+
      '<option value="fortnight">This fortnight</option>'+
      '<option value="month">This month</option>'+
    '</select>'+
    '<button class="sc-roster-btn" data-roster-id="'+esc(s.id)+'" data-roster-name="'+esc(s.name||'')+'">View roster →</button>'+
    '</div>'+
  '</div>';
}

function renderAll(){
  var active=allStaff.filter(function(s){return(s.status||'active')==='active';}).length;
  var yr=new Date().getFullYear();
  var newThisYear=allStaff.filter(function(s){return s.start_date&&s.start_date.slice(0,4)===String(yr);}).length;
  var roles=[];
  allStaff.forEach(function(s){if(s.role&&roles.indexOf(s.role)===-1)roles.push(s.role);});
  var statsEl=document.querySelector('.stats');
  if(statsEl)statsEl.innerHTML=
    '<div class="stat"><div class="stat-lbl">Total staff</div><div class="stat-val">'+allStaff.length+'</div><div class="stat-hint">'+active+' active</div></div>'+
    '<div class="stat"><div class="stat-lbl">Active</div><div class="stat-val">'+active+'</div><div class="stat-hint">On the team</div></div>'+
    '<div class="stat"><div class="stat-lbl">Roles</div><div class="stat-val">'+roles.length+'</div><div class="stat-hint">Distinct roles</div></div>'+
    '<div class="stat"><div class="stat-lbl">New this year</div><div class="stat-val">'+newThisYear+'</div><div class="stat-hint">Joined in '+yr+'</div></div>';
  var visible=allStaff.filter(function(s){
    var mf=activeFilter==='all'||(s.status||'active')===activeFilter;
    var ms=!searchTerm||(s.name+' '+(s.role||'')).toLowerCase().indexOf(searchTerm)!==-1;
    return mf&&ms;
  });
  document.getElementById('staff-grid').innerHTML=visible.map(renderCard).join('')||
    '<div style="padding:28px 0;color:var(--stone);font-size:13px">No staff match your filter.</div>';
}

function reload(){
  sb.from('staff').select('id,name,role,phone,email,start_date,status,employment_type,abn,emergency_contact,emergency_phone,police_check_expiry,police_check_path,insurance_provider,insurance_policy_no,insurance_expiry,insurance_cert_path').order('name').then(function(r){allStaff=r.data||[];renderAll();});
}

var modal=document.getElementById('staff-modal');
var saveBtn=document.getElementById('staff-modal-save');
var delBtn=document.getElementById('staff-modal-delete');
var titleEl=document.getElementById('staff-modal-title');

function updateDocUI(type,path){
  var viewBtn=document.getElementById('sf-'+type+'-view');
  var uploadBtn=document.getElementById('sf-'+type+'-upload-btn');
  if(viewBtn)viewBtn.hidden=!path;
  if(uploadBtn)uploadBtn.textContent=path?'Replace':'Upload certificate';
}

function uploadDoc(staffId,docType,file,cb){
  var path=staffId+'/'+docType;
  sb.storage.from('staff-documents').upload(path,file,{upsert:true}).then(function(r){
    if(r.error){alert('Upload failed: '+(r.error.message||'Unknown error'));return;}
    cb(path);
  });
}

function viewDoc(path){
  sb.storage.from('staff-documents').createSignedUrl(path,3600).then(function(r){
    if(r.data&&r.data.signedUrl)window.open(r.data.signedUrl,'_blank');
    else alert('Could not generate view link.');
  });
}

function toggleAbn(){
  var isSubco=document.getElementById('sf-emp-type').value==='subcontractor';
  document.getElementById('sf-abn-row').hidden=!isSubco;
}

function openNewModal(){
  editingId=null;
  titleEl.textContent='Add staff member';saveBtn.textContent='Add staff';delBtn.hidden=true;
  ['sf-name','sf-phone','sf-email','sf-abn','sf-ec-name','sf-ec-phone','sf-police-expiry','sf-ins-provider','sf-ins-policy','sf-ins-expiry'].forEach(function(id){document.getElementById(id).value='';});
  document.getElementById('sf-emp-type').value='';
  document.getElementById('sf-role').value='Cleaner';
  document.getElementById('sf-status').value='active';
  document.getElementById('sf-since').value='';
  document.getElementById('sf-abn-row').hidden=true;
  document.getElementById('sf-compliance-upload').hidden=true;
  modal.hidden=false;
  setTimeout(function(){document.getElementById('sf-name').focus();},40);
}
function openEditModal(s){
  editingId=s.id;
  titleEl.textContent='Edit staff member';saveBtn.textContent='Save changes';delBtn.hidden=false;
  document.getElementById('sf-name').value=s.name||'';
  document.getElementById('sf-emp-type').value=s.employment_type||'';
  document.getElementById('sf-role').value=s.role||'Cleaner';
  document.getElementById('sf-phone').value=s.phone||'';
  document.getElementById('sf-email').value=s.email||'';
  document.getElementById('sf-since').value=s.start_date||'';
  document.getElementById('sf-status').value=s.status||'active';
  document.getElementById('sf-abn').value=s.abn||'';
  document.getElementById('sf-ec-name').value=s.emergency_contact||'';
  document.getElementById('sf-ec-phone').value=s.emergency_phone||'';
  document.getElementById('sf-abn-row').hidden=s.employment_type!=='subcontractor';
  document.getElementById('sf-compliance-upload').hidden=false;
  document.getElementById('sf-police-expiry').value=s.police_check_expiry||'';
  document.getElementById('sf-ins-provider').value=s.insurance_provider||'';
  document.getElementById('sf-ins-policy').value=s.insurance_policy_no||'';
  document.getElementById('sf-ins-expiry').value=s.insurance_expiry||'';
  updateDocUI('police',s.police_check_path);
  updateDocUI('ins',s.insurance_cert_path);
  modal.hidden=false;
  setTimeout(function(){document.getElementById('sf-name').focus();},40);
}
function closeModal(){modal.hidden=true;editingId=null;}

document.getElementById('new-staff-btn').addEventListener('click',openNewModal);
document.getElementById('staff-modal-close').addEventListener('click',closeModal);
document.getElementById('staff-modal-cancel').addEventListener('click',closeModal);
modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!modal.hidden)closeModal();});
document.getElementById('sf-emp-type').addEventListener('change',toggleAbn);

delBtn.addEventListener('click',function(){
  if(!editingId)return;
  if(!confirm('Remove this staff member? This cannot be undone.'))return;
  sb.from('staff').delete().eq('id',editingId).then(function(){closeModal();reload();});
});

saveBtn.addEventListener('click',function(){
  var name=document.getElementById('sf-name').value.trim();
  if(!name){document.getElementById('sf-name').focus();return;}
  var row={
    name:name,
    role:document.getElementById('sf-role').value,
    employment_type:document.getElementById('sf-emp-type').value||null,
    abn:document.getElementById('sf-abn').value.trim()||null,
    phone:document.getElementById('sf-phone').value.trim(),
    email:document.getElementById('sf-email').value.trim(),
    start_date:document.getElementById('sf-since').value||null,
    status:document.getElementById('sf-status').value,
    emergency_contact:document.getElementById('sf-ec-name').value.trim()||null,
    emergency_phone:document.getElementById('sf-ec-phone').value.trim()||null,
    police_check_expiry:document.getElementById('sf-police-expiry').value||null,
    insurance_provider:document.getElementById('sf-ins-provider').value.trim()||null,
    insurance_policy_no:document.getElementById('sf-ins-policy').value.trim()||null,
    insurance_expiry:document.getElementById('sf-ins-expiry').value||null
  };
  if(editingId){
    sb.from('staff').update(row).eq('id',editingId).then(function(){closeModal();reload();});
  } else {
    sb.from('staff').insert(row).then(function(){closeModal();reload();});
  }
});

// Document upload / view wiring
document.getElementById('sf-police-upload-btn').addEventListener('click',function(){document.getElementById('sf-police-cert').click();});
document.getElementById('sf-police-cert').addEventListener('change',function(){
  var file=this.files[0];
  if(!file||!editingId)return;
  var btn=document.getElementById('sf-police-upload-btn');
  btn.textContent='Uploading…';btn.disabled=true;
  uploadDoc(editingId,'police-check',file,function(path){
    sb.from('staff').update({police_check_path:path}).eq('id',editingId).then(function(){
      btn.disabled=false;updateDocUI('police',path);
      var found=null;allStaff.forEach(function(s){if(s.id===editingId)found=s;});
      if(found)found.police_check_path=path;
    });
  });
});
document.getElementById('sf-police-view').addEventListener('click',function(){
  var found=null;allStaff.forEach(function(s){if(s.id===editingId)found=s;});
  if(found&&found.police_check_path)viewDoc(found.police_check_path);
});

document.getElementById('sf-ins-upload-btn').addEventListener('click',function(){document.getElementById('sf-ins-cert').click();});
document.getElementById('sf-ins-cert').addEventListener('change',function(){
  var file=this.files[0];
  if(!file||!editingId)return;
  var btn=document.getElementById('sf-ins-upload-btn');
  btn.textContent='Uploading…';btn.disabled=true;
  uploadDoc(editingId,'insurance-cert',file,function(path){
    sb.from('staff').update({insurance_cert_path:path}).eq('id',editingId).then(function(){
      btn.disabled=false;updateDocUI('ins',path);
      var found=null;allStaff.forEach(function(s){if(s.id===editingId)found=s;});
      if(found)found.insurance_cert_path=path;
    });
  });
});
document.getElementById('sf-ins-view').addEventListener('click',function(){
  var found=null;allStaff.forEach(function(s){if(s.id===editingId)found=s;});
  if(found&&found.insurance_cert_path)viewDoc(found.insurance_cert_path);
});

function openRoster(staffId,staffName,period){
  var rModal=document.getElementById('roster-modal');
  var rBody=document.getElementById('roster-modal-body');
  document.getElementById('roster-modal-title').textContent=staffName;
  rBody.innerHTML='<div style="padding:32px;text-align:center;color:var(--stone);font-size:13px">Loading…</div>';
  rModal.hidden=false;

  var today=new Date();
  var dow=(today.getDay()+6)%7;
  var mon=new Date(today);mon.setDate(today.getDate()-dow);
  function isoDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
  var startDate,endDate,periodLabel;
  if(period==='month'){
    startDate=new Date(today.getFullYear(),today.getMonth(),1);
    endDate=new Date(today.getFullYear(),today.getMonth()+1,0);
    periodLabel='Month of '+['January','February','March','April','May','June','July','August','September','October','November','December'][today.getMonth()]+' '+today.getFullYear();
  } else if(period==='fortnight'){
    startDate=new Date(mon);
    endDate=new Date(mon);endDate.setDate(mon.getDate()+13);
    periodLabel='Fortnight: Mon '+startDate.getDate()+' – Sun '+endDate.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][endDate.getMonth()]+' '+endDate.getFullYear();
  } else {
    startDate=new Date(mon);
    endDate=new Date(mon);endDate.setDate(mon.getDate()+6);
    periodLabel='Week of Mon '+startDate.getDate()+' – Sun '+endDate.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][endDate.getMonth()]+' '+endDate.getFullYear();
  }
  var startISO=isoDate(startDate),endISO=isoDate(endDate);
  var DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtHdr(ds){var d=new Date(ds+'T00:00:00');return DAYS[((d.getDay()+6)%7)].toUpperCase()+' '+d.getDate()+' '+MONTHS[d.getMonth()].toUpperCase();}
  function fmtTime(t){if(!t)return'—';var p=t.split(':');var h=parseInt(p[0],10);var m=p[1];var ampm=h>=12?'pm':'am';var h12=h%12||12;return h12+':'+(m||'00')+' '+ampm;}
  function typeLbl(t){return t==='deep'?'Deep clean':t==='maintenance'?'Maintenance':t||'—';}
  function esc2(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  sb.from('jobs')
    .select('id,job_number,client_id,client_name,site,date,start_time,start_tz,type,status')
    .eq('assigned_staff_id',staffId)
    .gte('date',startISO).lte('date',endISO)
    .neq('status','cancelled')
    .order('date').order('start_time')
    .then(function(r){
      var jobs=r.data||[];
      var clientIds=[];
      jobs.forEach(function(j){if(j.client_id&&clientIds.indexOf(j.client_id)===-1)clientIds.push(j.client_id);});

      function buildRoster(addrMap){
        var byDay={};
        var totalDays=Math.round((endDate-startDate)/86400000)+1;
        for(var i=0;i<totalDays;i++){var d=new Date(startDate);d.setDate(startDate.getDate()+i);byDay[isoDate(d)]=[];}
        jobs.forEach(function(j){if(byDay[j.date])byDay[j.date].push(j);});

        var dayRows='';
        Object.keys(byDay).sort().forEach(function(dateKey){
          var jj=byDay[dateKey];
          dayRows+='<div class="rp-day-block"><div class="rp-day-hd">'+fmtHdr(dateKey)+'</div>';
          if(!jj.length){
            dayRows+='<div class="rp-no-jobs">No jobs scheduled</div>';
          } else {
            jj.forEach(function(j){
              var done=j.status==='completed';
              var timeStr=fmtTime(j.start_time)+(j.start_tz?' · '+j.start_tz:'');
              var typeBg=j.type==='deep'?'rgba(58,107,78,.1)':'rgba(0,0,0,.07)';
              var typeCol=j.type==='deep'?'#3a6b4e':'#111111';
              var addr=addrMap[j.client_id]||j.site||'';
              dayRows+=
                '<div class="rp-job-row'+(done?' done':'')+'">'+
                '<div class="rp-job-time">'+esc2(timeStr)+'</div>'+
                '<div>'+
                  '<div class="rp-job-name">'+esc2(j.client_name||'—')+'</div>'+
                  (addr?'<div class="rp-job-addr">'+esc2(addr)+'</div>':'')+
                  (done?'<div class="rp-job-done">✓ Completed</div>':'')+
                '</div>'+
                '<div class="rp-job-right">'+
                  '<span class="rp-job-type" style="background:'+typeBg+';color:'+typeCol+'">'+esc2(typeLbl(j.type))+'</span>'+
                  (j.job_number?'<span class="rp-job-num">#'+esc2(j.job_number)+'</span>':'')+
                '</div>'+
                '</div>';
            });
          }
          dayRows+='</div>';
        });

        var totalJobs=jobs.length;
        var jobCountLabel=totalJobs+(totalJobs===1?' job':' jobs')+(period==='month'?' this month':period==='fortnight'?' this fortnight':' this week');
        rBody.innerHTML=
          '<div class="rp-page">'+
          '<div class="rp-sub">'+esc2(periodLabel)+'</div>'+
          '<div class="rp-count">'+esc2(jobCountLabel)+'</div>'+
          dayRows+
          '</div>';
      }

      if(clientIds.length){
        sb.from('clients').select('id,site_address').in('id',clientIds).then(function(cr){
          var addrMap={};
          (cr.data||[]).forEach(function(c){addrMap[c.id]=c.site_address||'';});
          buildRoster(addrMap);
        });
      } else {
        buildRoster({});
      }
    });
}

document.getElementById('staff-grid').addEventListener('click',function(e){
  var rBtn=e.target.closest('.sc-roster-btn');
  if(rBtn){
    var periodSel=rBtn.closest('.sc-roster-row').querySelector('.sc-roster-period');
    openRoster(rBtn.dataset.rosterId,rBtn.dataset.rosterName,periodSel?periodSel.value:'week');
    return;
  }
  if(e.target.closest('.sc-roster-row'))return;
  var card=e.target.closest('.staff-card');
  if(!card)return;
  var sid=card.dataset.id;
  var found=null;allStaff.forEach(function(s){if(s.id===sid)found=s;});
  if(found)openEditModal(found);
});

document.getElementById('roster-modal-close').addEventListener('click',function(){document.getElementById('roster-modal').hidden=true;});
document.getElementById('roster-print-btn').addEventListener('click',function(){window.print();});
document.getElementById('roster-modal').addEventListener('click',function(e){if(e.target===this)this.hidden=true;});
var sfPills=document.querySelectorAll('.f-pill[data-sf]');
sfPills.forEach(function(p){
  p.addEventListener('click',function(){
    sfPills.forEach(function(x){x.classList.remove('on');});
    this.classList.add('on');activeFilter=this.getAttribute('data-sf');renderAll();
  });
});

var staffSearchEl=document.getElementById('staff-search');
if(staffSearchEl)staffSearchEl.addEventListener('input',function(){searchTerm=this.value.trim().toLowerCase();renderAll();});

var bnavMore=document.getElementById('bnav-more');
var bnavSheet=document.getElementById('bnav-sheet');
var bnavBg=document.getElementById('bnav-bg');
function bnavClose(){bnavSheet.classList.remove('open');bnavBg.classList.remove('open');}
if(bnavMore)bnavMore.addEventListener('click',function(){var o=bnavSheet.classList.contains('open');o?bnavClose():(bnavSheet.classList.add('open'),bnavBg.classList.add('open'));});
if(bnavBg)bnavBg.addEventListener('click',bnavClose);

reload();
function refreshInqBadge(){MQ.sb.from('inquiries').select('id',{count:'exact',head:true}).eq('status','new').then(function(r){
  var n=r.count||0;['inq-notif','bnav-inq-notif'].forEach(function(id){var el=document.getElementById(id);if(!el)return;if(n>0){el.textContent=n>9?'9+':String(n);el.classList.add('show');}else el.classList.remove('show');});
});}
setTimeout(refreshInqBadge,0);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')refreshInqBadge();});
}); // end requireAuth
})();
</script>
</body>
