<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Staff Login | MyQuest</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20260622">
  <link rel="stylesheet" href="login.css?v=20260701">
</head>
<body class="login-page">

  <a href="#login-main" class="skip-link">Skip to main content</a>

  <main id="login-main" class="login-main">
    <div class="login-card">

      <!-- ══════════════════════════════════════════════════════
           STATE 1: Login (email + password)
      ══════════════════════════════════════════════════════ -->
      <div class="login-state" id="state-login">

        <div class="login-logo-wrap">
          <svg width="140" height="36" viewBox="0 0 140 36" fill="none" aria-hidden="true">
            <path d="M4 18 C4 8 12 2 20 2 C20 2 20 14 12 20 C8 23 4 22 4 18 Z" fill="#000"/>
            <path d="M20 2 C20 2 22 16 14 22" stroke="#000" stroke-width="1.5" stroke-linecap="round" fill="none"/>
            <text x="28" y="25" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="18" fill="#1a1a1a">MyQuest</text>
          </svg>
        </div>

        <h1 class="login-heading">Welcome back</h1>
        <p class="login-sub">Sign in with your work email and password.</p>

        <div class="login-error-block" id="login-error" hidden></div>

        <form id="login-form" class="login-form" novalidate autocomplete="on">
          <div class="form-group">
            <label class="form-label" for="login-email">Email Address</label>
            <input class="form-input" type="email" id="login-email" name="email"
              autocomplete="email" placeholder="you@company.com.au" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="pw-input-wrap">
              <input class="form-input" type="password" id="login-password" name="password"
                autocomplete="current-password" placeholder="••••••••••" required>
              <button type="button" class="pw-toggle" id="pw-toggle-login" aria-label="Show password">
                <svg id="pw-eye-login" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-primary login-submit" id="login-submit">Sign In</button>
        </form>

      </div>

      <!-- ══════════════════════════════════════════════════════
           STATE 2: Success
      ══════════════════════════════════════════════════════ -->
      <div class="login-state" id="state-success" hidden>
        <div class="login-check" aria-hidden="true">
          <svg class="check-icon" viewBox="0 0 72 72" fill="none">
            <circle class="check-circle" cx="36" cy="36" r="32" stroke="#000" stroke-width="3"/>
            <path class="check-mark" d="M20 36L30 46L52 24" stroke="#000" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <h2 class="login-heading">Signed in</h2>
        <p class="login-sub">Taking you to the dashboard…</p>
      </div>

    </div>
  </main>

  <script src="dashboard/js/supabase.js?v=20260622"></script>
  <script src="dashboard/js/supabase-client.js?v=20260622"></script>
  <script src="dashboard/js/store.js?v=20260622"></script>
  <script src="login.js?v=20260704"></script>

</body>
</html>
