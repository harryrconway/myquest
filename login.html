<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href=/assets/favicon.svg type="image/svg+xml"><link rel="icon" href=/favicon.ico sizes=any>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name=theme-color content=#111111>
<title>Sign in — MyQuest</title>
<link rel=preconnect href=https://fonts.googleapis.com>
<link rel=preconnect href=https://fonts.gstatic.com crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#ffffff;
  --bg-deep:#f5f5f5;
  --card:#ffffff;
  --txt:#111111;
  --stone:#666666;
  --line:rgba(0,0,0,0.1);
  --btn-bg:#111111;
  --btn-fg:#ffffff;
  --err:#c0392b;
}

html,body{height:100%}
body{
  background:var(--bg);
  font-family:'DynaPuff',system-ui;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100%;
  padding:24px 16px;
}

.card{
  width:100%;
  max-width:400px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  padding:44px 48px 52px;
}

.wordmark{
  display:block;
  line-height:1;
}

.eyebrow{
  font-size:10px;
  font-weight:600;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--stone);
  margin-top:36px;
}

h1{
  font-size:34px;
  font-weight:300;
  letter-spacing:-.03em;
  color:var(--txt);
  line-height:1.1;
  text-wrap:balance;
  margin-top:6px;
}

.form-area{margin-top:40px}

.f-label{
  display:block;
  font-size:10px;
  font-weight:600;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--stone);
  margin-bottom:11px;
}

.f-input{
  display:block;
  width:100%;
  background:rgba(0,0,0,0.04);
  border:1.5px solid var(--line);
  border-radius:10px;
  color:var(--txt);
  -webkit-text-fill-color:var(--txt);
  font-size:16px;
  font-weight:400;
  font-family:inherit;
  padding:14px 16px;
  outline:none;
  transition:border-color .15s,background .15s;
  -webkit-appearance:none;
  appearance:none;
}
.f-input:focus{border-color:var(--txt);background:rgba(0,0,0,0.03)}
.f-input::placeholder{color:var(--stone);-webkit-text-fill-color:var(--stone);opacity:.6}
.f-input:-webkit-autofill,
.f-input:-webkit-autofill:hover,
.f-input:-webkit-autofill:focus{
  -webkit-box-shadow:0 0 0 1000px #f5f5f5 inset;
  -webkit-text-fill-color:#111111;
  border-color:var(--txt);
  transition:background-color 5000s ease-in-out 0s;
}

.btn{
  display:block;
  width:100%;
  margin-top:32px;
  background:var(--btn-bg);
  color:var(--btn-fg);
  border:none;
  border-radius:999px;
  padding:16px 24px;
  font-family:inherit;
  font-size:13px;
  font-weight:500;
  letter-spacing:.06em;
  cursor:pointer;
  transition:opacity .15s;
}
.btn:hover:not(:disabled){opacity:.82}
.btn:disabled{opacity:.5;cursor:default}

.err{
  display:none;
  margin-top:16px;
  font-size:12px;
  color:var(--err);
  line-height:1.5;
}

/* sent state */
#sent{display:none;text-align:center;padding:4px 0}
.sent-icon{
  width:48px;height:48px;
  border-radius:50%;
  background:rgba(0,0,0,0.07);
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 22px;
}
.sent-h{font-size:22px;font-weight:300;letter-spacing:-.02em;color:var(--txt);margin-bottom:10px}
.sent-p{font-size:13px;color:var(--stone);line-height:1.7}
.sent-em{font-weight:500;color:var(--txt);display:block;margin-top:2px;word-break:break-all}
.back{
  display:inline-block;margin-top:28px;
  font-size:12px;color:var(--stone);
  background:none;border:none;font-family:inherit;
  cursor:pointer;
  text-decoration:underline;text-underline-offset:3px;
  transition:color .15s;
}
.back:hover{color:var(--txt)}

@media(max-width:480px){
  .card{padding:36px 28px 44px;border-radius:16px}
  h1{font-size:28px}
}
#flt{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:20px;z-index:300;display:flex;flex-direction:column;align-items:flex-end;gap:10px}.flt-r{color:var(--navy);border-radius:14px;padding:14px 16px;text-decoration:none;display:flex;flex-direction:column;gap:8px}.flt-r:hover .flt-garr{transform:translate(2px,-2px)}.flt-rl{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.45;font-weight:600}.flt-rr{display:flex;align-items:center;gap:12px}.flt-gmark{flex:none;width:28px;height:28px;display:block}.flt-gmark svg{width:100%;height:100%;display:block}.flt-gcol{display:flex;flex-direction:column;gap:3px}.flt-gline1{font-family:var(--disp);display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600}.flt-gstars{color:#fbbc04;letter-spacing:2px;font-size:14px}.flt-gline2{color:#5f6368;font-size:12px;font-weight:400}.flt-garr{color:var(--stone);margin-left:auto;font-size:14px;padding-left:8px;transition:transform .2s}@media(width<=560px){.flt-r{display:none}}</style>
</head>
<body>

<div class="card">
  <img src=/assets/myquest-logo.svg alt=MyQuest height=36 class=wordmark>

  <p class="eyebrow">Staff portal</p>
  <h1>Sign in to<br>continue</h1>

  <div id="form-area" class="form-area">
    <form id="form" autocomplete="on" novalidate>
      <label class="f-label" for="em">Email address</label>
      <input class="f-input" type="email" id="em" name="email"
             placeholder="you@example.com" autocomplete="email" inputmode="email">
      <button class="btn" id="btn" type="submit">Send magic link</button>
    </form>
    <p class="err" id="err"></p>
  </div>

  <div id="sent">
    <div class="sent-icon">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:var(--txt)"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <p class="sent-h">Check your inbox</p>
    <p class="sent-p">We sent a sign-in link to<span class="sent-em" id="sent-em"></span></p>
    <button class="back" id="back" type="button">Use a different email</button>
  </div>
</div>

<script src="crm/supabase.min.js"></script>
<script>
(function(){
'use strict';
var SURL='https://sfyalevtmdiwvefnsaja.supabase.co';
var SKEY='sb_publishable_7efLI_KQ7QAkZenEyXeuOA_qNnnH8U2';
var ALLOWED=['harryrconway@icloud.com','hello@myquest.au'];
var sb=supabase.createClient(SURL,SKEY);

function goApp(){location.href='/crm/overview.html';}

sb.auth.onAuthStateChange(function(ev,session){
  if(!session)return;
  if(ALLOWED.indexOf(session.user.email)===-1){
    sb.auth.signOut().then(function(){showErr('This email is not authorised to access MyQuest.');});
    return;
  }
  goApp();
});

sb.auth.getSession().then(function(r){
  var s=r.data.session;
  if(!s)return;
  if(ALLOWED.indexOf(s.user.email)===-1){sb.auth.signOut();return;}
  goApp();
});

function showErr(msg){
  var el=document.getElementById('err');
  el.textContent=msg;
  el.style.display='block';
}

document.getElementById('form').addEventListener('submit',function(e){
  e.preventDefault();
  var email=document.getElementById('em').value.trim().toLowerCase();
  if(!email){document.getElementById('em').focus();return;}
  document.getElementById('err').style.display='none';
  var btn=document.getElementById('btn');
  btn.textContent='Sending…';
  btn.disabled=true;
  sb.auth.signInWithOtp({
    email:email,
    options:{emailRedirectTo:'https://myquest.au/login.html'}
  }).then(function(r){
    if(r.error){
      showErr(r.error.message||'Something went wrong. Please try again.');
      btn.textContent='Send magic link';
      btn.disabled=false;
      return;
    }
    document.getElementById('form-area').style.display='none';
    document.getElementById('sent-em').textContent=email;
    document.getElementById('sent').style.display='block';
  });
});

document.getElementById('back').addEventListener('click',function(){
  document.getElementById('sent').style.display='none';
  document.getElementById('form-area').style.display='block';
  var btn=document.getElementById('btn');
  btn.textContent='Send magic link';
  btn.disabled=false;
  document.getElementById('em').value='';
  document.getElementById('err').style.display='none';
  document.getElementById('em').focus();
});
})();
</script>
<aside id=flt aria-label="Reviews and enquiry"><a class=flt-r href="https://www.google.com/maps/place/MyQuest/@-29.0546366,151.5817393,8z/data=!4m8!3m7!1s0xa00502a8c1e9b53b:0xd84f383bf9f874b4!8m2!3d-29.0635115!4d152.903426!9m1!1b1!16s%2Fg%2F11nqdxgs_4" target=_blank rel="noopener noreferrer" aria-label="5.0 rating on Google, 4 reviews"><span class=flt-rl>Reviews</span><div class=flt-rr><span class=flt-gmark aria-hidden=true><svg viewBox="0 0 48 48"><path d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.8-2.1 5.1-4.4 6.7v5.5h7.1c4.2-3.8 6.6-9.5 6.6-16.2z" fill="#4285F4"/><path d="M24 46c6 0 10.9-2 14.5-5.3l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.2 15.5 46 24 46z" fill="#34A853"/><path d="M11.8 28.3c-.4-1.3-.7-2.8-.7-4.3s.2-3 .7-4.3V14H4.5C3 17 2.1 20.4 2.1 24s.9 7 2.4 10l7.3-5.7z" fill="#FBBC05"/><path d="M24 10.8c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 4.2 30 2 24 2 15.5 2 8.1 6.8 4.5 14l7.3 5.7c1.7-5.2 6.5-8.9 12.2-8.9z" fill="#EA4335"/></svg></span><div class=flt-gcol><span class=flt-gline1>5.0 <span aria-hidden=true class=flt-gstars>&#9733;&#9733;&#9733;&#9733;&#9733;</span></span><span class=flt-gline2>4 Google reviews</span></div><span aria-hidden=true class=flt-garr>&#x2197;</span></div></a></aside></body>
</html>
